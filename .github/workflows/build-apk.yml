name: Android AIDE - GitHub Actions Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: androidaide-signing.jks
      KEY_ALIAS: androidaide
      KEYSTORE_PASSWORD: androidaide-store-password
      KEY_PASSWORD: androidaide-password

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 3. CHECK ENVIRONMENT
      # ==========================================================

      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID AIDE BUILD"
          echo "=========================================="
          echo ""

          echo "Java:"
          java -version

          echo ""
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo ""
          echo "Branch:"
          echo "$GITHUB_REF_NAME"

          echo ""
          echo "Workspace:"
          pwd

      # ==========================================================
      # 4. CHECK PROJECT ZIP
      # ==========================================================

      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="
          echo ""

          if [ ! -f "build-input/project.zip" ]; then

            echo "ERROR: build-input/project.zip not found."
            echo ""

            echo "Current directory:"
            pwd

            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo "Project ZIP:"
          ls -lh build-input/project.zip

          echo ""
          echo "ZIP exists successfully."

      # ==========================================================
      # 5. EXTRACT PROJECT
      # ==========================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="
          echo ""

          rm -rf android-project

          mkdir -p android-project

          unzip -q build-input/project.zip \
            -d android-project

          echo "Extraction completed."

          echo ""
          echo "Extracted files:"
          find android-project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # ==========================================================
      # 6. FIND ANDROID PROJECT ROOT
      # ==========================================================

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING ANDROID PROJECT ROOT"
          echo "=========================================="
          echo ""

          PROJECT_ROOT=""

          # Normal structure
          if [ -f "android-project/settings.gradle" ]; then

            PROJECT_ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project"

          else

            SETTINGS_FILE=$(find android-project \
              -maxdepth 10 \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then

              PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then

            echo "ERROR: Android project root not found."
            echo ""

            echo "Project files:"
            find android-project \
              -maxdepth 10 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

      # ==========================================================
      # 7. CHECK GRADLE
      # ==========================================================

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "CHECKING GRADLE"
          echo "=========================================="
          echo ""

          if [ ! -f "gradlew" ]; then

            echo "ERROR: gradlew not found."
            echo ""

            echo "Project files:"
            find . \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      # ==========================================================
      # 8. INITIALIZE SIGNING
      # ==========================================================

      - name: Initialize signing
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INITIALIZING SIGNING"
          echo "=========================================="
          echo ""

          echo "CREATE_NEW_KEY=true" >> "$GITHUB_ENV"

          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          echo "SIGNING_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Signing configuration initialized."

      # ==========================================================
      # 9. RESTORE PREVIOUS SIGNING KEY
      # ==========================================================

      - name: Restore previous signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR SIGNING KEY"
          echo "=========================================="
          echo ""

          cd "$GITHUB_WORKSPACE"

          echo "Checking previous artifacts..."

          ARTIFACT_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")

          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '
            [
              .artifacts[]
              | select(.name == "AndroidAIDE-Signing-Key")
              | select(.expired == false)
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')

          # ------------------------------------------------------
          # FIRST BUILD
          # ------------------------------------------------------

          if [ -z "$ARTIFACT_ID" ]; then

            echo ""
            echo "No previous signing key artifact found."
            echo ""

            echo "FIRST BUILD"
            echo ""

            echo "A new signing key will be generated."

            echo "CREATE_NEW_KEY=true" >> "$GITHUB_ENV"

            exit 0
          fi

          # ------------------------------------------------------
          # EXISTING KEY
          # ------------------------------------------------------

          echo ""
          echo "Previous signing key found."

          echo ""
          echo "Artifact ID:"
          echo "$ARTIFACT_ID"

          rm -rf signing-restore

          mkdir -p signing-restore

          echo ""
          echo "Downloading signing key..."

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > signing-key.zip

          if [ ! -s signing-key.zip ]; then

            echo ""
            echo "ERROR: Signing key artifact download failed."

            exit 1
          fi

          echo ""
          echo "Extracting signing key..."

          unzip -q signing-key.zip \
            -d signing-restore

          FOUND_KEY=$(find signing-restore \
            \( \
              -name "*.jks" \
              -o \
              -name "*.keystore" \
            \) \
            -type f \
            -print -quit)

          if [ -z "$FOUND_KEY" ]; then

            echo ""
            echo "ERROR: No keystore found inside artifact."

            echo ""
            echo "Artifact contents:"

            find signing-restore \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          echo ""
          echo "Signing key file found."

          cp "$FOUND_KEY" \
            "$PROJECT_ROOT/$KEYSTORE_FILE"

          chmod 600 \
            "$PROJECT_ROOT/$KEYSTORE_FILE"

          echo "CREATE_NEW_KEY=false" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SIGNING KEY RESTORED"
          echo "=========================================="
          echo ""

          echo "Existing signing key will be reused."

      # ==========================================================
      # 10. CREATE SIGNING KEY
      # ==========================================================

      - name: Create signing key if needed
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ "$CREATE_NEW_KEY" != "true" ]; then

            echo "=========================================="
            echo "USING EXISTING SIGNING KEY"
            echo "=========================================="

            exit 0
          fi

          echo "=========================================="
          echo "CREATING INITIAL SIGNING KEY"
          echo "=========================================="
          echo ""

          if [ -f "$KEYSTORE_FILE" ]; then

            echo "Keystore already exists."

            echo "CREATE_NEW_KEY=false" >> "$GITHUB_ENV"

            exit 0
          fi

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "$SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"

          chmod 600 "$KEYSTORE_FILE"

          echo ""
          echo "Initial signing key created successfully."

      # ==========================================================
      # 11. VERIFY SIGNING KEY
      # ==========================================================

      - name: Verify signing key
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "VERIFYING SIGNING KEY"
          echo "=========================================="
          echo ""

          if [ ! -f "$KEYSTORE_FILE" ]; then

            echo "ERROR: Keystore does not exist."

            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo "ERROR: Keystore is empty."

            exit 1
          fi

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            > /tmp/signing-check.txt

          echo "Signing key verified successfully."

      # ==========================================================
      # 12. CONFIGURE ANDROID SIGNING
      # ==========================================================

      - name: Configure Android signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "CONFIGURING ANDROID SIGNING"
          echo "=========================================="
          echo ""

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then

            echo "ERROR: app/build.gradle not found."

            echo ""
            echo "Checking for build.gradle files:"

            find . \
              -name "build.gradle" \
              -type f \
              -print

            exit 1
          fi

          SIGNING_GRADLE="androidaide-signing.gradle"

          cat > "$SIGNING_GRADLE" <<'EOF'
android {

    signingConfigs {

        androidAide {

            storeFile file("$rootDir/androidaide-signing.jks")

            storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")

            keyAlias System.getenv("SIGNING_KEY_ALIAS")

            keyPassword System.getenv("SIGNING_KEY_PASSWORD")

        }

    }

    buildTypes {

        debug {

            signingConfig signingConfigs.androidAide

        }

    }

}
EOF

          echo "Signing script created."

          if grep -q "androidaide-signing.gradle" "$APP_GRADLE"; then

            echo ""
            echo "Signing script already applied."

          else

            echo ""
            echo "Applying signing script..."

            printf '\napply from: "$rootDir/androidaide-signing.gradle"\n' \
              >> "$APP_GRADLE"

          fi

          echo ""
          echo "Signing configuration completed."

      # ==========================================================
      # 13. VERIFY GRADLE SIGNING CONFIG
      # ==========================================================

      - name: Verify Gradle signing configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "VERIFYING GRADLE SIGNING CONFIGURATION"
          echo "=========================================="
          echo ""

          echo "Signing Gradle file:"

          cat androidaide-signing.gradle

          echo ""

          echo "Keystore:"

          ls -lh "$KEYSTORE_FILE"

          echo ""

          echo "Checking app/build.gradle:"

          grep -n \
            "androidaide-signing.gradle" \
            app/build.gradle \
            || true

      # ==========================================================
      # 14. BUILD APK
      # ==========================================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="
          echo ""

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ==========================================================
      # 15. FIND APK
      # ==========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="
          echo ""

          APK_FILE=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            | head -1)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK not found."

            echo ""
            echo "All APK files:"

            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          ABSOLUTE_APK="$GITHUB_WORKSPACE/$PROJECT_ROOT/$APK_FILE"

          echo "APK_FILE=$ABSOLUTE_APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          echo "$ABSOLUTE_APK"

      # ==========================================================
      # 16. VERIFY APK
      # ==========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="
          echo ""

          if [ ! -f "$APK_FILE" ]; then

            echo "ERROR: APK does not exist."

            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then

            echo "ERROR: APK is empty."

            exit 1
          fi

          echo "APK successfully built."

          echo ""

          ls -lh "$APK_FILE"

      # ==========================================================
      # 17. UPLOAD APK ARTIFACT
      # ==========================================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 18. SAVE SIGNING KEY
      # ==========================================================

      - name: Save signing key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: ${{ env.PROJECT_ROOT }}/${{ env.KEYSTORE_FILE }}
          if-no-files-found: ignore
          retention-days: 90

      # ==========================================================
      # 19. BUILD COMPLETE
      # ==========================================================

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "ANDROID AIDE BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""

          echo "APK:"
          echo "$APK_FILE"

          echo ""

          echo "Signing:"
          echo "AndroidAIDE signing key"

          echo ""

          echo "Build:"
          echo "assembleDebug"

          echo ""

          echo "versionCode:"
          echo "UNCHANGED"

          echo ""

          echo "applicationId:"
          echo "UNCHANGED"

          echo ""

          echo "=========================================="
