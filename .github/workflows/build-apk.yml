name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # CHECK PROJECT ZIP
      # ==========================================

      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then

            echo ""
            echo "ERROR: build-input/project.zip not found."
            echo ""

            echo "Current directory:"
            pwd

            echo ""
            echo "Repository files:"

            find . \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo ""
          echo "Project ZIP found:"

          ls -lh build-input/project.zip

      # ==========================================
      # EXTRACT PROJECT
      # ==========================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf android-project

          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Project files:"

          find android-project \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -300

      # ==========================================
      # DETECT ANDROID PROJECT ROOT
      # ==========================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          echo "=========================================="
          echo "DETECTING ANDROID PROJECT"
          echo "=========================================="

          if [ -f "android-project/settings.gradle" ]; then

            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            ROOT="android-project"

          else

            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then

              ROOT="$(dirname "$FILE")"

            fi

          fi

          if [ -z "$ROOT" ]; then

            echo ""
            echo "ERROR: Android project root not found."
            echo ""

            find android-project \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi

          echo ""
          echo "Android project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # PROJECT INFORMATION
      # ==========================================

      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Root:"
          echo "$ROOT"

          echo ""
          echo "Contents:"

          ls -la "$ROOT"

          echo ""
          echo "Gradle files:"

          find "$ROOT" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            -print

      # ==========================================
      # PREPARE GRADLE
      # ==========================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "PREPARING GRADLE"
          echo "=========================================="

          if [ ! -f "gradlew" ]; then

            echo ""
            echo "ERROR: gradlew not found."

            echo ""
            echo "Project contents:"

            ls -la

            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper found."

          echo ""
          echo "Gradle version:"

          ./gradlew --version

      # ==========================================
      # RESTORE / CREATE SIGNING KEY
      # ==========================================

      - name: Restore Signing Keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "=========================================="
          echo "RESTORE / CREATE SIGNING KEY"
          echo "=========================================="

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          KEY_ALIAS="androidaide"

          KEYSTORE_PASSWORD="androidaide-store-password"

          KEY_PASSWORD="androidaide-password"

          echo ""
          echo "Signing alias:"
          echo "$KEY_ALIAS"

          echo ""
          echo "Using automatic workflow signing key."

          echo "GitHub Secrets are NOT required."

          # ==========================================
          # FIND PREVIOUS SIGNING KEY ARTIFACT
          # ==========================================

          echo ""
          echo "=========================================="
          echo "SEARCHING PREVIOUS SIGNING KEY"
          echo "=========================================="

          ARTIFACT_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            2>/dev/null || echo '{"artifacts":[]}')

          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)

artifacts = data.get("artifacts", [])

valid = []

for artifact in artifacts:

    if artifact.get("name") == "AndroidAIDE-Signing-Key":

        if not artifact.get("expired", False):

            valid.append(artifact)

valid.sort(
    key=lambda x: x.get("created_at", ""),
    reverse=True
)

if valid:

    print(valid[0].get("id", ""))
')

          # ==========================================
          # RESTORE EXISTING KEY
          # ==========================================

          if [ -n "$ARTIFACT_ID" ]; then

            echo ""
            echo "Previous signing key artifact found."

            echo ""
            echo "Artifact ID:"
            echo "$ARTIFACT_ID"

            ARTIFACT_ZIP="$RUNNER_TEMP/signing-key.zip"

            DOWNLOAD_DIR="$RUNNER_TEMP/signing-key"

            rm -rf "$DOWNLOAD_DIR"

            mkdir -p "$DOWNLOAD_DIR"

            echo ""
            echo "Downloading previous signing key..."

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > "$ARTIFACT_ZIP"

            if [ ! -s "$ARTIFACT_ZIP" ]; then

              echo ""
              echo "ERROR: Signing key artifact download failed."

              exit 1

            fi

            echo ""
            echo "Extracting signing key..."

            unzip -q \
              "$ARTIFACT_ZIP" \
              -d "$DOWNLOAD_DIR"

            FOUND_KEY=$(find "$DOWNLOAD_DIR" \
              -type f \
              \( \
                -name "*.jks" \
                -o \
                -name "*.keystore" \
              \) \
              | head -n 1)

            if [ -z "$FOUND_KEY" ]; then

              echo ""
              echo "ERROR: No keystore found inside artifact."

              echo ""
              echo "Artifact contents:"

              find "$DOWNLOAD_DIR" \
                -maxdepth 5 \
                -type f \
                -print

              exit 1

            fi

            echo ""
            echo "Signing key found."

            cp "$FOUND_KEY" \
              "$KEYSTORE_FILE"

            chmod 600 \
              "$KEYSTORE_FILE"

            echo ""
            echo "=========================================="
            echo "EXISTING SIGNING KEY RESTORED"
            echo "=========================================="

          else

            # ==========================================
            # CREATE NEW KEY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "NO PREVIOUS SIGNING KEY"
            echo "=========================================="

            echo ""
            echo "This is the first build."

            echo ""
            echo "Creating new signing key..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMSoft,C=IN"

            chmod 600 \
              "$KEYSTORE_FILE"

            echo ""
            echo "New signing key created."

          fi

          # ==========================================
          # VERIFY SIGNING KEY
          # ==========================================

          echo ""
          echo "=========================================="
          echo "VERIFYING SIGNING KEY"
          echo "=========================================="

          if [ ! -f "$KEYSTORE_FILE" ]; then

            echo ""
            echo "ERROR: Keystore file does not exist."

            exit 1

          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "ERROR: Keystore file is empty."

            exit 1

          fi

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo ""
          echo "Signing key verification successful."

          # ==========================================
          # EXPORT ENVIRONMENT
          # ==========================================

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SIGNING KEY READY"
          echo "=========================================="

      # ==========================================
      # CONFIGURE DEBUG SIGNING
      # ==========================================

      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "CONFIGURING DEBUG SIGNING"
          echo "=========================================="

          if [ ! -f "app/build.gradle" ]; then

            echo ""
            echo "ERROR: app/build.gradle not found."

            echo ""
            echo "Available build.gradle files:"

            find . \
              -name "build.gradle" \
              -type f \
              -print

            exit 1
          fi

          cp \
            app/build.gradle \
            app/build.gradle.github-backup

          python3 <<'PY'
from pathlib import Path

path = Path("app/build.gradle")

text = path.read_text()

marker = "// ANDROID_AIDE_GITHUB_SIGNING"

if marker in text:

    print("GitHub signing configuration already exists.")

    raise SystemExit(0)

signing = r'''

// ANDROID_AIDE_GITHUB_SIGNING

android.signingConfigs.create("githubDebug") {

    storeFile file(System.getenv("KEYSTORE_FILE"))

    storePassword System.getenv("KEYSTORE_PASSWORD")

    keyAlias System.getenv("KEY_ALIAS")

    keyPassword System.getenv("KEY_PASSWORD")

}

android.buildTypes.debug.signingConfig =
    android.signingConfigs.getByName("githubDebug")

'''

text = text.rstrip() + "\n" + signing + "\n"

path.write_text(text)

print("GitHub signing configuration added.")
PY

          echo ""
          echo "Debug signing configured."

      # ==========================================
      # VERIFY SIGNING CONFIGURATION
      # ==========================================

      - name: Verify Signing Configuration
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "VERIFYING SIGNING CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Signing configuration:"

          tail -40 app/build.gradle

          echo ""
          echo "Keystore:"

          ls -lh "$KEYSTORE_FILE"

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Gradle task:"
          echo "assembleDebug"

          echo ""

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "=========================================="
          echo "DEBUG APK BUILD SUCCESS"
          echo "=========================================="

          echo ""
          echo "APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ==========================================
      # LOCATE APK
      # ==========================================

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK not found."

            echo ""
            echo "Build output:"

            find "$ROOT/app/build/outputs" \
              -type f \
              -print || true

            exit 1

          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk_path }}"

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: APK does not exist."

            exit 1

          fi

          if [ ! -s "$APK" ]; then

            echo ""
            echo "ERROR: APK is empty."

            exit 1

          fi

          echo ""
          echo "APK verified successfully."

          echo ""

          ls -lh "$APK"

      # ==========================================
      # UPLOAD APK ARTIFACT
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # SAVE SIGNING KEY
      # ==========================================

      - name: Save Signing Key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: ${{ env.KEYSTORE_FILE }}
          if-no-files-found: error
          retention-days: 90

      # ==========================================
      # BUILD COMPLETE
      # ==========================================

      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "ANDROID AIDE BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "APK:"
          echo "${{ steps.apk.outputs.apk_path }}"

          echo ""
          echo "Signing:"
          echo "AndroidAIDE automatic signing key"

          echo ""
          echo "Key:"
          echo "Created once and reused from artifact"

          echo ""
          echo "Build:"
          echo "assembleDebug"

          echo ""
          echo "versionCode:"
          echo "UNCHANGED"

          echo ""
          echo "applicationId:"
          echo "UNCHANGED"

          echo ""
          echo "=========================================="
