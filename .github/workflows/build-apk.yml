name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # CHECK PROJECT ZIP
      # ==========================================
      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          echo "Current directory:"
          pwd

          if [ ! -f "build-input/project.zip" ]; then
            echo ""
            echo "ERROR: build-input/project.zip not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 10 -type f | sort | head -500
            exit 1
          fi

          echo ""
          echo "Project ZIP found:"
          ls -lh "build-input/project.zip"


      # ==========================================
      # EXTRACT PROJECT
      # ==========================================
      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf android-project
          mkdir -p android-project

          unzip -q "build-input/project.zip" -d android-project

          echo "Project extracted successfully."

          echo ""
          echo "Extracted files:"
          find android-project \
            -type f \
            | sort \
            | head -1000


      # ==========================================
      # DETECT ANDROID PROJECT
      # ==========================================
      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DETECTING ANDROID PROJECT"
          echo "=========================================="

          ROOT=""

          if [ -f "android-project/settings.gradle" ]; then
            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then
            ROOT="android-project"

          else
            SETTINGS_FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              ROOT="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project root not found."
            echo ""
            find android-project -type f | sort
            exit 1
          fi

          echo "Android project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"


      # ==========================================
      # DETECT APP MODULE
      # ==========================================
      - name: Detect App Module
        id: app
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "DETECTING APP MODULE"
          echo "=========================================="

          APP_DIR=""

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_DIR="$ROOT/app"

          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_DIR="$ROOT/app"

          else
            while IFS= read -r FILE; do

              if grep -q \
                "com.android.application" \
                "$FILE" \
                2>/dev/null; then

                APP_DIR="$(dirname "$FILE")"
                break

              fi

            done < <(
              find "$ROOT" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print
            )
          fi

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Android application module not found."
            echo ""

            find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -print \
              | sort

            exit 1
          fi

          echo "App module:"
          echo "$APP_DIR"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # INSPECT PROJECT
      # ==========================================
      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          APP="${{ steps.app.outputs.app_dir }}"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo "Project root:"
          echo "$ROOT"

          echo ""
          echo "App module:"
          echo "$APP"

          echo ""
          echo "Gradle files:"

          find "$ROOT" \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print \
            | sort

          echo ""
          echo "Java/Kotlin source files:"

          find "$ROOT" \
            -type f \
            \( \
              -name "*.java" \
              -o \
              -name "*.kt" \
            \) \
            -print \
            | sort

          echo ""
          echo "Android Manifest:"

          if [ -f "$APP/src/main/AndroidManifest.xml" ]; then
            echo "FOUND:"
            echo "$APP/src/main/AndroidManifest.xml"
          else
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi


      # ==========================================
      # PREPARE GRADLE
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "PREPARING GRADLE"
          echo "=========================================="

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          sed -i 's/\r$//' gradlew

          chmod +x gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      # ==========================================
      # RESTORE PREVIOUS SIGNING KEY
      # ==========================================
      - name: Restore Previous Signing Key
        id: restore_key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR SIGNING KEY"
          echo "=========================================="

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          ARTIFACT_JSON=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")

          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          artifacts = [
              a for a in data.get("artifacts", [])
              if not a.get("expired", False)
              and a.get("name", "").startswith(
                  "AndroidAIDE-Signing-Key-"
              )
          ]

          artifacts.sort(
              key=lambda x: x.get("created_at", ""),
              reverse=True
          )

          if artifacts:
              print(artifacts[0]["id"])
          ')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No previous signing key found."
            echo "create_new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous signing artifact:"
          echo "$ARTIFACT_ID"

          rm -rf "$RUNNER_TEMP/signing-key"
          mkdir -p "$RUNNER_TEMP/signing-key"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/signing-key.zip"

          unzip -o -q \
            "$RUNNER_TEMP/signing-key.zip" \
            -d "$RUNNER_TEMP/signing-key"

          FOUND_KEY=$(find "$RUNNER_TEMP/signing-key" \
            -type f \
            \( \
              -name "*.jks" \
              -o \
              -name "*.keystore" \
            \) \
            | head -n 1)

          if [ -z "$FOUND_KEY" ]; then
            echo "Previous artifact did not contain a keystore."
            echo "create_new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp "$FOUND_KEY" "$KEYSTORE_FILE"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=androidaide" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=androidaide-store-password" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=androidaide-password" >> "$GITHUB_ENV"

          echo "create_new=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Signing key restored successfully."


      # ==========================================
      # CREATE SIGNING KEY
      # ==========================================
      - name: Create Signing Key
        if: steps.restore_key.outputs.create_new == 'true'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING NEW SIGNING KEY"
          echo "=========================================="

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"
          KEY_ALIAS="androidaide"
          KEYSTORE_PASSWORD="androidaide-store-password"
          KEY_PASSWORD="androidaide-password"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=AndroidAIDE,O=SGMSoft,C=IN"

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo ""
          echo "New signing key created successfully."


      # ==========================================
      # VERIFY SIGNING KEY
      # ==========================================
      - name: Verify Signing Key
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING SIGNING KEY"
          echo "=========================================="

          if [ -z "$KEYSTORE_FILE" ]; then
            echo "ERROR: KEYSTORE_FILE is empty."
            exit 1
          fi

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "ERROR: Signing keystore not found."
            echo "$KEYSTORE_FILE"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is empty."
            exit 1
          fi

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Signing key is valid."


      # ==========================================
      # CONFIGURE DEBUG SIGNING
      # ==========================================
      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app_dir }}"

          echo "=========================================="
          echo "CONFIGURING DEBUG SIGNING"
          echo "=========================================="

          echo ""
          echo "App module:"
          echo "$APP"

          echo ""
          echo "Checking signing environment..."

          test -n "$KEYSTORE_FILE"
          test -f "$KEYSTORE_FILE"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          echo "Signing environment OK."


          # ========================================
          # GROOVY
          # ========================================
          if [ -f "$APP/build.gradle" ]; then

            echo ""
            echo "Groovy Gradle project detected."

            cp "$APP/build.gradle" \
              "$APP/build.gradle.android-aide-backup"

            python3 - "$APP/build.gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          marker = "// ANDROID_AIDE_GITHUB_SIGNING"

          if marker in text:
              print("GitHub signing configuration already exists.")
              sys.exit(0)

          block = r'''
          // ANDROID_AIDE_GITHUB_SIGNING

          android {
              signingConfigs {
                  createGithubDebug {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.createGithubDebug
                  }
              }
          }
          '''

          text = text.rstrip() + "\n\n" + block.strip() + "\n"

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("GitHub debug signing configuration added.")
          PY


          # ========================================
          # KOTLIN DSL
          # ========================================
          elif [ -f "$APP/build.gradle.kts" ]; then

            echo ""
            echo "Kotlin DSL Gradle project detected."

            cp "$APP/build.gradle.kts" \
              "$APP/build.gradle.kts.android-aide-backup"

            python3 - "$APP/build.gradle.kts" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          marker = "// ANDROID_AIDE_GITHUB_SIGNING"

          if marker in text:
              print("GitHub signing configuration already exists.")
              sys.exit(0)

          block = r'''
          // ANDROID_AIDE_GITHUB_SIGNING

          android {
              signingConfigs {
                  create("createGithubDebug") {
                      storeFile = file(
                          System.getenv("KEYSTORE_FILE")
                      )
                      storePassword = System.getenv(
                          "KEYSTORE_PASSWORD"
                      )
                      keyAlias = System.getenv(
                          "KEY_ALIAS"
                      )
                      keyPassword = System.getenv(
                          "KEY_PASSWORD"
                      )
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName(
                          "createGithubDebug"
                      )
                  }
              }
          }
          '''

          text = text.rstrip() + "\n\n" + block.strip() + "\n"

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("GitHub debug signing configuration added.")
          PY

          else
            echo ""
            echo "ERROR: No app Gradle file found."
            echo ""
            echo "Expected:"
            echo "$APP/build.gradle"
            echo "$APP/build.gradle.kts"
            exit 1
          fi

          echo ""
          echo "Debug signing configured successfully."


      # ==========================================
      # NORMALIZE GRADLE FILES
      # ==========================================
      - name: Normalize Gradle Files
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "NORMALIZING GRADLE FILES"
          echo "=========================================="

          while IFS= read -r FILE; do

            python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          original = text

          # Fix literal escaped line endings only.
          text = text.replace("\\r\\n", "\n")
          text = text.replace("\\n", "\n")
          text = text.replace("\\r", "\n")

          # Remove UTF-8 BOM.
          text = text.lstrip("\ufeff")

          if text != original:
              path.write_text(
                  text,
                  encoding="utf-8"
              )
              print("Normalized:", path)
          else:
              print("OK:", path)

          PY

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print
          )

          echo ""
          echo "Gradle files normalized."


      # ==========================================
      # SHOW FINAL GRADLE CONFIGURATION
      # ==========================================
      - name: Show Final Gradle Configuration
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          APP="${{ steps.app.outputs.app_dir }}"

          echo "=========================================="
          echo "FINAL APP BUILD FILE"
          echo "=========================================="

          if [ -f "$APP/build.gradle" ]; then
            cat "$APP/build.gradle"

          elif [ -f "$APP/build.gradle.kts" ]; then
            cat "$APP/build.gradle.kts"

          else
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ROOT BUILD FILE"
          echo "=========================================="

          if [ -f "$ROOT/build.gradle" ]; then
            cat "$ROOT/build.gradle"

          elif [ -f "$ROOT/build.gradle.kts" ]; then
            cat "$ROOT/build.gradle.kts"

          else
            echo "No root build.gradle file."
          fi


      # ==========================================
      # VERIFY ANDROID APP
      # ==========================================
      - name: Verify Android App
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          APP="${{ steps.app.outputs.app_dir }}"

          echo "=========================================="
          echo "VERIFYING ANDROID APP"
          echo "=========================================="

          if [ ! -d "$APP" ]; then
            echo "ERROR: App module directory not found."
            exit 1
          fi

          if [ ! -f "$APP/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Android app module OK."

          echo ""
          echo "Java/Kotlin source files:"

          find "$APP/src/main" \
            -type f \
            \( \
              -name "*.java" \
              -o \
              -name "*.kt" \
            \) \
            -print \
            | sort

          echo ""
          echo "Resources:"

          if [ -d "$APP/src/main/res" ]; then
            find "$APP/src/main/res" \
              -maxdepth 3 \
              -type f \
              -print \
              | sort \
              | head -500
          fi


      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set +e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "GRADLE EXIT CODE: $BUILD_EXIT"
          echo "=========================================="

          echo ""
          echo "=========================================="
          echo "FAILURE / EXCEPTION SUMMARY"
          echo "=========================================="

          grep -n -E \
            "FAILURE:|What went wrong:|Execution failed|Caused by:|Could not|A problem occurred" \
            "$LOG_FILE" \
            | tail -100 \
            || true

          echo ""
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print \
            | sort

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "GRADLE BUILD FAILED"
            echo "=========================================="
            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="


      # ==========================================
      # UPLOAD GRADLE LOG
      # ==========================================
      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Gradle-Log-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7


      # ==========================================
      # LOCATE APK
      # ==========================================
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app_dir }}"

          echo "=========================================="
          echo "LOCATING APK"
          echo "=========================================="

          APK=$(find "$APP/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            echo ""
            echo "Build outputs:"

            if [ -d "$APP/build/outputs" ]; then
              find "$APP/build/outputs" \
                -type f \
                -print \
                || true
            fi

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK-${{ github.run_id }}
          path: ${{ steps.app.outputs.app_dir }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


      # ==========================================
      # UPLOAD SIGNING KEY
      # ==========================================
      - name: Upload Signing Key
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key-${{ github.run_id }}
          path: ${{ env.KEYSTORE_FILE }}
          if-no-files-found: error
          retention-days: 90


      # ==========================================
      # BUILD SUMMARY
      # ==========================================
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID AIDE BUILD COMPLETE"
          echo "=========================================="

          echo ""
          echo "Project:"
          echo "${{ steps.project.outputs.project_root }}"

          echo ""
          echo "App module:"
          echo "${{ steps.app.outputs.app_dir }}"

          echo ""
          echo "APK:"
          echo "${{ steps.apk.outputs.apk_path }}"

          echo ""
          echo "GitHub Run:"
          echo "${{ github.run_id }}"

          echo ""
          echo "APK artifact:"
          echo "AndroidAIDE-Debug-APK-${{ github.run_id }}"

          echo ""
          echo "Signing artifact:"
          echo "AndroidAIDE-Signing-Key-${{ github.run_id }}"

          echo ""
          echo "=========================================="
          echo "BUILD FINISHED SUCCESSFULLY"
          echo "=========================================="
