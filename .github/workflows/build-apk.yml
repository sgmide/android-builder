name: Android AIDE - GitHub Actions Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: androidaide-signing.jks
      DEFAULT_KEY_ALIAS: androidaide
      DEFAULT_KEYSTORE_PASSWORD: androidaide-store-password
      DEFAULT_KEY_PASSWORD: androidaide-password

    steps:

      # =========================================================
      # 1. CHECK ENVIRONMENT
      # =========================================================

      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID AIDE BUILD"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Workspace:"
          pwd


      # =========================================================
      # 2. CHECK PROJECT ZIP
      # =========================================================

      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then

            echo "ERROR: build-input/project.zip not found."

            echo ""
            echo "Current directory:"
            pwd

            echo ""
            echo "Files:"
            find . -maxdepth 5 -type f | sort | head -300

            exit 1
          fi

          echo ""
          echo "Project ZIP:"
          ls -lh build-input/project.zip

          echo ""
          echo "ZIP exists successfully."


      # =========================================================
      # 3. EXTRACT PROJECT
      # =========================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf android-project

          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo ""
          echo "Extraction completed."


      # =========================================================
      # 4. FIND ANDROID PROJECT ROOT
      # =========================================================

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING PROJECT ROOT"
          echo "=========================================="

          PROJECT_ROOT=""

          # Normal project
          if [ -f "android-project/settings.gradle" ]; then

            PROJECT_ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project"

          # Nested project
          elif [ -f "android-project/android-project/settings.gradle" ]; then

            PROJECT_ROOT="android-project/android-project"

          elif [ -f "android-project/android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project/android-project"

          else

            SETTINGS_FILE=$(find android-project \
              -maxdepth 8 \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then

              PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

            fi

          fi


          if [ -z "$PROJECT_ROOT" ]; then

            echo "ERROR: Android project root not found."

            echo ""
            echo "Project files:"

            find android-project \
              -maxdepth 7 \
              -type f \
              | sort \
              | head -500

            exit 1

          fi


          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"


      # =========================================================
      # 5. CHECK GRADLE
      # =========================================================

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "CHECKING GRADLE"
          echo "=========================================="

          if [ ! -f "gradlew" ]; then

            echo "ERROR: gradlew not found."

            echo ""
            echo "Project files:"
            find . -maxdepth 5 -type f | sort

            exit 1

          fi

          chmod +x gradlew

          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # =========================================================
      # 6. INITIAL SIGNING STATE
      # =========================================================

      - name: Initialize signing state
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INITIALIZING SIGNING"
          echo "=========================================="

          echo "CREATE_NEW_KEY=true" >> "$GITHUB_ENV"

          echo "SIGNING_KEY_ALIAS=$DEFAULT_KEY_ALIAS" >> "$GITHUB_ENV"

          echo "SIGNING_KEYSTORE_PASSWORD=$DEFAULT_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "SIGNING_KEY_PASSWORD=$DEFAULT_KEY_PASSWORD" >> "$GITHUB_ENV"

          echo ""
          echo "Default signing configuration prepared."


      # =========================================================
      # 7. RESTORE PREVIOUS SIGNING KEY
      # =========================================================

      - name: Restore previous signing key
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR PREVIOUS SIGNING KEY"
          echo "=========================================="

          cd "$GITHUB_WORKSPACE"


          ARTIFACT_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")


          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '
            [
              .artifacts[]
              | select(.name == "AndroidAIDE-Signing-Key")
              | select(.expired == false)
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')


          if [ -z "$ARTIFACT_ID" ]; then

            echo ""
            echo "No previous signing key artifact found."

            echo ""
            echo "This appears to be the FIRST BUILD."

            echo ""
            echo "A new signing key will be generated."

            echo "CREATE_NEW_KEY=true" >> "$GITHUB_ENV"

            exit 0

          fi


          echo ""
          echo "Previous signing key artifact found."

          echo "Artifact ID:"
          echo "$ARTIFACT_ID"


          rm -rf signing-restore

          mkdir -p signing-restore


          echo ""
          echo "Downloading signing key artifact..."


          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > signing-key.zip


          echo ""
          echo "Extracting signing key..."


          unzip -q signing-key.zip -d signing-restore


          FOUND_KEY=$(find signing-restore \
            \( \
              -name "*.jks" \
              -o \
              -name "*.keystore" \
            \) \
            -print -quit)


          if [ -z "$FOUND_KEY" ]; then

            echo ""
            echo "ERROR: Signing key was not found inside artifact."

            echo ""
            echo "Artifact contents:"

            find signing-restore \
              -maxdepth 5 \
              -type f \
              -print

            exit 1

          fi


          cp "$FOUND_KEY" \
            "$PROJECT_ROOT/$KEYSTORE_FILE"


          chmod 600 \
            "$PROJECT_ROOT/$KEYSTORE_FILE"


          echo "CREATE_NEW_KEY=false" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "SIGNING KEY RESTORED"
          echo "=========================================="

          echo ""
          echo "Same signing key will be used."


      # =========================================================
      # 8. CREATE SIGNING KEY ONLY ON FIRST BUILD
      # =========================================================

      - name: Create signing key if needed
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          if [ "$CREATE_NEW_KEY" != "true" ]; then

            echo "=========================================="
            echo "EXISTING SIGNING KEY"
            echo "=========================================="

            echo ""
            echo "Existing signing key will be used."

            exit 0

          fi


          echo "=========================================="
          echo "CREATING INITIAL SIGNING KEY"
          echo "=========================================="


          if [ -f "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Keystore already exists."

            echo "CREATE_NEW_KEY=false" >> "$GITHUB_ENV"

            exit 0

          fi


          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "$SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"


          chmod 600 "$KEYSTORE_FILE"


          echo ""
          echo "Initial signing key created successfully."


      # =========================================================
      # 9. VERIFY SIGNING KEY
      # =========================================================

      - name: Verify signing key
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=========================================="
          echo "VERIFYING SIGNING KEY"
          echo "=========================================="


          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo "ERROR: Signing keystore does not exist."

            exit 1

          fi


          keytool -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            > signing-key-info.txt


          echo ""
          echo "Signing key verified."


          echo ""
          echo "Keystore:"
          ls -lh "$KEYSTORE_FILE"


          echo ""
          echo "Alias:"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS"


      # =========================================================
      # 10. CONFIGURE ANDROID SIGNING
      # =========================================================

      - name: Configure Android signing
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURING ANDROID SIGNING"
          echo "=========================================="


          cd "$PROJECT_ROOT"


          APP_GRADLE="app/build.gradle"

          SIGNING_GRADLE="androidaide-signing.gradle"


          if [ ! -f "$APP_GRADLE" ]; then

            echo "ERROR: app/build.gradle not found."

            echo ""
            echo "Project files:"

            find . \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1

          fi


          echo ""
          echo "Creating signing Gradle script..."


          cat > "$SIGNING_GRADLE" <<'EOF'
android {

    signingConfigs {

        androidAide {

            storeFile file("$rootDir/androidaide-signing.jks")

            storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")

            keyAlias System.getenv("SIGNING_KEY_ALIAS")

            keyPassword System.getenv("SIGNING_KEY_PASSWORD")

        }
    }

    buildTypes {

        debug {

            signingConfig signingConfigs.androidAide

        }
    }
}
EOF


          echo ""
          echo "Signing Gradle script:"

          cat "$SIGNING_GRADLE"


          echo ""
          echo "Checking app/build.gradle..."


          if grep -q "androidaide-signing.gradle" "$APP_GRADLE"; then

            echo ""
            echo "Signing script already applied."

          else

            echo ""
            echo "Applying signing script..."

            printf '\napply from: "$rootDir/androidaide-signing.gradle"\n' \
              >> "$APP_GRADLE"

          fi


          echo ""
          echo "Android signing configuration completed."


      # =========================================================
      # 11. VERIFY GRADLE SIGNING CONFIGURATION
      # =========================================================

      - name: Verify Gradle signing configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=========================================="
          echo "VERIFYING GRADLE CONFIGURATION"
          echo "=========================================="


          echo ""
          echo "app/build.gradle:"

          cat app/build.gradle


          echo ""
          echo "androidaide-signing.gradle:"

          cat androidaide-signing.gradle


          echo ""
          echo "Signing keystore:"

          ls -lh "$KEYSTORE_FILE"


      # =========================================================
      # 12. BUILD APK
      # =========================================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="


          chmod +x gradlew


          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # =========================================================
      # 13. FIND APK
      # =========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="


          APK_FILE=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            | head -1)


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK not found."

            echo ""
            echo "Searching all APK files:"

            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi


          echo ""
          echo "APK found:"

          echo "$APK_FILE"


          ABSOLUTE_APK="$GITHUB_WORKSPACE/$PROJECT_ROOT/$APK_FILE"


          echo "APK_FILE=$ABSOLUTE_APK" >> "$GITHUB_ENV"


      # =========================================================
      # 14. VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e


          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="


          if [ ! -f "$APK_FILE" ]; then

            echo "ERROR: APK file does not exist."

            exit 1

          fi


          echo ""
          echo "APK:"

          ls -lh "$APK_FILE"


          echo ""
          echo "APK successfully built."


      # =========================================================
      # 15. UPLOAD APK ARTIFACT
      # =========================================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4

        with:

          name: AndroidAIDE-Debug-APK

          path: ${{ env.APK_FILE }}

          if-no-files-found: error

          retention-days: 7


      # =========================================================
      # 16. SAVE SIGNING KEY ARTIFACT
      # =========================================================

      - name: Save signing key artifact
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: AndroidAIDE-Signing-Key

          path: ${{ env.PROJECT_ROOT }}/${{ env.KEYSTORE_FILE }}

          if-no-files-found: ignore

          retention-days: 90


      # =========================================================
      # 17. BUILD COMPLETE
      # =========================================================

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "ANDROID AIDE BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "APK:"
          echo "$APK_FILE"

          echo ""
          echo "Signing:"
          echo "AndroidAIDE signing key"

          echo ""
          echo "Build:"
          echo "assembleDebug"

          echo ""
          echo "versionCode:"
          echo "NOT MODIFIED"

          echo ""
          echo "=========================================="
