name: Android AIDE - GitHub Actions Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: androidaide-signing.jks
      DEFAULT_KEY_ALIAS: androidaide
      DEFAULT_KEYSTORE_PASSWORD: androidaide-store-password
      DEFAULT_KEY_PASSWORD: androidaide-password

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Java 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3. Check project ZIP
      # ==========================================================

      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          ls -lh build-input/project.zip


      # ==========================================================
      # 4. Extract project
      # ==========================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Extracting project..."

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Extraction completed."


      # ==========================================================
      # 5. Detect Android project root
      # ==========================================================

      - name: Detect project root
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          if [ -f "android-project/settings.gradle" ]; then
            PROJECT_ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then
            PROJECT_ROOT="android-project"

          elif [ -f "android-project/android-project/settings.gradle" ]; then
            PROJECT_ROOT="android-project/android-project"

          elif [ -f "android-project/android-project/settings.gradle.kts" ]; then
            PROJECT_ROOT="android-project/android-project"

          else

            SETTINGS_FILE=$(find android-project \
              -maxdepth 6 \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            find android-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"


      # ==========================================================
      # 6. Prepare Gradle
      # ==========================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version


      # ==========================================================
      # 7. Check optional permanent secrets
      #
      # We intentionally do NOT use secrets directly in if:.
      # They are copied into environment variables.
      # ==========================================================

      - name: Check permanent signing key
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "$SECRET_KEYSTORE_BASE64" ] && \
             [ -n "$SECRET_KEYSTORE_PASSWORD" ] && \
             [ -n "$SECRET_KEY_ALIAS" ] && \
             [ -n "$SECRET_KEY_PASSWORD" ]; then

            echo "Permanent GitHub signing secrets found."

            echo "SIGNING_SOURCE=secret" >> "$GITHUB_ENV"

            {
              echo "SIGNING_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            printf '%s' "$SECRET_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$PROJECT_ROOT/$KEYSTORE_FILE"

          else

            echo "Permanent GitHub signing secrets not found."

            echo "SIGNING_SOURCE=generated" >> "$GITHUB_ENV"

            echo "SIGNING_KEYSTORE_PASSWORD=$DEFAULT_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$DEFAULT_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$DEFAULT_KEY_PASSWORD" >> "$GITHUB_ENV"

          fi


      # ==========================================================
      # 8. Restore signing key from GitHub Secret
      # ==========================================================

      - name: Restore secret signing key
        shell: bash
        run: |
          set -e

          if [ "$SIGNING_SOURCE" != "secret" ]; then
            echo "No permanent secret key configured."
            exit 0
          fi

          cd "$PROJECT_ROOT"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Secret keystore could not be restored."
            exit 1
          fi

          chmod 600 "$KEYSTORE_FILE"

          echo "Permanent signing key restored."


      # ==========================================================
      # 9. Restore old generated signing key artifact
      # ==========================================================

      - name: Restore previous generated signing key
        if: env.SIGNING_SOURCE == 'generated'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Searching for previous AndroidAIDE signing key artifact..."

          ARTIFACT_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")

          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '
            [
              .artifacts[]
              | select(.name == "AndroidAIDE-Signing-Key")
              | select(.expired == false)
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No previous signing key artifact found."
            exit 0
          fi

          echo "Previous signing key artifact found."
          echo "Artifact ID: $ARTIFACT_ID"

          rm -rf signing-restore
          mkdir -p signing-restore

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > signing-key.zip

          unzip -q signing-key.zip -d signing-restore

          FOUND_KEY=$(find signing-restore \
            \( -name "*.jks" -o -name "*.keystore" \) \
            -print -quit)

          if [ -z "$FOUND_KEY" ]; then
            echo "ERROR: Signing key not found in artifact."
            exit 1
          fi

          cp "$FOUND_KEY" \
            "$PROJECT_ROOT/$KEYSTORE_FILE"

          chmod 600 \
            "$PROJECT_ROOT/$KEYSTORE_FILE"

          echo "Previous signing key restored."


      # ==========================================================
      # 10. Create new signing key if no key exists
      # ==========================================================

      - name: Create signing key
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Existing signing key will be used."
            exit 0
          fi

          echo "=========================================="
          echo "CREATING NEW SIGNING KEY"
          echo "=========================================="

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "$SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"

          chmod 600 "$KEYSTORE_FILE"

          echo "New signing key created."


      # ==========================================================
      # 11. Verify signing key
      # ==========================================================

      - name: Verify signing key
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "VERIFYING SIGNING KEY"
          echo "=========================================="

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS"

          echo "Signing key verified."


      # ==========================================================
      # 12. Configure Android signing
      #
      # Uses environment variables instead of hard-coded
      # GitHub secret expressions inside Gradle.
      # ==========================================================

      - name: Configure Android Signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          cp "$APP_GRADLE" "$APP_GRADLE.original"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          text = path.read_text()

          # --------------------------------------------------
          # Remove any previously injected AndroidAIDE block.
          # --------------------------------------------------

          text = re.sub(
              r'\n\s*signingConfigs\s*\{\s*androidAide\s*\{.*?\n\s*\}\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # --------------------------------------------------
          # Create signingConfigs block.
          # --------------------------------------------------

          signing_block = '''
              signingConfigs {
                  androidAide {
                      storeFile file("../androidaide-signing.jks")
                      storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }
          '''

          # --------------------------------------------------
          # Insert immediately after android {
          # --------------------------------------------------

          match = re.search(r'android\s*\{', text)

          if not match:
              raise SystemExit(
                  "ERROR: android { block not found."
              )

          insert_position = match.end()

          text = (
              text[:insert_position]
              + "\n"
              + signing_block
              + text[insert_position:]
          )

          # --------------------------------------------------
          # Configure debug signing.
          # --------------------------------------------------

          debug_pattern = r'(\bdebug\s*\{)'

          if re.search(debug_pattern, text):

              text = re.sub(
                  debug_pattern,
                  r'\1\n            signingConfig signingConfigs.androidAide',
                  text,
                  count=1
              )

          else:

              build_types_match = re.search(
                  r'\bbuildTypes\s*\{',
                  text
              )

              if not build_types_match:
                  raise SystemExit(
                      "ERROR: buildTypes { block not found."
                  )

              pos = build_types_match.end()

              debug_block = '''
                  debug {
                      signingConfig signingConfigs.androidAide
                  }
              '''

              text = (
                  text[:pos]
                  + "\n"
                  + debug_block
                  + text[pos:]
              )

          path.write_text(text)

          print("Android signing configuration added successfully.")
          PY

          echo ""
          echo "=========================================="
          echo "SIGNING CONFIGURATION"
          echo "=========================================="

          grep -n \
            -E "signingConfigs|androidAide|signingConfig|storeFile|keyAlias" \
            app/build.gradle || true


      # ==========================================================
      # 13. Check application information
      # ==========================================================

      - name: Check Application Information
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "APPLICATION INFORMATION"
          echo "=========================================="

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle || true

          echo ""
          echo "Version Code:"
          grep -n "versionCode" app/build.gradle || true

          echo ""
          echo "Version Name:"
          grep -n "versionName" app/build.gradle || true

          echo ""
          echo "versionCode will NOT be changed."


      # ==========================================================
      # 14. Gradle clean
      # ==========================================================

      - name: Gradle Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew clean \
            --no-daemon


      # ==========================================================
      # 15. Build APK
      # ==========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD SUCCESSFUL."


      # ==========================================================
      # 16. Find APK
      # ==========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APK_FILE=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p ../build-output

          cp "$APK_FILE" \
            ../build-output/app-debug.apk

          echo ""
          echo "=========================================="
          echo "APK CREATED"
          echo "=========================================="

          ls -lh ../build-output/app-debug.apk


      # ==========================================================
      # 17. Verify APK signature
      # ==========================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="build-output/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "APK signature verified."


      # ==========================================================
      # 18. Upload APK
      # ==========================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: build-output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 19. Save signing key artifact
      #
      # This keeps the generated key available for future runs.
      # ==========================================================

      - name: Save Signing Key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: android-project/**/androidaide-signing.jks
          if-no-files-found: warn
          retention-days: 90


      # ==========================================================
      # 20. Build summary
      # ==========================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "ANDROID AIDE BUILD SUMMARY"
          echo "=========================================="

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Signing source:"
          echo "$SIGNING_SOURCE"

          echo ""
          echo "versionCode:"
          grep -n "versionCode" \
            "$PROJECT_ROOT/app/build.gradle" || true

          echo ""
          echo "APK:"
          if [ -f "build-output/app-debug.apk" ]; then
            ls -lh build-output/app-debug.apk
          else
            echo "APK was not created."
          fi

          echo ""
          echo "Build finished."
