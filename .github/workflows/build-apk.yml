name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # CHECK PROJECT ZIP
      # ==========================================================

      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then

            echo ""
            echo "ERROR: build-input/project.zip not found."
            echo ""

            echo "Current directory:"
            pwd

            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          echo ""
          echo "Project ZIP found:"
          ls -lh build-input/project.zip


      # ==========================================================
      # SHOW ZIP CONTENTS
      # ==========================================================

      - name: Inspect Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT ZIP CONTENTS"
          echo "=========================================="

          unzip -l build-input/project.zip


      # ==========================================================
      # EXTRACT PROJECT
      # ==========================================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf android-project

          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "ALL EXTRACTED FILES:"

          find android-project \
            -type f \
            | sort \
            | head -1000


      # ==========================================================
      # DETECT ANDROID PROJECT ROOT
      # ==========================================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          ROOT=""

          # ------------------------------------------------------
          # METHOD 1
          # settings.gradle
          # ------------------------------------------------------

          FILE=$(find android-project \
            -type f \
            -name "settings.gradle" \
            | head -n 1)

          if [ -n "$FILE" ]; then

            ROOT="$(dirname "$FILE")"

            echo ""
            echo "Found settings.gradle:"
            echo "$FILE"

          fi


          # ------------------------------------------------------
          # METHOD 2
          # settings.gradle.kts
          # ------------------------------------------------------

          if [ -z "$ROOT" ]; then

            FILE=$(find android-project \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1)

            if [ -n "$FILE" ]; then

              ROOT="$(dirname "$FILE")"

              echo ""
              echo "Found settings.gradle.kts:"
              echo "$FILE"

            fi

          fi


          # ------------------------------------------------------
          # METHOD 3
          # gradlew
          # ------------------------------------------------------

          if [ -z "$ROOT" ]; then

            FILE=$(find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1)

            if [ -n "$FILE" ]; then

              ROOT="$(dirname "$FILE")"

              echo ""
              echo "Found gradlew:"
              echo "$FILE"

            fi

          fi


          # ------------------------------------------------------
          # METHOD 4
          # build.gradle + app
          # ------------------------------------------------------

          if [ -z "$ROOT" ]; then

            while IFS= read -r FILE; do

              CANDIDATE="$(dirname "$FILE")"

              if [ -d "$CANDIDATE/app" ]; then

                ROOT="$CANDIDATE"

                echo ""
                echo "Found root using build.gradle:"
                echo "$FILE"

                break

              fi

            done < <(
              find android-project \
                -type f \
                -name "build.gradle"
            )

          fi


          # ------------------------------------------------------
          # METHOD 5
          # build.gradle.kts + app
          # ------------------------------------------------------

          if [ -z "$ROOT" ]; then

            while IFS= read -r FILE; do

              CANDIDATE="$(dirname "$FILE")"

              if [ -d "$CANDIDATE/app" ]; then

                ROOT="$CANDIDATE"

                echo ""
                echo "Found root using build.gradle.kts:"
                echo "$FILE"

                break

              fi

            done < <(
              find android-project \
                -type f \
                -name "build.gradle.kts"
            )

          fi


          # ------------------------------------------------------
          # NORMALIZE ROOT
          # ------------------------------------------------------

          ROOT="${ROOT%/}"


          # ------------------------------------------------------
          # VERIFY ROOT
          # ------------------------------------------------------

          if [ -z "$ROOT" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: ANDROID PROJECT ROOT NOT FOUND"
            echo "=========================================="

            echo ""
            echo "Directory tree:"

            find android-project \
              -maxdepth 12 \
              -print \
              | sort

            echo ""
            echo "settings.gradle files:"

            find android-project \
              -type f \
              -name "settings.gradle" \
              -print

            echo ""
            echo "settings.gradle.kts files:"

            find android-project \
              -type f \
              -name "settings.gradle.kts" \
              -print

            echo ""
            echo "gradlew files:"

            find android-project \
              -type f \
              -name "gradlew" \
              -print

            echo ""
            echo "build.gradle files:"

            find android-project \
              -type f \
              -name "build.gradle" \
              -print

            echo ""
            echo "build.gradle.kts files:"

            find android-project \
              -type f \
              -name "build.gradle.kts" \
              -print

            echo ""
            echo "app directories:"

            find android-project \
              -type d \
              -name "app" \
              -print

            exit 1

          fi


          # ------------------------------------------------------
          # PROJECT ROOT FOUND
          # ------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT ROOT FOUND"
          echo "=========================================="

          echo ""
          echo "ROOT:"
          echo "$ROOT"


          # ------------------------------------------------------
          # CHECK APP DIRECTORY
          # ------------------------------------------------------

          if [ ! -d "$ROOT/app" ]; then

            echo ""
            echo "WARNING: app directory not found."

            echo ""
            echo "Root contents:"

            find "$ROOT" \
              -maxdepth 4 \
              -print \
              | sort

          else

            echo ""
            echo "app directory found."

          fi


          # ------------------------------------------------------
          # SAVE OUTPUT
          # ------------------------------------------------------

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # INSPECT PROJECT
      # ==========================================================

      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "ANDROID PROJECT INFORMATION"
          echo "=========================================="

          echo ""
          echo "Project root:"
          echo "$ROOT"

          echo ""
          echo "Root contents:"
          ls -la "$ROOT"

          echo ""
          echo "Gradle files:"

          find "$ROOT" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            -print \
            | sort

          echo ""
          echo "App contents:"

          if [ -d "$ROOT/app" ]; then

            find "$ROOT/app" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

          else

            echo "app directory does not exist."

          fi


      # ==========================================================
      # PREPARE GRADLE
      # ==========================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "PREPARING GRADLE"
          echo "=========================================="

          if [ ! -f "gradlew" ]; then

            echo ""
            echo "ERROR: gradlew not found."

            echo ""
            echo "Project root:"
            pwd

            echo ""
            ls -la

            exit 1

          fi

          chmod +x gradlew

          echo ""
          echo "gradlew permission:"
          ls -l gradlew

          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # ==========================================================
      # RESTORE / CREATE SIGNING KEY
      # ==========================================================

      - name: Restore Signing Keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo "RESTORE / CREATE SIGNING KEY"
          echo "=========================================="

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          KEY_ALIAS="${ANDROID_KEY_ALIAS:-androidaide}"

          KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-androidaide-store-password}"

          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-androidaide-password}"


          echo ""
          echo "Signing alias:"
          echo "$KEY_ALIAS"


          # ======================================================
          # TRY GITHUB SECRET
          # ======================================================

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then

            echo ""
            echo "GitHub signing secret found."

            echo ""
            echo "Restoring keystore..."

            echo "$ANDROID_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"


            if [ -s "$KEYSTORE_FILE" ]; then

              if keytool \
                -list \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$KEYSTORE_PASSWORD" \
                -alias "$KEY_ALIAS" \
                > /dev/null 2>&1; then

                echo ""
                echo "Secret keystore verified successfully."

              else

                echo ""
                echo "WARNING: Secret keystore verification failed."

                rm -f "$KEYSTORE_FILE"

              fi

            fi

          else

            echo ""
            echo "No GitHub signing secret configured."

          fi


          # ======================================================
          # SEARCH PREVIOUS SIGNING KEY ARTIFACT
          # ======================================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Searching previous signing-key artifact..."

            ARTIFACT_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              2>/dev/null || echo '{"artifacts":[]}')


            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)

artifacts = data.get("artifacts", [])

for artifact in artifacts:

    if artifact.get("name") == "AndroidAIDE-Signing-Key":

        if not artifact.get("expired", False):

            print(artifact.get("id"))

            break
')


            if [ -n "$ARTIFACT_ID" ]; then

              echo ""
              echo "Previous signing key artifact found."

              echo "Artifact ID:"
              echo "$ARTIFACT_ID"


              ARTIFACT_ZIP="$RUNNER_TEMP/signing-key.zip"

              DOWNLOAD_DIR="$RUNNER_TEMP/signing-key"


              rm -rf "$DOWNLOAD_DIR"

              mkdir -p "$DOWNLOAD_DIR"


              echo ""
              echo "Downloading previous signing key..."


              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
                > "$ARTIFACT_ZIP"


              if [ -s "$ARTIFACT_ZIP" ]; then

                unzip -q \
                  "$ARTIFACT_ZIP" \
                  -d "$DOWNLOAD_DIR" \
                  || true


                FOUND_KEY=$(find "$DOWNLOAD_DIR" \
                  -type f \
                  \( \
                    -name "*.jks" \
                    -o \
                    -name "*.keystore" \
                  \) \
                  | head -n 1)


                if [ -n "$FOUND_KEY" ]; then

                  cp "$FOUND_KEY" "$KEYSTORE_FILE"

                  echo ""
                  echo "Previous signing key restored."

                else

                  echo ""
                  echo "Previous artifact did not contain a keystore."

                fi

              fi

            else

              echo ""
              echo "No previous signing-key artifact found."

            fi

          fi


          # ======================================================
          # CREATE NEW KEY
          # ======================================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Creating new automatic signing key..."


            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMSoft,C=IN"


            echo ""
            echo "New signing key created."

          fi


          # ======================================================
          # VERIFY KEY
          # ======================================================

          echo ""
          echo "Verifying signing key..."


          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null


          echo ""
          echo "Signing key verification successful."


          # ======================================================
          # EXPORT ENVIRONMENT
          # ======================================================

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "SIGNING KEY READY"
          echo "=========================================="


      # ==========================================================
      # CONFIGURE DEBUG SIGNING
      # ==========================================================

      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "CONFIGURING DEBUG SIGNING"
          echo "=========================================="


          if [ ! -d "app" ]; then

            echo ""
            echo "ERROR: app directory not found."

            exit 1

          fi


          # ------------------------------------------------------
          # Groovy build.gradle
          # ------------------------------------------------------

          if [ -f "app/build.gradle" ]; then

            echo ""
            echo "Using app/build.gradle"


            cp \
              app/build.gradle \
              app/build.gradle.github-backup


            python3 <<'PY'

from pathlib import Path

path = Path("app/build.gradle")

text = path.read_text()

marker = "// ANDROID_AIDE_GITHUB_SIGNING"


if marker in text:

    print("GitHub signing configuration already exists.")

    raise SystemExit(0)


signing = r'''

// ANDROID_AIDE_GITHUB_SIGNING

android.signingConfigs.create("githubDebug") {

    storeFile file(System.getenv("KEYSTORE_FILE"))

    storePassword System.getenv("KEYSTORE_PASSWORD")

    keyAlias System.getenv("KEY_ALIAS")

    keyPassword System.getenv("KEY_PASSWORD")
}

android.buildTypes.debug.signingConfig =
    android.signingConfigs.getByName("githubDebug")
'''


text = text.rstrip() + "\n" + signing + "\n"

path.write_text(text)

print("GitHub signing configuration added.")

PY


          # ------------------------------------------------------
          # Kotlin DSL
          # ------------------------------------------------------

          elif [ -f "app/build.gradle.kts" ]; then

            echo ""
            echo "Using app/build.gradle.kts"


            cp \
              app/build.gradle.kts \
              app/build.gradle.kts.github-backup


            python3 <<'PY'

from pathlib import Path

path = Path("app/build.gradle.kts")

text = path.read_text()

marker = "// ANDROID_AIDE_GITHUB_SIGNING"


if marker in text:

    print("GitHub signing configuration already exists.")

    raise SystemExit(0)


signing = r'''

// ANDROID_AIDE_GITHUB_SIGNING

android {

    signingConfigs {

        create("githubDebug") {

            storeFile =
                file(System.getenv("KEYSTORE_FILE"))

            storePassword =
                System.getenv("KEYSTORE_PASSWORD")

            keyAlias =
                System.getenv("KEY_ALIAS")

            keyPassword =
                System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {

        getByName("debug") {

            signingConfig =
                signingConfigs.getByName("githubDebug")
        }
    }
}
'''


text = text.rstrip() + "\n" + signing + "\n"

path.write_text(text)

print("GitHub Kotlin signing configuration added.")

PY


          else

            echo ""
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."

            echo ""
            echo "App directory contents:"

            find app \
              -maxdepth 5 \
              -type f \
              -print \
              | sort

            exit 1

          fi


          echo ""
          echo "Debug signing configured."


      # ==========================================================
      # SHOW FINAL BUILD GRADLE
      # ==========================================================

      - name: Inspect Build Configuration
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "FINAL BUILD CONFIGURATION"
          echo "=========================================="


          if [ -f "app/build.gradle" ]; then

            echo ""
            echo "app/build.gradle:"
            cat app/build.gradle

          elif [ -f "app/build.gradle.kts" ]; then

            echo ""
            echo "app/build.gradle.kts:"
            cat app/build.gradle.kts

          fi


      # ==========================================================
      # BUILD DEBUG APK
      # ==========================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="


          echo ""
          echo "Project:"
          pwd


          echo ""
          echo "Gradle task:"
          echo "assembleDebug"


          echo ""
          echo "Starting Gradle..."


          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


          echo ""
          echo "=========================================="
          echo "DEBUG APK BUILD SUCCESS"
          echo "=========================================="


          echo ""
          echo "APK files:"


          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort


      # ==========================================================
      # LOCATE APK
      # ==========================================================

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"


          echo "=========================================="
          echo "LOCATING APK"
          echo "=========================================="


          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK not found."

            echo ""
            echo "Build outputs:"

            find "$ROOT/app/build/outputs" \
              -type f \
              -print \
              | sort \
              || true

            exit 1

          fi


          echo ""
          echo "APK found:"
          echo "$APK"


          echo ""
          echo "APK information:"


          ls -lh "$APK"


          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # COPY APK TO SIMPLE OUTPUT DIRECTORY
      # ==========================================================

      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          rm -rf github-apk

          mkdir -p github-apk


          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

            echo "ERROR: APK not found."

            exit 1

          fi


          cp "$APK" github-apk/AndroidAIDE-Debug.apk


          echo ""
          echo "Prepared APK:"

          ls -lh github-apk/AndroidAIDE-Debug.apk


      # ==========================================================
      # UPLOAD DEBUG APK
      # ==========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: github-apk/AndroidAIDE-Debug.apk
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # UPLOAD FULL DEBUG BUILD OUTPUT
      # ==========================================================

      - name: Upload Debug Build Output
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-Build-Output
          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # SAVE SIGNING KEY
      # ==========================================================

      - name: Save Signing Key
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: ${{ env.KEYSTORE_FILE }}
          if-no-files-found: error
          retention-days: 90


      # ==========================================================
      # FINAL SUMMARY
      # ==========================================================

      - name: Build Summary
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)


          echo ""
          echo "================================================"
          echo "ANDROID AIDE BUILD COMPLETE"
          echo "================================================"

          echo ""
          echo "Project:"
          echo "$ROOT"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "Artifacts:"
          echo "1. AndroidAIDE-Debug-APK"
          echo "2. AndroidAIDE-Debug-Build-Output"
          echo "3. AndroidAIDE-Signing-Key"

          echo ""
          echo "================================================"
