name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # CHECK PROJECT ZIP
      # ==========================================

      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then
            echo ""
            echo "ERROR: build-input/project.zip not found."
            echo ""

            echo "Current directory:"
            pwd

            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -300

            exit 1
          fi

          echo ""
          echo "Project ZIP found:"
          ls -lh build-input/project.zip

      # ==========================================
      # EXTRACT PROJECT
      # ==========================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting project..."

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Project files:"

          find android-project \
            -maxdepth 8 \
            -type f \
            | sort \
            | head -500

      # ==========================================
      # DETECT ANDROID PROJECT ROOT
      # ==========================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          echo "Searching for Android project..."

          if [ -f "android-project/settings.gradle" ]; then

            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            ROOT="android-project"

          else

            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi

          fi

          if [ -z "$ROOT" ]; then

            echo ""
            echo "ERROR: Android project root not found."
            echo ""

            find android-project \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi

          echo ""
          echo "Android project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # FIND APP MODULE
      # ==========================================

      - name: Detect App Module
        id: app
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APP_MODULE=""

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_MODULE="$ROOT/app"

          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_MODULE="$ROOT/app"

          else

            APP_BUILD=$(find "$ROOT" \
              -type f \
              \( \
                -path "*/build.gradle" \
                -o \
                -path "*/build.gradle.kts" \
              \) \
              | while read -r FILE; do
                  if grep -q \
                    "com.android.application" \
                    "$FILE" 2>/dev/null; then
                    echo "$FILE"
                    break
                  fi
                done)

            if [ -n "$APP_BUILD" ]; then
              APP_MODULE="$(dirname "$APP_BUILD")"
            fi

          fi

          if [ -z "$APP_MODULE" ]; then
            echo "ERROR: Android application module not found."
            exit 1
          fi

          echo ""
          echo "Application module:"
          echo "$APP_MODULE"

          echo "app_module=$APP_MODULE" >> "$GITHUB_OUTPUT"

      # ==========================================
      # INSPECT PROJECT
      # ==========================================

      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          APP="${{ steps.app.outputs.app_module }}"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Root:"
          echo "$ROOT"

          echo ""
          echo "App:"
          echo "$APP"

          echo ""
          echo "Gradle files:"

          find "$ROOT" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            -print

          echo ""
          echo "Java source files:"

          find "$APP/src" \
            -type f \
            -name "*.java" \
            -print 2>/dev/null || true

          echo ""
          echo "Kotlin source files:"

          find "$APP/src" \
            -type f \
            \( \
              -name "*.kt" \
              -o \
              -name "*.kts" \
            \) \
            -print 2>/dev/null || true

      # ==========================================
      # PREPARE GRADLE
      # ==========================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            ls -la
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper found."

          echo ""
          echo "Gradle version:"

          ./gradlew --version

      # ==========================================
      # NORMALIZE GRADLE FILES
      # ==========================================

      - name: Normalize Gradle Files
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "NORMALIZING GRADLE FILES"
          echo "=========================================="

          while IFS= read -r FILE; do

            python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          original = text

          text = text.replace("\\r\\n", "\n")
          text = text.replace("\\n", "\n")
          text = text.replace("\\r", "\n")
          text = text.lstrip("\ufeff")

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Normalized:", path)
          else:
              print("OK:", path)
          PY

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print
          )

      # ==========================================
      # VERIFY JAVA + KOTLIN
      # ==========================================

      - name: Verify Java Kotlin Support
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          APP="${{ steps.app.outputs.app_module }}"

          echo "=========================================="
          echo "JAVA + KOTLIN SUPPORT"
          echo "=========================================="

          echo ""
          echo "Java files:"
          JAVA_COUNT=$(find "$APP/src" \
            -type f \
            -name "*.java" \
            | wc -l)

          echo "Java source count: $JAVA_COUNT"

          echo ""
          echo "Kotlin files:"
          KOTLIN_COUNT=$(find "$APP/src" \
            -type f \
            -name "*.kt" \
            | wc -l)

          echo "Kotlin source count: $KOTLIN_COUNT"

          echo ""
          echo "Checking Kotlin plugin..."

          if grep -R \
            "org.jetbrains.kotlin.android" \
            "$ROOT" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            > /dev/null 2>&1; then

            echo "Kotlin Android plugin detected."

          else

            echo "WARNING: Kotlin Android plugin was not detected."

            if [ "$KOTLIN_COUNT" -gt 0 ]; then
              echo ""
              echo "ERROR: Kotlin source files exist but Kotlin plugin is missing."
              exit 1
            fi

          fi

          echo ""
          echo "Java + Kotlin verification completed."

      # ==========================================
      # RESTORE / CREATE SIGNING KEY
      # ==========================================

      - name: Restore Signing Keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=========================================="
          echo "RESTORE / CREATE SIGNING KEY"
          echo "=========================================="

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          KEY_ALIAS="androidaide"
          KEYSTORE_PASSWORD="androidaide-store-password"
          KEY_PASSWORD="androidaide-password"

          echo ""
          echo "Signing alias:"
          echo "$KEY_ALIAS"

          # ==========================================
          # TRY GITHUB SECRET FIRST
          # ==========================================

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then

            echo ""
            echo "GitHub signing secret found."
            echo "Restoring keystore from secret..."

            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            if [ -s "$KEYSTORE_FILE" ]; then

              if keytool \
                -list \
                -keystore "$KEYSTORE_FILE" \
                -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                > /dev/null 2>&1; then

                echo ""
                echo "Secret keystore verified successfully."

                KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
                KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
                KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

              else

                echo ""
                echo "WARNING: Secret keystore verification failed."
                echo "Falling back to automatic builder key."

                rm -f "$KEYSTORE_FILE"

              fi

            fi

          else

            echo ""
            echo "No signing secret configured."
            echo "Using automatic builder signing key."

          fi

          # ==========================================
          # FIND PREVIOUS SIGNING KEY
          # ==========================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Searching previous signing-key artifact..."

            ARTIFACT_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              2>/dev/null || echo '{"artifacts":[]}')

            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          artifacts = data.get("artifacts", [])

          for artifact in artifacts:
              if artifact.get("name") == "AndroidAIDE-Signing-Key":
                  if not artifact.get("expired", False):
                      print(artifact.get("id"))
                      break
          ')

            if [ -n "$ARTIFACT_ID" ]; then

              echo ""
              echo "Previous signing key artifact found."
              echo "Artifact ID: $ARTIFACT_ID"

              ARTIFACT_ZIP="$RUNNER_TEMP/signing-key.zip"
              DOWNLOAD_DIR="$RUNNER_TEMP/signing-key"

              rm -rf "$DOWNLOAD_DIR"
              mkdir -p "$DOWNLOAD_DIR"

              echo ""
              echo "Downloading previous signing key..."

              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
                > "$ARTIFACT_ZIP"

              if [ -s "$ARTIFACT_ZIP" ]; then

                unzip -q \
                  "$ARTIFACT_ZIP" \
                  -d "$DOWNLOAD_DIR" || true

                FOUND_KEY=$(find "$DOWNLOAD_DIR" \
                  -type f \
                  -name "*.jks" \
                  | head -n 1)

                if [ -n "$FOUND_KEY" ]; then

                  cp "$FOUND_KEY" "$KEYSTORE_FILE"

                  echo ""
                  echo "Previous signing key restored."

                fi

              fi

            else

              echo ""
              echo "No previous signing-key artifact found."

            fi

          fi

          # ==========================================
          # CREATE NEW KEY
          # ==========================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Creating new automatic signing key..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMSoft,C=IN"

            echo ""
            echo "New signing key created."

          fi

          # ==========================================
          # VERIFY KEY
          # ==========================================

          echo ""
          echo "Verifying signing key..."

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo ""
          echo "Signing key verification successful."

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SIGNING KEY READY"
          echo "=========================================="

      # ==========================================
      # CONFIGURE DEBUG SIGNING
      # ==========================================

      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          APP="${{ steps.app.outputs.app_module }}"

          cd "$ROOT"

          echo "=========================================="
          echo "CONFIGURING DEBUG SIGNING"
          echo "=========================================="

          if [ ! -f "$APP/build.gradle" ]; then

            if [ -f "$APP/build.gradle.kts" ]; then

              echo "Kotlin DSL build.gradle.kts detected."

              cp "$APP/build.gradle.kts" \
                "$APP/build.gradle.kts.github-backup"

              python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          marker = "// ANDROID_AIDE_GITHUB_SIGNING"

          if marker in text:
              print("GitHub signing configuration already exists.")
              raise SystemExit(0)

          signing = r'''

          // ANDROID_AIDE_GITHUB_SIGNING

          android {
              signingConfigs {
                  create("githubDebug") {
                      storeFile = file(System.getenv("KEYSTORE_FILE"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("githubDebug")
                  }
              }
          }
          '''

          text = text.rstrip() + "\n" + signing + "\n"

          path.write_text(text)

          print("Kotlin DSL GitHub signing configuration added.")
          PY

            else

              echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
              exit 1

            fi

          else

            cp "$APP/build.gradle" \
              "$APP/build.gradle.github-backup"

            python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          marker = "// ANDROID_AIDE_GITHUB_SIGNING"

          if marker in text:
              print("GitHub signing configuration already exists.")
              raise SystemExit(0)

          signing = r'''

          // ANDROID_AIDE_GITHUB_SIGNING

          android.signingConfigs.create("githubDebug") {
              storeFile file(System.getenv("KEYSTORE_FILE"))
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }

          android.buildTypes.debug.signingConfig =
              android.signingConfigs.getByName("githubDebug")
          '''

          text = text.rstrip() + "\n" + signing + "\n"

          path.write_text(text)

          print("Groovy GitHub signing configuration added.")
          PY

            fi

          echo ""
          echo "Debug signing configured."

      # ==========================================
      # BUILD DEBUG APK
      # JAVA + KOTLIN
      # ==========================================

      - name: Build APK
        shell: bash
        run: |
          set +e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Gradle task:"
          echo "assembleDebug"

          echo ""
          echo "Java + Kotlin compilation enabled."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "GRADLE EXIT CODE: $BUILD_EXIT"
          echo "=========================================="

          echo ""
          echo "=========================================="
          echo "FAILURE / EXCEPTION SUMMARY"
          echo "=========================================="

          grep -n -E \
            "FAILURE:|What went wrong:|Execution failed|Caused by:|Could not|A problem occurred" \
            "$LOG_FILE" \
            | tail -100 \
            || true

          echo ""
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print \
            | sort

          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "GRADLE BUILD FAILED"
            echo "=========================================="

            exit "$BUILD_EXIT"

          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

      # ==========================================
      # UPLOAD GRADLE BUILD LOG
      # ==========================================

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Gradle-Log-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # LOCATE APK
      # ==========================================

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK not found."
            echo ""

            find "$ROOT/app/build/outputs" \
              -type f \
              -print || true

            exit 1

          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # UPLOAD DEBUG APK
      # ==========================================

      - name: Upload Debug Build Output
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # SAVE SIGNING KEY
      # ==========================================

      - name: Save Signing Key
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: ${{ env.KEYSTORE_FILE }}
          if-no-files-found: error
          retention-days: 90
