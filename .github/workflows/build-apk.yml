name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Check project ZIP
      # --------------------------------------------------
      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "Checking build-input..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          ls -lh build-input/project.zip


      # --------------------------------------------------
      # 4. Extract project
      # --------------------------------------------------
      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 3 -type f | sort | head -200


      # --------------------------------------------------
      # 5. Detect Android project root
      # --------------------------------------------------
      - name: Detect Project Root
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          if [ -f "android-project/settings.gradle" ] || \
             [ -f "android-project/settings.gradle.kts" ]; then

            ROOT="android-project"

          else

            FOUND=$(find android-project -maxdepth 3 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -n "$FOUND" ]; then
              ROOT="$(dirname "$FOUND")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Project root: $ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 6. Inspect project
      # --------------------------------------------------
      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "================================"
          echo "PROJECT ROOT"
          echo "================================"

          cd "$ROOT"

          pwd

          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort | head -300


      # --------------------------------------------------
      # 7. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version


      # --------------------------------------------------
      # 8. Restore / Create signing key
      # --------------------------------------------------
      - name: Restore or Create Signing Key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          KEY_ALIAS="androidaide"

          KEYSTORE_PASSWORD="androidaide-store-password"

          KEY_PASSWORD="androidaide-password"

          ARTIFACT_NAME="AndroidAIDE-Signing-Key"

          echo "================================"
          echo "SIGNING KEY"
          echo "================================"


          # ------------------------------------------------
          # Find latest signing-key artifact
          # ------------------------------------------------

          ARTIFACT_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")


          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '
            [
              .artifacts[]
              | select(.name == "AndroidAIDE-Signing-Key")
              | select(.expired == false)
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')


          # ------------------------------------------------
          # Restore existing key
          # ------------------------------------------------

          if [ -n "$ARTIFACT_ID" ]; then

            echo "Existing signing key artifact found."

            DOWNLOAD_DIR="$RUNNER_TEMP/signing-download"

            rm -rf "$DOWNLOAD_DIR"

            mkdir -p "$DOWNLOAD_DIR"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > "$RUNNER_TEMP/signing.zip"

            unzip -q \
              "$RUNNER_TEMP/signing.zip" \
              -d "$DOWNLOAD_DIR"

            FOUND_KEY=$(find "$DOWNLOAD_DIR" \
              -type f \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -print -quit)

            if [ -z "$FOUND_KEY" ]; then
              echo "ERROR: Signing keystore not found in artifact."
              exit 1
            fi

            cp "$FOUND_KEY" "$KEYSTORE_FILE"

            echo "Signing key restored."

          else

            # ------------------------------------------------
            # Create new key
            # ------------------------------------------------

            echo "No previous signing key found."

            echo "Creating new signing key..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"

            echo "New signing key created."

          fi


          # ------------------------------------------------
          # Verify key
          # ------------------------------------------------

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Signing key verified."


          # ------------------------------------------------
          # Export environment variables
          # ------------------------------------------------

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 9. Configure Gradle signing
      # --------------------------------------------------
      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi


          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")

          text = path.read_text()

          marker = "// ANDROID_AIDE_GITHUB_SIGNING"


          if marker in text:

              print("GitHub signing configuration already exists.")

          else:

              signing = r'''

          // ANDROID_AIDE_GITHUB_SIGNING

          android.signingConfigs.create("githubDebug") {

              storeFile file(System.getenv("KEYSTORE_FILE"))

              storePassword System.getenv("KEYSTORE_PASSWORD")

              keyAlias System.getenv("KEY_ALIAS")

              keyPassword System.getenv("KEY_PASSWORD")

          }

          android.buildTypes.debug.signingConfig =
              android.signingConfigs.getByName("githubDebug")

          '''

              path.write_text(
                  text.rstrip() + "\n" + signing + "\n"
              )

              print("GitHub signing configuration added.")

          PY


          echo
          echo "Final app/build.gradle:"
          echo "--------------------------------"

          cat app/build.gradle


      # --------------------------------------------------
      # 10. Build APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "================================"
          echo "BUILDING APK"
          echo "================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "Searching APK..."

          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error


      # --------------------------------------------------
      # 13. Save signing key
      # --------------------------------------------------
      - name: Save Signing Key
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: ${{ env.KEYSTORE_FILE }}
          retention-days: 90
          if-no-files-found: error


      # --------------------------------------------------
      # 14. Build summary
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
        run: |
          echo "================================"
          echo "ANDROID AIDE BUILD SUCCESS"
          echo "================================"

          echo "Application ID is NOT changed."

          echo "versionCode is NOT changed."

          echo "Signing alias: $KEY_ALIAS"

          echo "APK artifact: AndroidAIDE-Debug-APK"

          echo "Signing artifact: AndroidAIDE-Signing-Key"
