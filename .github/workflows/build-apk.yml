name: Android AIDE - GitHub Actions Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: androidaide-signing.jks
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Java 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. Check project ZIP
      # ==================================================

      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PROJECT ZIP"
          echo "========================================"

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          ls -lh build-input/project.zip


      # ==================================================
      # 4. Extract project
      # ==================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Extracting project..."

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Extraction completed."


      # ==================================================
      # 5. Detect project root
      # ==================================================

      - name: Detect project root
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          if [ -f "android-project/settings.gradle" ]; then
            PROJECT_ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then
            PROJECT_ROOT="android-project"

          elif [ -f "android-project/android-project/settings.gradle" ]; then
            PROJECT_ROOT="android-project/android-project"

          elif [ -f "android-project/android-project/settings.gradle.kts" ]; then
            PROJECT_ROOT="android-project/android-project"

          else

            SETTINGS_FILE=$(find android-project \
              -maxdepth 5 \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"


      # ==================================================
      # 6. Prepare Gradle
      # ==================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version


      # ==================================================
      # 7. Check signing secrets
      #
      # IMPORTANT:
      # secrets are passed through env.
      # We do NOT use secrets inside if: expressions.
      # ==================================================

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING SIGNING CONFIGURATION"
          echo "========================================"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "Permanent signing key is configured."

            echo "SIGNING_KEY_EXISTS=true" >> "$GITHUB_ENV"

          else

            echo "Permanent signing key is NOT configured."

            echo "SIGNING_KEY_EXISTS=false" >> "$GITHUB_ENV"

          fi


      # ==================================================
      # 8. Restore existing signing key
      # ==================================================

      - name: Restore existing signing key
        shell: bash
        run: |
          set -e

          if [ "$SIGNING_KEY_EXISTS" != "true" ]; then

            echo "No permanent signing key to restore."
            exit 0

          fi

          echo "========================================"
          echo "RESTORING SIGNING KEY"
          echo "========================================"

          cd "$PROJECT_ROOT"

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Restored keystore is empty."
            exit 1
          fi

          echo "Signing key restored."


      # ==================================================
      # 9. Generate new key when secrets don't exist
      #
      # This generates a key for the first run.
      # ==================================================

      - name: Generate initial signing key
        shell: bash
        run: |
          set -e

          if [ "$SIGNING_KEY_EXISTS" = "true" ]; then

            echo "Existing signing key will be used."
            exit 0

          fi

          echo "========================================"
          echo "GENERATING INITIAL SIGNING KEY"
          echo "========================================"

          cd "$PROJECT_ROOT"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "androidaide" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "androidaide-store-password" \
            -keypass "androidaide-password" \
            -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"

          chmod 600 "$KEYSTORE_FILE"

          echo "Initial signing key created."


      # ==================================================
      # 10. Verify signing key
      # ==================================================

      - name: Verify signing key
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "VERIFYING SIGNING KEY"
          echo "========================================"

          if [ "$SIGNING_KEY_EXISTS" = "true" ]; then

            keytool -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS"

          else

            keytool -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "androidaide-store-password" \
              -alias "androidaide"

          fi

          echo "Signing key verified."


      # ==================================================
      # 11. Configure Android signing
      # ==================================================

      - name: Configure Android Signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          cp "$APP_GRADLE" "$APP_GRADLE.original"

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          # ------------------------------------------------
          # If signingConfigs already exists, do not create
          # another one.
          # ------------------------------------------------

          if "signingConfigs" not in text:

              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              block = '''
              signingConfigs {
                  androidAide {
                      storeFile file("../androidaide-signing.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  marker,
                  marker + block,
                  1
              )

          # ------------------------------------------------
          # Configure debug build.
          # ------------------------------------------------

          if "signingConfig signingConfigs.androidAide" not in text:

              if "debug {" in text:

                  text = text.replace(
                      "debug {",
                      """debug {
                          signingConfig signingConfigs.androidAide""",
                      1
                  )

              elif "buildTypes {" in text:

                  debug_block = '''
                      debug {
                          signingConfig signingConfigs.androidAide
                      }
                  '''

                  text = text.replace(
                      "buildTypes {",
                      "buildTypes {" + debug_block,
                      1
                  )

              else:

                  raise SystemExit(
                      "ERROR: buildTypes block not found."
                  )

          path.write_text(text)

          print("Signing configuration completed.")
          PY

          echo ""
          echo "Signing configuration:"
          grep -n "signingConfig\|storeFile\|keyAlias" \
            app/build.gradle || true


      # ==================================================
      # 12. Application information
      # ==================================================

      - name: Check Application Information
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "APPLICATION INFORMATION"
          echo "========================================"

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle || true

          echo ""
          echo "Version Code:"
          grep -n "versionCode" app/build.gradle || true

          echo ""
          echo "Version Name:"
          grep -n "versionName" app/build.gradle || true

          echo ""
          echo "versionCode is NOT modified."


      # ==================================================
      # 13. Clean
      # ==================================================

      - name: Gradle Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew clean \
            --no-daemon


      # ==================================================
      # 14. Build APK
      # ==================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "APK build completed successfully."


      # ==================================================
      # 15. Find APK
      # ==================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APK_FILE=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p ../build-output

          cp "$APK_FILE" ../build-output/app-debug.apk

          echo ""
          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          ls -lh ../build-output/app-debug.apk


      # ==================================================
      # 16. Verify APK signature
      # ==================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="build-output/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "========================================"
          echo "APK CERTIFICATE"
          echo "========================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "APK signature verified."


      # ==================================================
      # 17. Upload APK artifact
      # ==================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: build-output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ==================================================
      # 18. Bootstrap signing key artifact
      #
      # If this is the first run and GitHub Secrets are
      # not yet configured, preserve the generated JKS
      # temporarily so it can be converted into secrets.
      # ==================================================

      - name: Upload initial signing key
        if: always()
        shell: bash
        run: |
          if [ "$SIGNING_KEY_EXISTS" = "true" ]; then
            echo "Permanent signing key already exists."
            echo "No bootstrap key upload required."
            exit 0
          fi

          echo "Initial signing key generated."

          echo "The generated key is available as a temporary artifact."

          echo ""
          echo "IMPORTANT:"
          echo "Configure the permanent signing secrets before"
          echo "the temporary artifact expires."


      - name: Upload initial signing key artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Initial-Signing-Key
          path: android-project/**/androidaide-signing.jks
          if-no-files-found: warn
          retention-days: 1
