name: Android AIDE - GitHub Actions Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: androidaide-signing.jks
      KEY_ALIAS: androidaide
      KEYSTORE_PASSWORD: androidaide-store-password
      KEY_PASSWORD: androidaide-password

    steps:

      # ==================================================
      # 1. Checkout builder repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Java 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. Check project ZIP
      # ==================================================

      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PROJECT INPUT"
          echo "========================================"

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          ls -lh build-input/project.zip


      # ==================================================
      # 4. Extract project
      # ==================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Extracting Android project..."

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo ""
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100


      # ==================================================
      # 5. Detect project root
      # ==================================================

      - name: Detect project root
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          if [ -f "android-project/settings.gradle" ]; then

            PROJECT_ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project"

          elif [ -f "android-project/android-project/settings.gradle" ]; then

            PROJECT_ROOT="android-project/android-project"

          elif [ -f "android-project/android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project/android-project"

          else

            SETTINGS_FILE=$(find android-project \
              -maxdepth 5 \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"

          echo "$PROJECT_ROOT"


      # ==================================================
      # 6. Prepare Gradle
      # ==================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version


      # ==================================================
      # 7. Create signing key if no permanent secret
      #
      # This step generates the key only once.
      # The generated key is then stored in GitHub Secrets
      # by the setup step below.
      # ==================================================

      - name: Check signing configuration
        shell: bash
        run: |
          echo "Checking signing configuration..."

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Permanent signing key secret exists."
          else
            echo "Permanent signing key secret does not exist."
            echo "A new signing key will be generated."
          fi


      # ==================================================
      # 8. Generate signing key when required
      # ==================================================

      - name: Generate signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "CREATING NEW SIGNING KEY"
          echo "========================================"

          rm -f "$KEYSTORE_FILE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"

          chmod 600 "$KEYSTORE_FILE"

          echo "Signing key generated."


      # ==================================================
      # 9. Restore existing permanent signing key
      # ==================================================

      - name: Restore existing signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "RESTORING EXISTING SIGNING KEY"
          echo "========================================"

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Signing keystore is empty."
            exit 1
          fi

          echo "Existing signing key restored."


      # ==================================================
      # 10. Verify signing key
      # ==================================================

      - name: Verify signing key
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "VERIFYING SIGNING KEY"
          echo "========================================"

          keytool -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > signing-info.txt

          grep "Alias name:" signing-info.txt || true
          grep "Owner:" signing-info.txt || true
          grep "SHA256:" signing-info.txt || true

          echo ""
          echo "Signing key is valid."


      # ==================================================
      # 11. Configure Android signing
      # ==================================================

      - name: Configure Android Signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          cp "$APP_GRADLE" "$APP_GRADLE.original"

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          # ------------------------------------------------
          # Add signingConfigs
          # ------------------------------------------------

          if "signingConfigs" not in text:

              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android { block not found."
                  )

              signing_block = '''
              signingConfigs {
                  androidAide {
                      storeFile file("../androidaide-signing.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  marker,
                  marker + signing_block,
                  1
              )

          # ------------------------------------------------
          # Configure debug signing
          # ------------------------------------------------

          if "signingConfig signingConfigs.androidAide" not in text:

              if "debug {" in text:

                  text = text.replace(
                      "debug {",
                      """debug {
                          signingConfig signingConfigs.androidAide""",
                      1
                  )

              elif "buildTypes {" in text:

                  debug_block = '''
                      debug {
                          signingConfig signingConfigs.androidAide
                      }
                  '''

                  text = text.replace(
                      "buildTypes {",
                      "buildTypes {" + debug_block,
                      1
                  )

              else:

                  raise SystemExit(
                      "ERROR: buildTypes block not found."
                  )

          path.write_text(text)

          print("Signing configuration added.")
          PY

          echo ""
          echo "========================================"
          echo "FINAL app/build.gradle"
          echo "========================================"

          cat app/build.gradle


      # ==================================================
      # 12. Show applicationId/version
      # ==================================================

      - name: Check Application Information
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "APPLICATION INFORMATION"
          echo "========================================"

          grep -n "applicationId" app/build.gradle || true
          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          echo ""
          echo "versionCode will NOT be changed."


      # ==================================================
      # 13. Clean
      # ==================================================

      - name: Gradle Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew clean \
            --no-daemon


      # ==================================================
      # 14. Build APK
      # ==================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "APK build completed."


      # ==================================================
      # 15. Find APK
      # ==================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APK_FILE=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p ../build-output

          cp "$APK_FILE" ../build-output/app-debug.apk

          echo ""
          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          ls -lh ../build-output/app-debug.apk


      # ==================================================
      # 16. Verify APK signature
      # ==================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="build-output/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo ""
          echo "========================================"
          echo "APK CERTIFICATE"
          echo "========================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "APK signature verified successfully."


      # ==================================================
      # 17. Upload APK
      # ==================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: build-output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ==================================================
      # 18. Upload generated key temporarily
      #
      # IMPORTANT:
      # This is only a bootstrap artifact.
      # It allows the first run to provide the key for
      # automatic secret creation.
      # ==================================================

      - name: Upload generated signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Initial-Signing-Key
          path: android-project/**/androidaide-signing.jks
          if-no-files-found: warn
          retention-days: 1
