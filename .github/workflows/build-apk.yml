name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project ZIP
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          ls -lh build-input/project.zip

      - name: Extract Project
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Project extracted."

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          if [ -f "android-project/settings.gradle" ]; then
            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then
            ROOT="android-project"

          else
            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Android project root: $ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          chmod +x gradlew

          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7
