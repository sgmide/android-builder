name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout builder repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Check uploaded project ZIP
      # --------------------------------------------------
      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "Checking project ZIP..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Project ZIP found:"
          ls -lh build-input/project.zip


      # --------------------------------------------------
      # 4. Extract project
      # --------------------------------------------------
      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "Cleaning old project..."

          rm -rf android-project

          mkdir -p android-project

          echo "Extracting project..."

          unzip -q build-input/project.zip -d android-project

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Top-level files:"
          find android-project -maxdepth 2 -type f | sort | head -200


      # --------------------------------------------------
      # 5. Detect Android project root
      # --------------------------------------------------
      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          echo "Detecting Android project root..."

          ROOT=""

          # Normal project
          if [ -f "android-project/settings.gradle" ]; then
            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then
            ROOT="android-project"

          else

            # Search inside extracted ZIP
            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi

          fi


          if [ -z "$ROOT" ]; then

            echo "ERROR: Android project root not found."

            echo ""
            echo "Files inside android-project:"
            find android-project -type f | sort

            exit 1
          fi


          echo ""
          echo "===================================="
          echo "Android Project Root"
          echo "===================================="
          echo "$ROOT"
          echo ""


          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 6. Show project information
      # --------------------------------------------------
      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "Project root:"
          echo "$ROOT"

          echo ""
          echo "Project files:"
          find "$ROOT" -maxdepth 3 -type f | sort | head -300

          echo ""

          if [ -f "$ROOT/app/build.gradle" ]; then
            echo "===================================="
            echo "app/build.gradle"
            echo "===================================="

            cat "$ROOT/app/build.gradle"
          fi

          if [ -f "$ROOT/app/build.gradle.kts" ]; then
            echo "===================================="
            echo "app/build.gradle.kts"
            echo "===================================="

            cat "$ROOT/app/build.gradle.kts"
          fi


      # --------------------------------------------------
      # 7. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"


          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi


          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi


          chmod +x gradlew


          echo ""
          echo "===================================="
          echo "Gradle Version"
          echo "===================================="

          ./gradlew --version


      # --------------------------------------------------
      # 8. Restore persistent signing keystore
      # --------------------------------------------------
      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          set -e

          echo "Restoring signing keystore..."


          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"


          # ----------------------------------------------
          # Check secrets
          # ----------------------------------------------

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo ""
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            echo ""
            echo "Add this repository secret:"
            echo "ANDROID_KEYSTORE_BASE64"
            exit 1
          fi


          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo ""
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi


          if [ -z "$KEY_ALIAS" ]; then
            echo ""
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi


          if [ -z "$KEY_PASSWORD" ]; then
            echo ""
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi


          # ----------------------------------------------
          # Decode JKS
          # ----------------------------------------------

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"


          # ----------------------------------------------
          # Check keystore exists
          # ----------------------------------------------

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo ""
            echo "ERROR: Keystore file was not created."
            exit 1
          fi


          echo ""
          echo "Keystore file created."


          # ----------------------------------------------
          # Verify keystore
          # ----------------------------------------------

          if ! keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null 2>&1
          then

            echo ""
            echo "ERROR: Signing keystore verification failed."
            echo ""
            echo "Check:"
            echo "1. ANDROID_KEYSTORE_BASE64"
            echo "2. ANDROID_KEYSTORE_PASSWORD"
            echo "3. ANDROID_KEY_ALIAS"
            echo "4. ANDROID_KEY_PASSWORD"

            exit 1
          fi


          echo ""
          echo "Signing keystore verified successfully."


          # ----------------------------------------------
          # Export environment variables
          # ----------------------------------------------

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 9. Configure signing
      # --------------------------------------------------
      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          BUILD_FILE="$ROOT/app/build.gradle"


          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle not found."

            if [ -f "$ROOT/app/build.gradle.kts" ]; then
              echo "This project uses build.gradle.kts."
            fi

            exit 1
          fi


          echo "Configuring persistent GitHub signing..."


          # ------------------------------------------------
          # Do not add signing block twice
          # ------------------------------------------------

          if grep -q "ANDROID_AIDE_GITHUB_SIGNING" "$BUILD_FILE"; then

            echo "Signing configuration already exists."

          else

            cat >> "$BUILD_FILE" <<'EOF'


// ANDROID_AIDE_GITHUB_SIGNING

android.signingConfigs.create("githubDebug") {
    storeFile file(System.getenv("KEYSTORE_FILE"))
    storePassword System.getenv("KEYSTORE_PASSWORD")
    keyAlias System.getenv("KEY_ALIAS")
    keyPassword System.getenv("KEY_PASSWORD")
}

android.buildTypes.debug.signingConfig =
    android.signingConfigs.getByName("githubDebug")

EOF

            echo "Signing configuration added."

          fi


          echo ""
          echo "===================================="
          echo "Final app/build.gradle signing config"
          echo "===================================="

          tail -40 "$BUILD_FILE"


      # --------------------------------------------------
      # 10. Clean
      # --------------------------------------------------
      - name: Clean Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "Cleaning project..."

          ./gradlew clean --no-daemon


      # --------------------------------------------------
      # 11. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"


          echo ""
          echo "===================================="
          echo "Building Debug APK"
          echo "===================================="
          echo ""


          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # --------------------------------------------------
      # 12. Find APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"


          echo ""
          echo "===================================="
          echo "APK Verification"
          echo "===================================="


          if [ ! -f "$APK" ]; then

            echo "ERROR: app-debug.apk not found."

            echo ""
            echo "Build output:"
            find "$ROOT/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort

            exit 1
          fi


          echo ""
          echo "APK found:"
          ls -lh "$APK"


          echo ""
          echo "APK information:"

          file "$APK"


          echo ""
          echo "APK SHA256:"

          sha256sum "$APK"


      # --------------------------------------------------
      # 13. Upload APK artifact
      # --------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK

          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/output-metadata.json

          if-no-files-found: error

          retention-days: 7
