name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # CHECK PROJECT ZIP
      # ==========================================

      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then
            echo ""
            echo "ERROR: build-input/project.zip not found."
            echo ""
            echo "Current directory:"
            pwd
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo ""
          echo "Project ZIP found:"
          ls -lh build-input/project.zip


      # ==========================================
      # EXTRACT PROJECT
      # ==========================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting project..."

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Project files:"

          find android-project \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -300


      # ==========================================
      # DETECT ANDROID PROJECT ROOT
      # ==========================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          echo "Searching for Android project..."

          if [ -f "android-project/settings.gradle" ]; then

            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            ROOT="android-project"

          else

            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi

          fi

          if [ -z "$ROOT" ]; then

            echo ""
            echo "ERROR: Android project root not found."
            echo ""

            find android-project \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi

          echo ""
          echo "Android project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"


      # ==========================================
      # INSPECT PROJECT
      # ==========================================

      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Root:"
          echo "$ROOT"

          echo ""
          echo "Contents:"
          ls -la "$ROOT"

          echo ""
          echo "Gradle files:"

          find "$ROOT" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            -print


      # ==========================================
      # PREPARE GRADLE
      # ==========================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            ls -la
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper found."

          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # ==========================================
      # RESTORE / CREATE SIGNING KEY
      # ==========================================

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "=========================================="
          echo "RESTORE / CREATE SIGNING KEY"
          echo "=========================================="

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          # ==========================================
          # DEFAULT AUTOMATIC KEY SETTINGS
          # ==========================================

          KEY_ALIAS="androidaide"
          KEYSTORE_PASSWORD="androidaide-store-password"
          KEY_PASSWORD="androidaide-password"

          KEY_SOURCE="automatic"

          echo ""
          echo "Default signing alias:"
          echo "$KEY_ALIAS"


          # ==========================================
          # 1. TRY GITHUB SECRET
          # ==========================================

          if [ -n "$KEYSTORE_BASE64" ]; then

            echo ""
            echo "GitHub signing secret found."
            echo "Restoring keystore from GitHub Secret..."

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            if [ ! -s "$KEYSTORE_FILE" ]; then

              echo ""
              echo "WARNING: Secret keystore is empty."
              rm -f "$KEYSTORE_FILE"

            else

              if keytool \
                -list \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$SECRET_STORE_PASSWORD" \
                -alias "$SECRET_KEY_ALIAS" \
                > /dev/null 2>&1; then

                echo ""
                echo "Secret keystore verified successfully."

                KEY_ALIAS="$SECRET_KEY_ALIAS"
                KEYSTORE_PASSWORD="$SECRET_STORE_PASSWORD"
                KEY_PASSWORD="$SECRET_KEY_PASSWORD"

                KEY_SOURCE="github-secret"

              else

                echo ""
                echo "WARNING: GitHub Secret keystore verification failed."
                echo "Will try previous automatic signing key."

                rm -f "$KEYSTORE_FILE"

              fi

            fi

          else

            echo ""
            echo "No GitHub signing secret configured."

          fi


          # ==========================================
          # 2. FIND PREVIOUS AUTOMATIC KEY
          # ==========================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Searching previous automatic signing-key artifact..."

            ARTIFACT_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              2>/dev/null || echo '{"artifacts":[]}')

            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | python3 <<'PY'
          import sys
          import json

          data = json.load(sys.stdin)

          artifacts = data.get("artifacts", [])

          candidates = []

          for artifact in artifacts:
              if artifact.get("name") == "AndroidAIDE-Signing-Key":
                  if not artifact.get("expired", False):
                      candidates.append(artifact)

          candidates.sort(
              key=lambda x: x.get("created_at", ""),
              reverse=True
          )

          if candidates:
              print(candidates[0].get("id", ""))
          PY
          )

            if [ -n "$ARTIFACT_ID" ]; then

              echo ""
              echo "Previous signing key artifact found."
              echo "Artifact ID: $ARTIFACT_ID"

              ARTIFACT_ZIP="$RUNNER_TEMP/signing-key.zip"
              DOWNLOAD_DIR="$RUNNER_TEMP/signing-key"

              rm -rf "$DOWNLOAD_DIR"
              mkdir -p "$DOWNLOAD_DIR"

              echo ""
              echo "Downloading previous signing key..."

              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
                > "$ARTIFACT_ZIP"

              if [ -s "$ARTIFACT_ZIP" ]; then

                unzip -q \
                  "$ARTIFACT_ZIP" \
                  -d "$DOWNLOAD_DIR" || true

                FOUND_KEY=$(find "$DOWNLOAD_DIR" \
                  -type f \
                  -name "*.jks" \
                  | head -n 1)

                if [ -n "$FOUND_KEY" ]; then

                  cp "$FOUND_KEY" "$KEYSTORE_FILE"

                  KEY_SOURCE="automatic-artifact"

                  echo ""
                  echo "Previous automatic signing key restored."

                else

                  echo ""
                  echo "No JKS file found inside artifact."

                fi

              else

                echo ""
                echo "Signing key artifact download failed."

              fi

            else

              echo ""
              echo "No previous signing-key artifact found."

            fi

          fi


          # ==========================================
          # 3. CREATE NEW KEY IF NOTHING EXISTS
          # ==========================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "=========================================="
            echo "CREATING NEW AUTOMATIC SIGNING KEY"
            echo "=========================================="

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMSoft,C=IN"

            KEY_SOURCE="automatic-new"

            echo ""
            echo "New automatic signing key created."

          fi


          # ==========================================
          # VERIFY FINAL KEY
          # ==========================================

          echo ""
          echo "=========================================="
          echo "VERIFYING SIGNING KEY"
          echo "=========================================="

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo ""
          echo "Signing key verification successful."

          echo ""
          echo "Key source:"
          echo "$KEY_SOURCE"


          # ==========================================
          # EXPORT ENVIRONMENT
          # ==========================================

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_SOURCE=$KEY_SOURCE"
          } >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SIGNING KEY READY"
          echo "=========================================="


      # ==========================================
      # CONFIGURE DEBUG SIGNING
      # ==========================================

      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "CONFIGURING DEBUG SIGNING"
          echo "=========================================="

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          cp app/build.gradle \
            app/build.gradle.github-backup

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")

          text = path.read_text()

          marker = "// ANDROID_AIDE_GITHUB_SIGNING"

          if marker in text:
              print("GitHub signing configuration already exists.")
              raise SystemExit(0)

          signing = r'''

          // ANDROID_AIDE_GITHUB_SIGNING

          android.signingConfigs.create("githubDebug") {
              storeFile file(System.getenv("KEYSTORE_FILE"))
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }

          android.buildTypes.debug.signingConfig =
              android.signingConfigs.getByName("githubDebug")

          '''

          path.write_text(
              text.rstrip() + "\n" + signing + "\n"
          )

          print("GitHub signing configuration added.")
          PY

          echo ""
          echo "Debug signing configured."


      # ==========================================
      # BUILD DEBUG APK
      # ==========================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Gradle task:"
          echo "assembleDebug"

          echo ""

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "=========================================="
          echo "DEBUG APK BUILD SUCCESS"
          echo "=========================================="

          echo ""
          echo "APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # LOCATE APK
      # ==========================================

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK not found."
            echo ""

            find "$ROOT/app/build/outputs" \
              -type f \
              -print || true

            exit 1

          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload Debug Build Output
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7


      # ==========================================
      # SAVE AUTOMATIC SIGNING KEY
      # ==========================================

      - name: Save Signing Key
        if: env.KEY_SOURCE != 'github-secret'
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: ${{ env.KEYSTORE_FILE }}
          if-no-files-found: error
          retention-days: 90
