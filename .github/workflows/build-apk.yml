name: Android AIDE - GitHub Actions Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: androidaide-signing.jks
      KEY_ALIAS: androidaide
      KEYSTORE_PASSWORD: androidaide-store-password
      KEY_PASSWORD: androidaide-password

    steps:

      # --------------------------------------------------
      # 1. Checkout builder repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Check input ZIP
      # --------------------------------------------------
      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          echo "Checking build input..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          echo "Project ZIP found."
          ls -lh build-input/project.zip


      # --------------------------------------------------
      # 4. Extract Android project
      # --------------------------------------------------
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100


      # --------------------------------------------------
      # 5. Detect project root
      # --------------------------------------------------
      - name: Detect project root
        shell: bash
        run: |
          set -e

          echo "Detecting Android project root..."

          if [ -f "android-project/settings.gradle" ] || \
             [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project"

          elif [ -f "android-project/android-project/settings.gradle" ] || \
               [ -f "android-project/android-project/settings.gradle.kts" ]; then

            PROJECT_ROOT="android-project/android-project"

          else

            PROJECT_ROOT=$(find android-project -maxdepth 4 \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -d "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 3 -type f | head -100


      # --------------------------------------------------
      # 6. Prepare Gradle wrapper
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version


      # --------------------------------------------------
      # 7. Restore previous signing key
      # --------------------------------------------------
      - name: Restore Signing Keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Checking for previous signing key..."

          ARTIFACT_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")

          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '
            [
              .artifacts[]
              | select(.name == "AndroidAIDE-Signing-Key")
              | select(.expired == false)
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')

          if [ -n "$ARTIFACT_ID" ]; then

            echo "Previous signing key found."
            echo "Artifact ID: $ARTIFACT_ID"

            rm -rf signing-restore
            mkdir -p signing-restore

            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > signing-key.zip

            unzip -q signing-key.zip -d signing-restore

            FOUND_KEY=$(find signing-restore \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -print -quit)

            if [ -n "$FOUND_KEY" ]; then

              cp "$FOUND_KEY" "$PROJECT_ROOT/$KEYSTORE_FILE"

              echo "Signing key restored:"
              echo "$PROJECT_ROOT/$KEYSTORE_FILE"

            else

              echo "ERROR: Signing key artifact exists but keystore was not found."
              exit 1

            fi

          else

            echo "No previous signing key found."
            echo "A new signing key will be created."

          fi


      # --------------------------------------------------
      # 8. Create signing key if necessary
      # --------------------------------------------------
      - name: Create Signing Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ -f "$KEYSTORE_FILE" ]; then

            echo "Existing signing keystore will be used."

          else

            echo "Creating new AndroidAIDE signing keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMIDE,C=IN"

            echo "New signing keystore created."

          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD"


      # --------------------------------------------------
      # 9. Configure app signing
      # --------------------------------------------------
      - name: Configure Android Signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          cp "$APP_GRADLE" "$APP_GRADLE.backup"

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          signing_block = r'''
              signingConfigs {
                  androidAide {
                      storeFile file("../androidaide-signing.jks")
                      storePassword "androidaide-store-password"
                      keyAlias "androidaide"
                      keyPassword "androidaide-password"
                  }
              }
          '''

          if "signingConfigs" not in text:

              marker = "android {"

              if marker not in text:
                  raise SystemExit("android block not found")

              text = text.replace(
                  marker,
                  marker + "\n" + signing_block,
                  1
              )

          if "signingConfig signingConfigs.androidAide" not in text:

              default_config_marker = "defaultConfig {"

              if default_config_marker in text:

                  text = text.replace(
                      default_config_marker,
                      default_config_marker + "\n        signingConfig signingConfigs.androidAide",
                      1
                  )

          path.write_text(text)

          print("Signing configuration added.")
          PY

          echo ""
          echo "Final app/build.gradle:"
          cat app/build.gradle


      # --------------------------------------------------
      # 10. Show applicationId and version
      # --------------------------------------------------
      - name: Check Application Information
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Checking application information..."

          grep -n "applicationId" app/build.gradle || true
          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          echo ""
          echo "IMPORTANT:"
          echo "Existing versionCode is NOT modified."


      # --------------------------------------------------
      # 11. Clean project
      # --------------------------------------------------
      - name: Gradle Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon


      # --------------------------------------------------
      # 12. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Starting Gradle build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # --------------------------------------------------
      # 13. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Searching for APK..."

          APK_FILE=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p ../build-output

          cp "$APK_FILE" ../build-output/app-debug.apk

          echo ""
          echo "APK copied to:"
          echo "build-output/app-debug.apk"

          ls -lh ../build-output/app-debug.apk


      # --------------------------------------------------
      # 14. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build-output/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK missing."
            exit 1
          fi

          echo "APK information:"
          ls -lh "$APK"

          echo ""
          echo "APK signature information:"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            "$APK" || {

              echo "Build-tools 35.0.0 apksigner not available."
              echo "Trying available apksigner..."

              APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
                -name apksigner \
                -type f \
                | sort \
                | tail -1)

              if [ -z "$APKSIGNER" ]; then
                echo "ERROR: apksigner not found."
                exit 1
              fi

              "$APKSIGNER" verify \
                --verbose \
                "$APK"
          }


      # --------------------------------------------------
      # 15. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: build-output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------
      # 16. Save signing key
      # --------------------------------------------------
      - name: Save Signing Key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signing-Key
          path: |
            android-project/**/androidaide-signing.jks
          if-no-files-found: warn
          retention-days: 90
