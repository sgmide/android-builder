name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project ZIP
        run: |
          set -e

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          ls -lh build-input/project.zip

      - name: Extract Project
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Project extracted."

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          if [ -f "android-project/settings.gradle" ]; then
            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then
            ROOT="android-project"

          else
            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project root not found."
            find android-project -type f | sort
            exit 1
          fi

          echo "Project root: $ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

      # ==================================================
      # ADD: Restore Signing Keystore
      # ==================================================
      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          echo "Restoring signing keystore..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore file created."

          if ! keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null 2>&1
          then
            echo "ERROR: Signing keystore verification failed."
            exit 1
          fi

          echo "Signing keystore verified successfully."

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # ==================================================
      # ADD: Configure Debug Signing
      # ==================================================
      - name: Configure Debug Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          BUILD_FILE="$ROOT/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Configuring persistent signing..."

          if grep -q "ANDROID_AIDE_GITHUB_SIGNING" "$BUILD_FILE"; then
            echo "Signing configuration already exists."
          else

            cat >> "$BUILD_FILE" <<'EOF'


// ANDROID_AIDE_GITHUB_SIGNING

android.signingConfigs.create("githubDebug") {
    storeFile file(System.getenv("KEYSTORE_FILE"))
    storePassword System.getenv("KEYSTORE_PASSWORD")
    keyAlias System.getenv("KEY_ALIAS")
    keyPassword System.getenv("KEY_PASSWORD")
}

android.buildTypes.debug.signingConfig =
    android.signingConfigs.getByName("githubDebug")

EOF

            echo "Signing configuration added."
          fi

      - name: Build Debug APK
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            find "$ROOT/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Debug-APK
          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7
