name: Android AIDE - GitHub Actions Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # CHECK PROJECT ZIP
      # ==========================================

      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "build-input/project.zip" ]; then

            echo ""
            echo "ERROR: build-input/project.zip not found."
            echo ""

            echo "Current directory:"
            pwd

            echo ""
            echo "Repository files:"

            find . \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          echo ""
          echo "Project ZIP found:"
          ls -lh build-input/project.zip


      # ==========================================
      # EXTRACT PROJECT
      # ==========================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf android-project

          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Project files:"

          find android-project \
            -maxdepth 12 \
            -type f \
            | sort \
            | head -500


      # ==========================================
      # DETECT ANDROID PROJECT ROOT
      # ==========================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DETECTING ANDROID PROJECT"
          echo "=========================================="

          ROOT=""

          if [ -f "android-project/settings.gradle" ]; then

            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            ROOT="android-project"

          else

            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi

          fi


          if [ -z "$ROOT" ]; then

            echo ""
            echo "ERROR: Android project root not found."
            echo ""

            find android-project \
              -maxdepth 12 \
              -type f \
              | sort

            exit 1

          fi


          echo ""
          echo "Android project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"


      # ==========================================
      # INSPECT PROJECT
      # ==========================================

      - name: Inspect Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Root:"
          echo "$ROOT"

          echo ""
          echo "Contents:"

          ls -la "$ROOT"

          echo ""
          echo "Gradle files:"

          find "$ROOT" \
            -maxdepth 8 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print \
            | sort

          echo ""
          echo "Kotlin / Java source files:"

          find "$ROOT" \
            -type f \
            \( \
              -name "*.kt" \
              -o \
              -name "*.java" \
            \) \
            -print \
            | sort \
            | head -500


      # ==========================================
      # PREPARE GRADLE
      # ==========================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          echo "=========================================="
          echo "PREPARING GRADLE"
          echo "=========================================="


          if [ ! -f "gradlew" ]; then

            echo ""
            echo "ERROR: gradlew not found."

            echo ""
            echo "Project contents:"

            ls -la

            exit 1

          fi


          chmod +x gradlew


          echo ""
          echo "Gradle wrapper found."


          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # ==========================================
      # RESTORE / CREATE SIGNING KEY
      # ==========================================

      - name: Restore Signing Keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=========================================="
          echo "RESTORE / CREATE SIGNING KEY"
          echo "=========================================="


          KEYSTORE_FILE="$RUNNER_TEMP/android-aide-signing.jks"

          KEY_ALIAS="androidaide"

          KEYSTORE_PASSWORD="androidaide-store-password"

          KEY_PASSWORD="androidaide-password"


          echo ""
          echo "Signing alias:"
          echo "$KEY_ALIAS"


          # ==========================================
          # GITHUB SECRET
          # ==========================================

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then

            echo ""
            echo "GitHub signing secret found."

            echo "Restoring keystore..."


            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
              | base64 --decode \
              > "$KEYSTORE_FILE"


            if [ -s "$KEYSTORE_FILE" ]; then

              if keytool \
                -list \
                -keystore "$KEYSTORE_FILE" \
                -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                > /dev/null 2>&1; then


                echo ""
                echo "Secret keystore verified."


                KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"

                KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

                KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"


              else

                echo ""
                echo "WARNING: Secret keystore verification failed."

                echo "Using automatic signing key."

                rm -f "$KEYSTORE_FILE"

              fi

            fi

          else

            echo ""
            echo "No signing secret configured."

            echo "Using automatic builder signing key."

          fi


          # ==========================================
          # RESTORE PREVIOUS ARTIFACT
          # ==========================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Searching previous signing-key artifact..."


            ARTIFACT_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              2>/dev/null \
              || echo '{"artifacts":[]}')


            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | python3 -c '

          import sys
          import json

          data = json.load(sys.stdin)

          artifacts = data.get("artifacts", [])

          for artifact in artifacts:

              if artifact.get("name") == "AndroidAIDE-Signing-Key":

                  if not artifact.get("expired", False):

                      print(artifact.get("id"))

                      break

          ')


            if [ -n "$ARTIFACT_ID" ]; then

              echo ""
              echo "Previous signing key artifact found."

              echo "Artifact ID: $ARTIFACT_ID"


              ARTIFACT_ZIP="$RUNNER_TEMP/signing-key.zip"

              DOWNLOAD_DIR="$RUNNER_TEMP/signing-key"


              rm -rf "$DOWNLOAD_DIR"

              mkdir -p "$DOWNLOAD_DIR"


              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
                > "$ARTIFACT_ZIP"


              if [ -s "$ARTIFACT_ZIP" ]; then

                unzip -q \
                  "$ARTIFACT_ZIP" \
                  -d "$DOWNLOAD_DIR" \
                  || true


                FOUND_KEY=$(find "$DOWNLOAD_DIR" \
                  -type f \
                  \( \
                    -name "*.jks" \
                    -o \
                    -name "*.keystore" \
                  \) \
                  | head -n 1)


                if [ -n "$FOUND_KEY" ]; then

                  cp "$FOUND_KEY" "$KEYSTORE_FILE"

                  echo ""
                  echo "Previous signing key restored."

                fi

              fi

            else

              echo ""
              echo "No previous signing-key artifact found."

            fi

          fi


          # ==========================================
          # CREATE NEW KEY
          # ==========================================

          if [ ! -s "$KEYSTORE_FILE" ]; then

            echo ""
            echo "Creating new automatic signing key..."


            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AndroidAIDE,O=SGMSoft,C=IN"


            echo ""
            echo "New signing key created."

          fi


          # ==========================================
          # VERIFY KEY
          # ==========================================

          echo ""
          echo "Verifying signing key..."


          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null


          echo ""
          echo "Signing key verification successful."


          # ==========================================
          # EXPORT ENVIRONMENT
          # ==========================================

          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "SIGNING KEY READY"
          echo "=========================================="


      # ==========================================
      # CONFIGURE DEBUG SIGNING
      # GROOVY + KOTLIN DSL
      # ==========================================

      - name: Configure Debug Signing
        shell: bash
        run: |

          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"


          echo "=========================================="
          echo "CONFIGURING DEBUG SIGNING"
          echo "=========================================="


          # ==========================================
          # GROOVY
          # ==========================================

          if [ -f "app/build.gradle" ]; then

            echo ""
            echo "Found app/build.gradle"


            cp app/build.gradle \
              app/build.gradle.github-backup


            python3 <<'PY'

from pathlib import Path

path = Path("app/build.gradle")

text = path.read_text()

marker = "// ANDROID_AIDE_GITHUB_SIGNING"


if marker in text:

    print("Signing configuration already exists.")

    raise SystemExit(0)


signing = r'''

// ANDROID_AIDE_GITHUB_SIGNING

android {
    signingConfigs {
        create("githubDebug") {
            storeFile file(System.getenv("KEYSTORE_FILE"))
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.getByName("githubDebug")
        }
    }
}
'''


path.write_text(
    text.rstrip()
    + "\n"
    + signing
    + "\n"
)


print("Groovy signing configuration added.")

PY


          # ==========================================
          # KOTLIN DSL
          # ==========================================

          elif [ -f "app/build.gradle.kts" ]; then

            echo ""
            echo "Found app/build.gradle.kts"


            cp app/build.gradle.kts \
              app/build.gradle.kts.github-backup


            python3 <<'PY'

from pathlib import Path

path = Path("app/build.gradle.kts")

text = path.read_text()

marker = "// ANDROID_AIDE_GITHUB_SIGNING"


if marker in text:

    print("Signing configuration already exists.")

    raise SystemExit(0)


signing = r'''

// ANDROID_AIDE_GITHUB_SIGNING

android {
    signingConfigs {
        create("githubDebug") {
            storeFile = file(System.getenv("KEYSTORE_FILE"))
            storePassword = System.getenv("KEYSTORE_PASSWORD")
            keyAlias = System.getenv("KEY_ALIAS")
            keyPassword = System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.getByName("githubDebug")
        }
    }
}
'''


path.write_text(
    text.rstrip()
    + "\n"
    + signing
    + "\n"
)


print("Kotlin DSL signing configuration added.")

PY


          else

            echo ""
            echo "ERROR: Android app Gradle file not found."

            echo ""
            echo "Expected:"

            echo "app/build.gradle"

            echo "or"

            echo "app/build.gradle.kts"

            echo ""

            find "$ROOT" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi


          echo ""
          echo "Debug signing configured successfully."


      # ==========================================
      # VERIFY ANDROID MODULE
      # ==========================================

      - name: Verify Android Module
        shell: bash
        run: |

          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"


          echo "=========================================="
          echo "VERIFYING ANDROID MODULE"
          echo "=========================================="


          if [ ! -d "app" ]; then

            echo ""
            echo "ERROR: app module not found."

            ls -la

            exit 1

          fi


          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then

            echo ""
            echo "ERROR: AndroidManifest.xml not found."

            exit 1

          fi


          echo ""
          echo "Android app module verified."


          echo ""
          echo "Manifest:"

          ls -lh app/src/main/AndroidManifest.xml


          echo ""
          echo "Source files:"

          find app/src/main \
            -type f \
            \( \
              -name "*.kt" \
              -o \
              -name "*.java" \
            \) \
            -print \
            | sort


      # ==========================================
      # BUILD DEBUG APK
      # ==========================================

      - name: Build APK
        shell: bash
        run: |

          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"


          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="


          echo ""
          echo "Project:"
          pwd


          echo ""
          echo "Gradle version:"

          ./gradlew --version


          echo ""
          echo "Running: assembleDebug"


          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


          echo ""
          echo "=========================================="
          echo "DEBUG APK BUILD SUCCESS"
          echo "=========================================="


          echo ""
          echo "APK files:"


          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # LOCATE APK
      # ==========================================

      - name: Locate APK
        id: apk
        shell: bash
        run: |

          set -e

          ROOT="${{ steps.project.outputs.project_root }}"


          APK=$(find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK not found."

            echo ""

            find "$ROOT/app/build/outputs" \
              -type f \
              -print \
              || true

            exit 1

          fi


          echo ""
          echo "APK found:"

          echo "$APK"


          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:

          name: AndroidAIDE-Debug-APK-${{ github.run_id }}

          path: |
            ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/*.apk

          if-no-files-found: error

          retention-days: 7


      # ==========================================
      # SAVE SIGNING KEY
      # UNIQUE ARTIFACT NAME
      # ==========================================

      - name: Save Signing Key
        uses: actions/upload-artifact@v4
        with:

          name: AndroidAIDE-Signing-Key-${{ github.run_id }}

          path: ${{ env.KEYSTORE_FILE }}

          if-no-files-found: error

          retention-days: 90
