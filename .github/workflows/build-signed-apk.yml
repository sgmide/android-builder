name: Build Signed APK / AAB

on:
  workflow_dispatch:
    inputs:

      build_type:
        description: "Select build type"
        required: true
        default: "APK"
        type: choice
        options:
          - APK
          - AAB

      module:
        description: "Gradle module"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string


jobs:

  build:

    name: Build ${{ inputs.build_type }}

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # Verify Java
      # --------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"


      # --------------------------------------------------
      # Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools


      # --------------------------------------------------
      # Install Android SDK 35
      # --------------------------------------------------
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # Check Android SDK
      # --------------------------------------------------
      - name: Check Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed SDK platforms:"
          sdkmanager --list_installed | grep "platforms;android-35" || true

          echo ""
          echo "Installed build tools:"
          sdkmanager --list_installed | grep "build-tools;35.0.0" || true


      # --------------------------------------------------
      # Check uploaded project
      # --------------------------------------------------
      - name: Check build input
        run: |
          echo "Checking uploaded project..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found"
            exit 1
          fi

          if [ ! -f "build-input/signing-key.jks" ]; then
            echo "ERROR: build-input/signing-key.jks not found"
            exit 1
          fi

          echo "Project ZIP found"
          echo "Keystore found"


      # --------------------------------------------------
      # Extract uploaded project
      # --------------------------------------------------
      - name: Extract project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo "Project extracted"

          echo ""
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100


      # --------------------------------------------------
      # Find actual Gradle project directory
      # --------------------------------------------------
      - name: Detect project directory
        shell: bash
        run: |

          if [ -f "android-project/settings.gradle" ] || \
             [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_DIR="android-project"

          else

            FOUND=$(find android-project \
              -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -z "$FOUND" ]; then
              echo "ERROR: settings.gradle or settings.gradle.kts not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$FOUND")

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Detected project directory:"
          echo "$PROJECT_DIR"


      # --------------------------------------------------
      # Show detected project
      # --------------------------------------------------
      - name: Show project
        run: |

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Gradle files:"
          find "$PROJECT_DIR" \
            -maxdepth 2 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print


      # --------------------------------------------------
      # Check Gradle wrapper
      # --------------------------------------------------
      - name: Check Gradle wrapper
        run: |

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties not found"
            exit 1
          fi

          echo "Gradle wrapper found"

          echo ""
          echo "Gradle wrapper properties:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"


      # --------------------------------------------------
      # Prepare signing
      # --------------------------------------------------
      - name: Prepare signing
        run: |

          mkdir -p "$PROJECT_DIR/.androidaide/signing"

          cp \
            build-input/signing-key.jks \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Keystore copied"

          ls -lh \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"


      # --------------------------------------------------
      # Create signing.properties
      # --------------------------------------------------
      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}

        run: |

          cat > "$PROJECT_DIR/signing.properties" <<EOF
          storeFile=.androidaide/signing/release-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "signing.properties created"


      # --------------------------------------------------
      # Check signing configuration
      # --------------------------------------------------
      - name: Check signing configuration
        run: |

          echo "Checking signing configuration..."

          test -f "$PROJECT_DIR/signing.properties"

          test -f \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          test -s \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Signing configuration OK"


      # --------------------------------------------------
      # Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        run: |

          chmod +x "$PROJECT_DIR/gradlew"

          ls -l "$PROJECT_DIR/gradlew"


      # --------------------------------------------------
      # Check Gradle version
      # --------------------------------------------------
      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          ./gradlew --version


      # --------------------------------------------------
      # Gradle clean
      # --------------------------------------------------
      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          ./gradlew clean \
            -PsigningPropertiesFile=signing.properties \
            --stacktrace


      # ==================================================
      # APK
      # ==================================================

      # --------------------------------------------------
      # Build Signed APK
      # --------------------------------------------------
      - name: Build Signed APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "Building signed APK..."

          ./gradlew \
            :${{ inputs.module }}:assembleRelease \
            -PsigningPropertiesFile=signing.properties \
            --stacktrace \
            --info


      # --------------------------------------------------
      # Find APK
      # --------------------------------------------------
      - name: Find APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "Generated APK files:"

          find "${{ inputs.module }}/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          APK_COUNT=$(find \
            "${{ inputs.module }}/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully"

          find \
            "${{ inputs.module }}/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # --------------------------------------------------
      # Copy APK
      #
      # Source:
      # build/outputs/apk/release/*.apk
      #
      # Destination:
      # output/app-release.apk
      # --------------------------------------------------
      - name: Copy APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          rm -rf output
          mkdir -p output

          APK_FILE=$(find \
            "${{ inputs.module }}/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          cp "$APK_FILE" output/app-release.apk

          echo "APK copied:"
          ls -lh output/app-release.apk


      # --------------------------------------------------
      # Upload Signed APK
      # --------------------------------------------------
      - name: Upload Signed APK
        if: ${{ inputs.build_type == 'APK' }}
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: |
            ${{ env.PROJECT_DIR }}/output/app-release.apk
          if-no-files-found: error


      # ==================================================
      # AAB
      # ==================================================

      # --------------------------------------------------
      # Build Signed AAB
      # --------------------------------------------------
      - name: Build Signed AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "Building signed AAB..."

          ./gradlew \
            :${{ inputs.module }}:bundleRelease \
            -PsigningPropertiesFile=signing.properties \
            --stacktrace \
            --info


      # --------------------------------------------------
      # Find AAB
      # --------------------------------------------------
      - name: Find AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "Generated AAB files:"

          find "${{ inputs.module }}/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            -print


      # --------------------------------------------------
      # Verify AAB
      # --------------------------------------------------
      - name: Verify AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          AAB_COUNT=$(find \
            "${{ inputs.module }}/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            | wc -l)

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          echo "AAB generated successfully"

          find \
            "${{ inputs.module }}/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            -exec ls -lh {} \;


      # --------------------------------------------------
      # Copy AAB
      #
      # Source:
      # build/outputs/bundle/release/*.aab
      #
      # Destination:
      # output/app-release.aab
      # --------------------------------------------------
      - name: Copy AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          rm -rf output
          mkdir -p output

          AAB_FILE=$(find \
            "${{ inputs.module }}/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found"
            exit 1
          fi

          cp "$AAB_FILE" output/app-release.aab

          echo "AAB copied:"
          ls -lh output/app-release.aab


      # --------------------------------------------------
      # Upload Signed AAB
      # --------------------------------------------------
      - name: Upload Signed AAB
        if: ${{ inputs.build_type == 'AAB' }}
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: |
            ${{ env.PROJECT_DIR }}/output/app-release.aab
          if-no-files-found: error


      # --------------------------------------------------
      # Final output
      # --------------------------------------------------
      - name: Show final output
        run: |

          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"

          if [ "${{ inputs.build_type }}" = "APK" ]; then

            echo ""
            echo "APK:"
            ls -lh \
              "$PROJECT_DIR/output/app-release.apk"

          else

            echo ""
            echo "AAB:"
            ls -lh \
              "$PROJECT_DIR/output/app-release.aab"

          fi
