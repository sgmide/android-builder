name: Android AIDE - Signed APK & AAB Build

on:
  workflow_dispatch:
    inputs:

      module:
        description: "Android module name"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # PREPARE BUILD INPUT
      # ============================================================

      - name: Prepare build input
        shell: bash
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |

          set -e

          echo "========================================"
          echo "PREPARE SIGNED BUILD"
          echo "========================================"

          mkdir -p build-input

          # --------------------------------------------------------
          # Find keystore
          # --------------------------------------------------------

          if [ -f "build-input/signing-key.jks" ]; then

              echo "Keystore found:"
              echo "build-input/signing-key.jks"

          elif [ -f "signing-key.jks" ]; then

              cp "signing-key.jks" \
                 "build-input/signing-key.jks"

              echo "Keystore copied."

          else

              echo ""
              echo "ERROR: signing-key.jks not found."
              echo ""
              echo "Expected:"
              echo "build-input/signing-key.jks"

              exit 1

          fi

          # --------------------------------------------------------
          # Create signing.properties
          # --------------------------------------------------------

          cat > build-input/signing.properties <<EOF
storeFile=build-input/signing-key.jks
storePassword=$STORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

          chmod 600 build-input/signing-key.jks
          chmod 600 build-input/signing.properties

          echo ""
          echo "Signing input prepared."


      # ============================================================
      # DETECT PROJECT ROOT
      # ============================================================

      - name: Detect project root
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "DETECT PROJECT ROOT"
          echo "========================================"

          PROJECT_ROOT=""

          # --------------------------------------------------------
          # Current directory
          # --------------------------------------------------------

          if [ -f "settings.gradle" ] || \
             [ -f "settings.gradle.kts" ] || \
             [ -f "gradlew" ]; then

              PROJECT_ROOT="."

          else

              # ----------------------------------------------------
              # Search nested project
              # ----------------------------------------------------

              SETTINGS_FILE=$(find . \
                -maxdepth 4 \
                \( \
                  -name "settings.gradle" \
                  -o \
                  -name "settings.gradle.kts" \
                \) \
                -print -quit)

              if [ -n "$SETTINGS_FILE" ]; then

                  PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

              fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then

              echo ""
              echo "ERROR: Gradle project root not found."

              echo ""
              echo "Available Gradle files:"

              find . \
                -maxdepth 5 \
                -type f \
                \( \
                  -name "settings.gradle" \
                  -o \
                  -name "settings.gradle.kts" \
                  -o \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print

              exit 1

          fi

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # INSTALL SIGNING FILES
      # ============================================================

      - name: Install signing files
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "INSTALL SIGNING FILES"
          echo "========================================"

          cd "$PROJECT_ROOT"

          mkdir -p build-input

          cp "$GITHUB_WORKSPACE/build-input/signing-key.jks" \
             "build-input/signing-key.jks"

          cp "$GITHUB_WORKSPACE/build-input/signing.properties" \
             "signing.properties"

          chmod 600 build-input/signing-key.jks
          chmod 600 signing.properties

          echo ""
          echo "Signing files installed."


      # ============================================================
      # FIND MODULE GRADLE
      # ============================================================

      - name: Find module Gradle file
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          echo "========================================"
          echo "FIND MODULE GRADLE"
          echo "========================================"

          cd "$PROJECT_ROOT"

          MODULE_GRADLE=""

          if [ -f "$MODULE/build.gradle" ]; then

              MODULE_GRADLE="$MODULE/build.gradle"

          elif [ -f "$MODULE/build.gradle.kts" ]; then

              MODULE_GRADLE="$MODULE/build.gradle.kts"

          else

              echo ""
              echo "ERROR: Module Gradle file not found."

              echo ""
              echo "Looking for:"
              echo "$MODULE/build.gradle"
              echo "$MODULE/build.gradle.kts"

              echo ""
              echo "Available files:"

              find . \
                -maxdepth 5 \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print

              exit 1

          fi

          echo ""
          echo "Module Gradle:"
          echo "$MODULE_GRADLE"

          echo "MODULE_GRADLE=$MODULE_GRADLE" >> "$GITHUB_ENV"


      # ============================================================
      # INJECT SIGNING CONFIGURATION
      # ============================================================

      - name: Inject release signing
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "INJECT RELEASE SIGNING"
          echo "========================================"

          echo ""
          echo "Gradle file:"
          echo "$MODULE_GRADLE"


          # ========================================================
          # GROOVY
          # ========================================================

          if [[ "$MODULE_GRADLE" == *.gradle ]]; then

              echo ""
              echo "Groovy build.gradle detected."

              python3 - "$MODULE_GRADLE" <<'PY'
import sys
from pathlib import Path

gradle_path = Path(sys.argv[1])
text = gradle_path.read_text()

# ------------------------------------------------------------
# Signing properties loader
# ------------------------------------------------------------

loader = r'''
import java.util.Properties

def signingPropertiesFile = rootProject.file("signing.properties")

def signingProperties = new Properties()

if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream {
        signingProperties.load(it)
    }
}
'''

# ------------------------------------------------------------
# Add loader only once
# ------------------------------------------------------------

if "def signingPropertiesFile" not in text:
    text = loader + "\n" + text


# ------------------------------------------------------------
# Signing configuration
# ------------------------------------------------------------

signing_config = r'''
    signingConfigs {

        release {

            if (signingPropertiesFile.exists()) {

                storeFile rootProject.file(
                    signingProperties.getProperty("storeFile")
                )

                storePassword signingProperties.getProperty(
                    "storePassword"
                )

                keyAlias signingProperties.getProperty(
                    "keyAlias"
                )

                keyPassword signingProperties.getProperty(
                    "keyPassword"
                )
            }
        }
    }
'''


# ------------------------------------------------------------
# Release build type
# ------------------------------------------------------------

release_config = r'''
    buildTypes {

        release {

            signingConfig signingConfigs.release

            minifyEnabled false
        }
    }
'''


# ------------------------------------------------------------
# Find android { block
# ------------------------------------------------------------

android_match = text.find("android")

if android_match == -1:
    raise SystemExit(
        "ERROR: android { block not found."
    )

android_open = text.find("{", android_match)

if android_open == -1:
    raise SystemExit(
        "ERROR: android { opening brace not found."
    )


# ------------------------------------------------------------
# Find matching closing brace
# ------------------------------------------------------------

depth = 0
android_close = -1

in_single = False
in_double = False
escaped = False

i = android_open

while i < len(text):

    ch = text[i]

    if escaped:
        escaped = False
        i += 1
        continue

    if ch == "\\":
        escaped = True
        i += 1
        continue

    if not in_double and ch == "'":
        in_single = not in_single

    elif not in_single and ch == '"':
        in_double = not in_double

    elif not in_single and not in_double:

        if ch == "{":
            depth += 1

        elif ch == "}":

            depth -= 1

            if depth == 0:
                android_close = i
                break

    i += 1


if android_close == -1:
    raise SystemExit(
        "ERROR: android { block could not be parsed."
    )


# ------------------------------------------------------------
# Inject only once
# ------------------------------------------------------------

android_content = text[
    android_open + 1:
    android_close
]

injection = ""


if "androidAideRelease" not in android_content and \
   "signingConfigs" not in android_content:

    injection += "\n"
    injection += signing_config
    injection += "\n"


# ------------------------------------------------------------
# Configure release build type
# ------------------------------------------------------------

if "signingConfig signingConfigs.release" not in android_content:

    injection += "\n"
    injection += release_config
    injection += "\n"


# ------------------------------------------------------------
# Insert into existing android block
# ------------------------------------------------------------

if injection.strip():

    text = (
        text[:android_close]
        + injection
        + text[android_close:]
    )


gradle_path.write_text(text)

print("Groovy signing configuration injected successfully.")
PY


          # ========================================================
          # KOTLIN DSL
          # ========================================================

          elif [[ "$MODULE_GRADLE" == *.gradle.kts ]]; then

              echo ""
              echo "Kotlin DSL build.gradle.kts detected."

              python3 - "$MODULE_GRADLE" <<'PY'
import sys
from pathlib import Path

gradle_path = Path(sys.argv[1])
text = gradle_path.read_text()


# ------------------------------------------------------------
# Properties loader
# ------------------------------------------------------------

loader = r'''
import java.util.Properties
import java.io.FileInputStream

val signingPropertiesFile =
    rootProject.file("signing.properties")

val signingProperties = Properties()

if (signingPropertiesFile.exists()) {

    FileInputStream(signingPropertiesFile).use {
        signingProperties.load(it)
    }
}
'''


if "val signingPropertiesFile" not in text:
    text = loader + "\n" + text


# ------------------------------------------------------------
# Kotlin signing config
# ------------------------------------------------------------

signing_config = r'''
    signingConfigs {

        create("androidAideRelease") {

            if (signingPropertiesFile.exists()) {

                storeFile =
                    rootProject.file(
                        signingProperties.getProperty(
                            "storeFile"
                        )
                    )

                storePassword =
                    signingProperties.getProperty(
                        "storePassword"
                    )

                keyAlias =
                    signingProperties.getProperty(
                        "keyAlias"
                    )

                keyPassword =
                    signingProperties.getProperty(
                        "keyPassword"
                    )
            }
        }
    }
'''


# ------------------------------------------------------------
# Kotlin release config
# ------------------------------------------------------------

release_config = r'''
    buildTypes {

        getByName("release") {

            signingConfig =
                signingConfigs.getByName(
                    "androidAideRelease"
                )

            isMinifyEnabled = false
        }
    }
'''


# ------------------------------------------------------------
# Find android block
# ------------------------------------------------------------

android_match = text.find("android")

if android_match == -1:
    raise SystemExit(
        "ERROR: android { block not found."
    )

android_open = text.find("{", android_match)

if android_open == -1:
    raise SystemExit(
        "ERROR: android opening brace not found."
    )


# ------------------------------------------------------------
# Match braces
# ------------------------------------------------------------

depth = 0
android_close = -1

i = android_open

while i < len(text):

    if text[i] == "{":
        depth += 1

    elif text[i] == "}":

        depth -= 1

        if depth == 0:
            android_close = i
            break

    i += 1


if android_close == -1:
    raise SystemExit(
        "ERROR: android block could not be parsed."
    )


android_content = text[
    android_open + 1:
    android_close
]


injection = ""


if "androidAideRelease" not in android_content:

    injection += "\n"
    injection += signing_config
    injection += "\n"


if "androidAideRelease" not in android_content:

    injection += "\n"
    injection += release_config
    injection += "\n"


if injection.strip():

    text = (
        text[:android_close]
        + injection
        + text[android_close:]
    )


gradle_path.write_text(text)

print("Kotlin signing configuration injected successfully.")
PY


          else

              echo ""
              echo "ERROR: Unsupported Gradle file:"
              echo "$MODULE_GRADLE"

              exit 1

          fi


      # ============================================================
      # SHOW MODIFIED GRADLE
      # ============================================================

      - name: Verify Gradle signing configuration
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "MODIFIED GRADLE FILE"
          echo "========================================"

          echo ""

          cat "$MODULE_GRADLE"

          echo ""
          echo "========================================"
          echo "CHECK SIGNING CONFIGURATION"
          echo "========================================"

          if ! grep -q "signingConfig" "$MODULE_GRADLE"; then

              echo ""
              echo "ERROR: signingConfig was not injected."

              exit 1

          fi

          echo ""
          echo "signingConfig detected successfully."


      # ============================================================
      # CHECK SIGNING FILE
      # ============================================================

      - name: Check signing files
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "CHECK SIGNING FILES"
          echo "========================================"

          if [ ! -f "signing.properties" ]; then

              echo "ERROR: signing.properties not found."
              exit 1

          fi

          if [ ! -f "build-input/signing-key.jks" ]; then

              echo "ERROR: signing-key.jks not found."
              exit 1

          fi

          echo ""
          echo "Signing files OK."

          echo ""
          echo "signing.properties:"

          sed \
            -e 's/^storePassword=.*/storePassword=***HIDDEN***/' \
            -e 's/^keyPassword=.*/keyPassword=***HIDDEN***/' \
            signing.properties


      # ============================================================
      # GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "PREPARE GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "./gradlew" ]; then

              echo ""
              echo "ERROR: gradlew not found."

              find . \
                -maxdepth 4 \
                -type f \
                -name "gradlew" \
                -print

              exit 1

          fi

          chmod +x ./gradlew

          echo ""
          echo "Gradle wrapper ready."


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "CLEAN PROJECT"
          echo "========================================"

          ./gradlew clean --no-daemon


      # ============================================================
      # BUILD SIGNED APK
      # ============================================================

      - name: Build signed APK
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILD SIGNED APK"
          echo "========================================"

          ./gradlew \
            ":$MODULE:assembleRelease" \
            --stacktrace \
            --no-daemon

          echo ""
          echo "APK build completed."


      # ============================================================
      # BUILD SIGNED AAB
      # ============================================================

      - name: Build signed AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILD SIGNED AAB"
          echo "========================================"

          ./gradlew \
            ":$MODULE:bundleRelease" \
            --stacktrace \
            --no-daemon

          echo ""
          echo "AAB build completed."


      # ============================================================
      # SHOW ALL OUTPUTS
      # ============================================================

      - name: Inspect build outputs
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""
          echo "APK outputs:"
          echo "----------------------------------------"

          find "$MODULE/build/outputs/apk" \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "AAB outputs:"
          echo "----------------------------------------"

          find "$MODULE/build/outputs/bundle" \
            -type f \
            -print 2>/dev/null || true


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify signed APK
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "VERIFY SIGNED APK"
          echo "========================================"

          APK_PATH="$MODULE/build/outputs/apk/release/app-release.apk"

          echo ""
          echo "Expected:"
          echo "$APK_PATH"

          if [ ! -f "$APK_PATH" ]; then

              echo ""
              echo "ERROR: signed APK not found."

              echo ""
              echo "Actual APK files:"

              find "$MODULE/build/outputs/apk" \
                -type f \
                -print 2>/dev/null || true

              echo ""
              echo "This means Gradle did not generate:"
              echo "app-release.apk"

              exit 1

          fi

          echo ""
          echo "SIGNED APK FOUND"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY AAB
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "VERIFY SIGNED AAB"
          echo "========================================"

          AAB_PATH="$MODULE/build/outputs/bundle/release/app-release.aab"

          echo ""
          echo "Expected:"
          echo "$AAB_PATH"

          if [ ! -f "$AAB_PATH" ]; then

              echo ""
              echo "ERROR: signed AAB not found."

              echo ""
              echo "Actual AAB files:"

              find "$MODULE/build/outputs/bundle" \
                -type f \
                -print 2>/dev/null || true

              echo ""
              echo "This means Gradle did not generate:"
              echo "app-release.aab"

              exit 1

          fi

          echo ""
          echo "SIGNED AAB FOUND"

          ls -lh "$AAB_PATH"

          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # FINAL OUTPUT CHECK
      # ============================================================

      - name: Final output check
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo ""
          echo "========================================"
          echo "FINAL OUTPUT"
          echo "========================================"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "AAB:"
          echo "$AAB_PATH"

          echo ""
          echo "APK size:"
          du -h "$APK_PATH"

          echo ""
          echo "AAB size:"
          du -h "$AAB_PATH"

          echo ""
          echo "========================================"
          echo "SIGNED BUILD SUCCESS"
          echo "========================================"


      # ============================================================
      # UPLOAD SIGNED APK
      # ============================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: ${{ env.PROJECT_ROOT }}/${{ env.APK_PATH }}
          if-no-files-found: error


      # ============================================================
      # UPLOAD SIGNED AAB
      # ============================================================

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: ${{ env.PROJECT_ROOT }}/${{ env.AAB_PATH }}
          if-no-files-found: error
