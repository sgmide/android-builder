name: Build Signed APK / AAB

on:
  workflow_dispatch:
    inputs:

      build_type:
        description: "Select build type"
        required: true
        default: "APK"
        type: choice
        options:
          - APK
          - AAB

      module:
        description: "Gradle module"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string


jobs:

  build:

    name: Build ${{ inputs.build_type }}

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Check Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools


      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Check Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed SDK platforms:"
          sdkmanager --list_installed | grep "platforms;android-35" || true

          echo ""
          echo "Installed build tools:"
          sdkmanager --list_installed | grep "build-tools;35.0.0" || true


      # ==================================================
      # CHECK BUILD INPUT
      # ==================================================

      - name: Check build input
        run: |
          echo "Checking uploaded project..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found"
            exit 1
          fi

          if [ ! -f "build-input/signing-key.jks" ]; then
            echo "ERROR: build-input/signing-key.jks not found"
            exit 1
          fi

          echo "Project ZIP found"
          echo "Keystore found"


      # ==================================================
      # EXTRACT PROJECT
      # ==================================================

      - name: Extract project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo "Project extracted"

          echo ""
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100


      # ==================================================
      # DETECT PROJECT DIRECTORY
      # ==================================================

      - name: Detect project directory
        shell: bash
        run: |

          if [ -f "android-project/settings.gradle" ] || \
             [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_DIR="android-project"

          else

            FOUND=$(find android-project \
              -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -z "$FOUND" ]; then
              echo "ERROR: settings.gradle or settings.gradle.kts not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$FOUND")

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Detected project directory:"
          echo "$PROJECT_DIR"


      # ==================================================
      # SHOW PROJECT
      # ==================================================

      - name: Show project
        run: |

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Gradle files:"

          find "$PROJECT_DIR" \
            -maxdepth 2 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print


      # ==================================================
      # CHECK GRADLE WRAPPER
      # ==================================================

      - name: Check Gradle wrapper
        run: |

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties not found"
            exit 1
          fi

          echo "Gradle wrapper found"

          echo ""
          echo "Gradle wrapper properties:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"


      # ==================================================
      # PREPARE SIGNING
      # ==================================================

      - name: Prepare signing
        run: |

          mkdir -p "$PROJECT_DIR/.androidaide/signing"

          cp \
            build-input/signing-key.jks \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Keystore copied"

          ls -lh \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"


      # ==================================================
      # CREATE SIGNING PROPERTIES
      # ==================================================

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}

        run: |

          cat > "$PROJECT_DIR/signing.properties" <<EOF
          storeFile=.androidaide/signing/release-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "signing.properties created"


      # ==================================================
      # CHECK SIGNING CONFIGURATION
      # ==================================================

      - name: Check signing configuration
        run: |

          echo "Checking signing configuration..."

          test -f "$PROJECT_DIR/signing.properties"

          test -f \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          test -s \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Signing configuration OK"


      # ==================================================
      # MAKE GRADLE EXECUTABLE
      # ==================================================

      - name: Make Gradle executable
        run: |

          chmod +x "$PROJECT_DIR/gradlew"

          ls -l "$PROJECT_DIR/gradlew"


      # ==================================================
      # CHECK GRADLE VERSION
      # ==================================================

      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          ./gradlew --version


      # ==================================================
      # GRADLE CLEAN
      # ==================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          ./gradlew clean \
            -PsigningPropertiesFile=signing.properties \
            --stacktrace


      # ==================================================
      # APK BUILD
      # ==================================================

      - name: Build Signed APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "BUILDING SIGNED APK"
          echo "========================================"

          ./gradlew \
            :${{ inputs.module }}:assembleRelease \
            -PsigningPropertiesFile=signing.properties \
            --stacktrace \
            --info


      # ==================================================
      # FIND APK
      # ==================================================

      - name: Find APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          APK_DIR="${{ inputs.module }}/build/outputs/apk/release"

          echo "APK directory:"
          echo "$APK_DIR"

          echo ""
          echo "Generated APK files:"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # VERIFY APK
      # ==================================================

      - name: Verify APK
        if: ${{ inputs.build_type == 'APK' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          APK_DIR="${{ inputs.module }}/build/outputs/apk/release"

          APK_COUNT=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ==================================================
      # UPLOAD APK
      #
      # FINAL LOCATION:
      #
      # app/build/outputs/apk/release/app-release.apk
      # ==================================================

      - name: Upload Signed APK
        if: ${{ inputs.build_type == 'APK' }}
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: |
            ${{ env.PROJECT_DIR }}/${{ inputs.module }}/build/outputs/apk/release/*.apk
          if-no-files-found: error


      # ==================================================
      # AAB BUILD
      # ==================================================

      - name: Build Signed AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "BUILDING SIGNED AAB"
          echo "========================================"

          ./gradlew \
            :${{ inputs.module }}:bundleRelease \
            -PsigningPropertiesFile=signing.properties \
            --stacktrace \
            --info


      # ==================================================
      # FIND AAB
      # ==================================================

      - name: Find AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          AAB_DIR="${{ inputs.module }}/build/outputs/bundle/release"

          echo "AAB directory:"
          echo "$AAB_DIR"

          echo ""
          echo "Generated AAB files:"

          find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print


      # ==================================================
      # VERIFY AAB
      # ==================================================

      - name: Verify AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          AAB_DIR="${{ inputs.module }}/build/outputs/bundle/release"

          AAB_COUNT=$(find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            | wc -l)

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          echo "AAB generated successfully"

          find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -exec ls -lh {} \;


      # ==================================================
      # COPY AAB TO APK RELEASE FOLDER
      #
      # ORIGINAL:
      #
      # app/build/outputs/bundle/release/app-release.aab
      #
      # FINAL:
      #
      # app/build/outputs/apk/release/app-release.aab
      # ==================================================

      - name: Copy AAB to APK release folder
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          AAB_DIR="${{ inputs.module }}/build/outputs/bundle/release"

          APK_RELEASE_DIR="${{ inputs.module }}/build/outputs/apk/release"

          AAB_FILE=$(find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print \
            -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found"
            exit 1
          fi

          mkdir -p "$APK_RELEASE_DIR"

          cp \
            "$AAB_FILE" \
            "$APK_RELEASE_DIR/app-release.aab"

          echo ""
          echo "AAB copied successfully"

          echo ""
          echo "Final AAB location:"
          echo "$APK_RELEASE_DIR/app-release.aab"

          echo ""
          ls -lh \
            "$APK_RELEASE_DIR/app-release.aab"


      # ==================================================
      # VERIFY FINAL AAB LOCATION
      # ==================================================

      - name: Verify final AAB
        if: ${{ inputs.build_type == 'AAB' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          FINAL_AAB="${{ inputs.module }}/build/outputs/apk/release/app-release.aab"

          if [ ! -f "$FINAL_AAB" ]; then
            echo "ERROR: Final AAB not found"
            exit 1
          fi

          echo "Final AAB verified:"
          ls -lh "$FINAL_AAB"


      # ==================================================
      # UPLOAD AAB
      #
      # FINAL LOCATION:
      #
      # app/build/outputs/apk/release/app-release.aab
      # ==================================================

      - name: Upload Signed AAB
        if: ${{ inputs.build_type == 'AAB' }}
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: |
            ${{ env.PROJECT_DIR }}/${{ inputs.module }}/build/outputs/apk/release/app-release.aab
          if-no-files-found: error


      # ==================================================
      # FINAL OUTPUT
      # ==================================================

      - name: Show final output
        run: |

          echo ""
          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""

          if [ "${{ inputs.build_type }}" = "APK" ]; then

            APK_PATH="$PROJECT_DIR/${{ inputs.module }}/build/outputs/apk/release/app-release.apk"

            echo "BUILD TYPE: APK"
            echo ""
            echo "FINAL APK:"
            echo "$APK_PATH"

            if [ -f "$APK_PATH" ]; then
              ls -lh "$APK_PATH"
            else
              echo "ERROR: Final APK not found"
              exit 1
            fi

          else

            AAB_PATH="$PROJECT_DIR/${{ inputs.module }}/build/outputs/apk/release/app-release.aab"

            echo "BUILD TYPE: AAB"
            echo ""
            echo "FINAL AAB:"
            echo "$AAB_PATH"

            if [ -f "$AAB_PATH" ]; then
              ls -lh "$AAB_PATH"
            else
              echo "ERROR: Final AAB not found"
              exit 1
            fi

          fi

          echo ""
          echo "========================================"
          echo "DONE"
          echo "========================================"
