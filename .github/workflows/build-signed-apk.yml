name: Android AIDE - Signed APK & AAB Build

on:
  workflow_dispatch:
    inputs:

      module:
        description: "Android module name"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # CREATE BUILD INPUT DIRECTORY
      # ============================================================

      - name: Prepare build input
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |

          set -e

          echo "========================================"
          echo "PREPARE SIGNED BUILD"
          echo "========================================"

          mkdir -p build-input

          echo "Module: $MODULE"

          # --------------------------------------------------------
          # Find keystore supplied by Android AIDE
          # --------------------------------------------------------

          KEYSTORE_FOUND=""

          if [ -f "build-input/signing-key.jks" ]; then
              KEYSTORE_FOUND="build-input/signing-key.jks"
          elif [ -f "signing-key.jks" ]; then
              cp "signing-key.jks" "build-input/signing-key.jks"
              KEYSTORE_FOUND="build-input/signing-key.jks"
          fi

          if [ -z "$KEYSTORE_FOUND" ]; then
              echo ""
              echo "ERROR: signing-key.jks not found"
              echo ""
              echo "Expected:"
              echo "build-input/signing-key.jks"
              exit 1
          fi

          echo "Keystore found:"
          echo "$KEYSTORE_FOUND"

          # --------------------------------------------------------
          # Create signing.properties
          # --------------------------------------------------------

          cat > build-input/signing.properties <<EOF
          storeFile=build-input/signing-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo ""
          echo "Signing properties created."

          chmod 600 build-input/signing-key.jks
          chmod 600 build-input/signing.properties


      # ============================================================
      # DETECT PROJECT ROOT
      # ============================================================

      - name: Detect project root
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          echo "========================================"
          echo "DETECT PROJECT"
          echo "========================================"

          PROJECT_ROOT=""

          # --------------------------------------------------------
          # Normal project
          # --------------------------------------------------------

          if [ -f "settings.gradle" ] || \
             [ -f "settings.gradle.kts" ] || \
             [ -f "gradlew" ]; then

              PROJECT_ROOT="."

          else

              # ----------------------------------------------------
              # Search one/two levels deep for Gradle project
              # ----------------------------------------------------

              FOUND_SETTINGS=$(find . -maxdepth 3 \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                -print -quit)

              if [ -n "$FOUND_SETTINGS" ]; then
                  PROJECT_ROOT=$(dirname "$FOUND_SETTINGS")
              fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
              echo ""
              echo "ERROR: Android Gradle project root not found."
              echo ""
              echo "Searching files..."

              find . -maxdepth 4 -type f \
                \( -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \) \
                -print

              exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # COPY SIGNING FILES INTO PROJECT
      # ============================================================

      - name: Install signing files
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "INSTALL SIGNING FILES"
          echo "========================================"

          cd "$PROJECT_ROOT"

          mkdir -p build-input

          cp "$GITHUB_WORKSPACE/build-input/signing-key.jks" \
             "build-input/signing-key.jks"

          cp "$GITHUB_WORKSPACE/build-input/signing.properties" \
             "signing.properties"

          echo ""
          echo "Signing files installed."

          ls -l build-input/signing-key.jks
          ls -l signing.properties


      # ============================================================
      # FIND MODULE GRADLE FILE
      # ============================================================

      - name: Find module Gradle file
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          echo "========================================"
          echo "FIND MODULE GRADLE FILE"
          echo "========================================"

          cd "$PROJECT_ROOT"

          MODULE_GRADLE=""

          if [ -f "$MODULE/build.gradle" ]; then
              MODULE_GRADLE="$MODULE/build.gradle"

          elif [ -f "$MODULE/build.gradle.kts" ]; then
              MODULE_GRADLE="$MODULE/build.gradle.kts"

          else

              echo "Could not find:"
              echo "$MODULE/build.gradle"
              echo "$MODULE/build.gradle.kts"

              echo ""
              echo "Available Gradle files:"

              find . -maxdepth 5 -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -print

              exit 1
          fi

          echo "Module Gradle:"
          echo "$MODULE_GRADLE"

          echo "MODULE_GRADLE=$MODULE_GRADLE" >> "$GITHUB_ENV"


      # ============================================================
      # INJECT SIGNING CONFIGURATION
      # ============================================================

      - name: Inject release signing
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          echo "========================================"
          echo "INJECT RELEASE SIGNING"
          echo "========================================"

          cd "$PROJECT_ROOT"

          echo ""
          echo "Gradle file:"
          echo "$MODULE_GRADLE"

          # ========================================================
          # GROOVY BUILD.GRADLE
          # ========================================================

          if [[ "$MODULE_GRADLE" == *.gradle ]]; then

              echo ""
              echo "Detected Groovy build.gradle"

              python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("$MODULE_GRADLE")
          text = gradle_file.read_text()

          # --------------------------------------------------------
          # Signing properties loader
          # --------------------------------------------------------

          signing_loader = r'''
          import java.util.Properties

          def signingPropertiesFile = rootProject.file("signing.properties")

          def signingProperties = new Properties()

          if (signingPropertiesFile.exists()) {
              signingPropertiesFile.withInputStream {
                  signingProperties.load(it)
              }
          }
          '''

          # --------------------------------------------------------
          # Add imports/properties only once
          # --------------------------------------------------------

          if "signingPropertiesFile" not in text:
              text = signing_loader + "\n" + text

          # --------------------------------------------------------
          # Signing config
          # --------------------------------------------------------

          signing_block = r'''
              signingConfigs {

                  release {

                      if (signingPropertiesFile.exists()) {

                          storeFile rootProject.file(
                              signingProperties.getProperty("storeFile")
                          )

                          storePassword signingProperties.getProperty(
                              "storePassword"
                          )

                          keyAlias signingProperties.getProperty(
                              "keyAlias"
                          )

                          keyPassword signingProperties.getProperty(
                              "keyPassword"
                          )
                      }
                  }
              }
          '''

          # --------------------------------------------------------
          # Release build type
          # --------------------------------------------------------

          build_type_block = r'''
              buildTypes {

                  release {

                      signingConfig signingConfigs.release

                      minifyEnabled false
                  }
              }
          '''

          # --------------------------------------------------------
          # If signing was already injected, do not duplicate
          # --------------------------------------------------------

          if "signingConfigs" not in text:

              # Find android { and its matching closing brace.
              android_pos = text.find("android")

              if android_pos == -1:
                  raise SystemExit(
                      "ERROR: android { block not found"
                  )

              open_brace = text.find("{", android_pos)

              if open_brace == -1:
                  raise SystemExit(
                      "ERROR: android block opening brace not found"
                  )

              depth = 0
              close_brace = -1

              in_single = False
              in_double = False
              escaped = False

              i = open_brace

              while i < len(text):

                  ch = text[i]

                  if escaped:
                      escaped = False
                      i += 1
                      continue

                  if ch == "\\":
                      escaped = True
                      i += 1
                      continue

                  if not in_double and ch == "'":
                      in_single = not in_single

                  elif not in_single and ch == '"':
                      in_double = not in_double

                  elif not in_single and not in_double:

                      if ch == "{":
                          depth += 1

                      elif ch == "}":
                          depth -= 1

                          if depth == 0:
                              close_brace = i
                              break

                  i += 1

              if close_brace == -1:
                  raise SystemExit(
                      "ERROR: android { block could not be parsed"
                  )

              insertion = "\n" + signing_block + "\n"

              # ----------------------------------------------------
              # Existing buildTypes block?
              # ----------------------------------------------------

              if "buildTypes" not in text[open_brace:close_brace]:

                  insertion += "\n" + build_type_block + "\n"

              else:

                  # Existing buildTypes may already contain release.
                  # Add signingConfig to the existing release block
                  # only when possible.
                  android_part = text[open_brace:close_brace]

                  release_pos = android_part.find(
                      "release"
                  )

                  if release_pos == -1:

                      insertion += "\n" + build_type_block + "\n"

                  else:

                      # If an existing release block exists,
                      # add signingConfig before its closing brace.
                      release_open = android_part.find(
                          "{",
                          release_pos
                      )

                      if release_open == -1:
                          insertion += "\n" + build_type_block + "\n"

                      else:

                          depth2 = 0
                          release_close = -1

                          for j in range(
                              release_open,
                              len(android_part)
                          ):

                              if android_part[j] == "{":
                                  depth2 += 1

                              elif android_part[j] == "}":
                                  depth2 -= 1

                                  if depth2 == 0:
                                      release_close = j
                                      break

                          if release_close == -1:
                              insertion += (
                                  "\n" +
                                  build_type_block +
                                  "\n"
                              )

                          else:

                              absolute_close = (
                                  open_brace +
                                  release_close +
                                  release_open -
                                  release_open
                              )

                              # Calculate correctly using the
                              # android-part offset.
                              absolute_release_close = (
                                  open_brace +
                                  release_close
                              )

                              text = (
                                  text[:absolute_release_close] +
                                  "\n" +
                                  "        signingConfig "
                                  "signingConfigs.release\n" +
                                  "        minifyEnabled false\n" +
                                  text[absolute_release_close:]
                              )

              text = (
                  text[:close_brace] +
                  insertion +
                  text[close_brace:]
              )

          gradle_file.write_text(text)
          print("Groovy signing injection completed.")
          PY

          # ========================================================
          # KOTLIN DSL BUILD.GRADLE.KTS
          # ========================================================

          elif [[ "$MODULE_GRADLE" == *.gradle.kts ]]; then

              echo ""
              echo "Detected Kotlin DSL build.gradle.kts"

              python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("$MODULE_GRADLE")
          text = gradle_file.read_text()

          # --------------------------------------------------------
          # Signing properties loader
          # --------------------------------------------------------

          loader = r'''
          import java.util.Properties
          import java.io.FileInputStream

          val signingPropertiesFile =
              rootProject.file("signing.properties")

          val signingProperties = Properties()

          if (signingPropertiesFile.exists()) {
              FileInputStream(signingPropertiesFile).use {
                  signingProperties.load(it)
              }
          }
          '''

          if "signingPropertiesFile" not in text:
              text = loader + "\n" + text

          # --------------------------------------------------------
          # Kotlin signing configuration
          # --------------------------------------------------------

          signing_block = r'''
              signingConfigs {
                  create("androidAideRelease") {

                      if (signingPropertiesFile.exists()) {

                          storeFile =
                              rootProject.file(
                                  signingProperties.getProperty(
                                      "storeFile"
                                  )
                              )

                          storePassword =
                              signingProperties.getProperty(
                                  "storePassword"
                              )

                          keyAlias =
                              signingProperties.getProperty(
                                  "keyAlias"
                              )

                          keyPassword =
                              signingProperties.getProperty(
                                  "keyPassword"
                              )
                      }
                  }
              }
          '''

          build_type_block = r'''
              buildTypes {
                  getByName("release") {

                      signingConfig =
                          signingConfigs.getByName(
                              "androidAideRelease"
                          )

                      isMinifyEnabled = false
                  }
              }
          '''

          if "androidAideRelease" not in text:

              android_pos = text.find("android")

              if android_pos == -1:
                  raise SystemExit(
                      "ERROR: android { block not found"
                  )

              open_brace = text.find("{", android_pos)

              if open_brace == -1:
                  raise SystemExit(
                      "ERROR: android block opening brace not found"
                  )

              depth = 0
              close_brace = -1

              for i in range(open_brace, len(text)):

                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":

                      depth -= 1

                      if depth == 0:
                          close_brace = i
                          break

              if close_brace == -1:
                  raise SystemExit(
                      "ERROR: android block could not be parsed"
                  )

              insertion = (
                  "\n" +
                  signing_block +
                  "\n" +
                  build_type_block +
                  "\n"
              )

              text = (
                  text[:close_brace] +
                  insertion +
                  text[close_brace:]
              )

          gradle_file.write_text(text)

          print("Kotlin DSL signing injection completed.")
          PY

          else

              echo "ERROR: Unsupported Gradle file:"
              echo "$MODULE_GRADLE"
              exit 1

          fi


      # ============================================================
      # SHOW MODIFIED GRADLE
      # ============================================================

      - name: Show signing configuration
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "MODIFIED BUILD.GRADLE"
          echo "========================================"

          sed -n '1,260p' "$MODULE_GRADLE"

          echo ""
          echo "========================================"
          echo "SIGNING.PROPERTIES"
          echo "========================================"

          # Do NOT print passwords.
          sed \
            -e 's/storePassword=.*/storePassword=***HIDDEN***/' \
            -e 's/keyPassword=.*/keyPassword=***HIDDEN***/' \
            signing.properties


      # ============================================================
      # MAKE GRADLE WRAPPER EXECUTABLE
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "./gradlew" ]; then

              echo "ERROR: gradlew not found."

              find . -maxdepth 3 -type f \
                -name "gradlew" \
                -print

              exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # ============================================================
      # BUILD SIGNED APK + AAB
      # ============================================================

      - name: Build signed APK and AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILD SIGNED APK + AAB"
          echo "========================================"

          echo ""
          echo "Module:"
          echo "$MODULE"

          echo ""
          echo "Running:"

          echo "./gradlew :$MODULE:assembleRelease"
          echo "./gradlew :$MODULE:bundleRelease"

          ./gradlew \
            ":$MODULE:assembleRelease" \
            ":$MODULE:bundleRelease" \
            --stacktrace \
            --no-daemon

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # FIND SIGNED APK
      # ============================================================

      - name: Verify signed APK
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "FIND SIGNED APK"
          echo "========================================"

          APK_PATH="$MODULE/build/outputs/apk/release/app-release.apk"

          echo ""
          echo "Expected APK:"
          echo "$APK_PATH"

          if [ ! -f "$APK_PATH" ]; then

              echo ""
              echo "ERROR: signed APK not found"
              echo ""

              echo "APK directory:"

              if [ -d "$MODULE/build/outputs/apk/release" ]; then
                  find "$MODULE/build/outputs/apk/release" \
                    -maxdepth 3 \
                    -type f \
                    -print
              else
                  echo "APK release directory does not exist."
              fi

              exit 1
          fi

          echo ""
          echo "SIGNED APK FOUND"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # FIND SIGNED AAB
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "FIND SIGNED AAB"
          echo "========================================"

          AAB_PATH="$MODULE/build/outputs/bundle/release/app-release.aab"

          echo ""
          echo "Expected AAB:"
          echo "$AAB_PATH"

          if [ ! -f "$AAB_PATH" ]; then

              echo ""
              echo "ERROR: signed AAB not found"
              echo ""

              echo "Bundle directory:"

              if [ -d "$MODULE/build/outputs/bundle/release" ]; then
                  find "$MODULE/build/outputs/bundle/release" \
                    -maxdepth 3 \
                    -type f \
                    -print
              else
                  echo "Bundle release directory does not exist."
              fi

              exit 1
          fi

          echo ""
          echo "SIGNED AAB FOUND"

          ls -lh "$AAB_PATH"

          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY BOTH OUTPUTS
      # ============================================================

      - name: Final output check
        shell: bash
        run: |

          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "FINAL BUILD OUTPUTS"
          echo "========================================"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "AAB:"
          echo "$AAB_PATH"

          test -f "$APK_PATH"
          test -f "$AAB_PATH"

          echo ""
          echo "APK size:"
          du -h "$APK_PATH"

          echo ""
          echo "AAB size:"
          du -h "$AAB_PATH"

          echo ""
          echo "========================================"
          echo "SIGNED BUILD SUCCESS"
          echo "========================================"


      # ============================================================
      # UPLOAD SIGNED APK
      # ============================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: ${{ env.PROJECT_ROOT }}/${{ env.APK_PATH }}
          if-no-files-found: error


      # ============================================================
      # UPLOAD SIGNED AAB
      # ============================================================

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: ${{ env.PROJECT_ROOT }}/${{ env.AAB_PATH }}
          if-no-files-found: error
