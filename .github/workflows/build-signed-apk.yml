name: Build Android Project

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Android module name"
        required: true
        default: "app"

      store_password:
        description: "Keystore store password"
        required: true

      key_alias:
        description: "Keystore key alias"
        required: true

      key_password:
        description: "Keystore key password"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK root:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          # Try common locations first
          for CANDIDATE in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/14.0/bin/sdkmanager"
          do
            if [ -x "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
              break
            fi
          done

          # Fallback: search entire SDK
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            echo "SDK contents:"
            find "$SDK_ROOT" -maxdepth 4 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/35.0.0"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo "Adding Android tools to PATH..."

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          # Make them available immediately in this step also
          export PATH="$SDKMANAGER_DIR:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$BUILD_TOOLS_DIR:$PATH"

          echo "PATH:"
          echo "$PATH"

          echo "sdkmanager version:"
          "$SDKMANAGER" --version


      # ---------------------------------------------------------
      # INSTALL ANDROID SDK 35
      # ---------------------------------------------------------
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          SDKMANAGER=""

          for CANDIDATE in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/14.0/bin/sdkmanager"
          do
            if [ -x "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed || true


      # ---------------------------------------------------------
      # VERIFY APKSIGNER EXISTS
      # ---------------------------------------------------------
      - name: Verify Android Build Tools
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"

          echo "SDK_ROOT:"
          echo "$SDK_ROOT"

          echo "Expected apksigner:"
          echo "$APKSIGNER"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"

            echo ""
            echo "Available build-tools:"
            find "$SDK_ROOT/build-tools" \
              -maxdepth 2 \
              -type f \
              -name apksigner \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "apksigner version:"
          "$APKSIGNER" version


      # ---------------------------------------------------------
      # EXTRACT PROJECT
      # ---------------------------------------------------------
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q build-input/project.zip -d android-project

          echo "Project extracted."

          echo ""
          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            find android-project -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -n 200


      # ---------------------------------------------------------
      # PREPARE SIGNING KEY
      # ---------------------------------------------------------
      - name: Prepare signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |
          set -e

          SIGNING_DIR="$PROJECT_DIR/.androidaide/signing"

          mkdir -p "$SIGNING_DIR"

          cp build-input/signing-key.jks \
            "$SIGNING_DIR/release-key.jks"

          chmod 600 "$SIGNING_DIR/release-key.jks"

          cat > "$PROJECT_DIR/signing.properties" <<EOF
          storeFile=$SIGNING_DIR/release-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          chmod 600 "$PROJECT_DIR/signing.properties"

          echo "Signing key prepared."


      # ---------------------------------------------------------
      # GRADLE SIGNING INIT SCRIPT
      # ---------------------------------------------------------
      - name: Create signing init script
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -e

          cat > "$PROJECT_DIR/android-aide-signing.init.gradle" <<'EOF'
          import java.util.Properties

          def propsFile = new File(settingsDir, "signing.properties")

          if (!propsFile.exists()) {
              throw new GradleException(
                  "signing.properties not found: " + propsFile.absolutePath
              )
          }

          def props = new Properties()

          propsFile.withInputStream {
              props.load(it)
          }

          gradle.afterProject { project ->

              if (!project.hasProperty("android")) {
                  return
              }

              def android = project.android

              def signingProps = props

              android.signingConfigs {
                  release {
                      storeFile project.file(signingProps.getProperty("storeFile"))
                      storePassword signingProps.getProperty("storePassword")
                      keyAlias signingProps.getProperty("keyAlias")
                      keyPassword signingProps.getProperty("keyPassword")
                  }
              }

              android.buildTypes {
                  release {
                      signingConfig android.signingConfigs.release
                  }
              }
          }
          EOF

          echo "Signing init script created."


      # ---------------------------------------------------------
      # FIND GRADLE WRAPPER
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper:"
          "$PROJECT_DIR/gradlew" --version


      # ---------------------------------------------------------
      # BUILD APK + AAB
      # ---------------------------------------------------------
      - name: Build signed APK and AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building module:"
          echo "$MODULE"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --init-script android-aide-signing.init.gradle \
            clean \
            ":$MODULE:assembleRelease" \
            ":$MODULE:bundleRelease"


      # ---------------------------------------------------------
      # FIND APK + AAB
      # ---------------------------------------------------------
      - name: Locate APK and AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/$MODULE/build/outputs/apk/release/${MODULE}-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find "$PROJECT_DIR/$MODULE/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          AAB_PATH="$PROJECT_DIR/$MODULE/build/outputs/bundle/release/${MODULE}-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            AAB_PATH=$(find "$PROJECT_DIR/$MODULE/build/outputs/bundle/release" \
              -type f \
              -name "*.aab" \
              | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR/$MODULE/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found."
            find "$PROJECT_DIR/$MODULE/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK_PATH"

          echo "AAB:"
          echo "$AAB_PATH"

          ls -lh "$APK_PATH"
          ls -lh "$AAB_PATH"


      # ---------------------------------------------------------
      # VERIFY APK SIGNATURE
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"

          echo "Using:"
          echo "$APKSIGNER"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not executable."
            exit 1
          fi

          echo ""
          echo "Running apksigner..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"


      # ---------------------------------------------------------
      # VERIFY AAB SIGNATURE
      # ---------------------------------------------------------
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          echo "Running jarsigner..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_PATH"


      # ---------------------------------------------------------
      # SHOW OUTPUT INFORMATION
      # ---------------------------------------------------------
      - name: Show final build information
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "AAB:"
          echo "$AAB_PATH"

          echo ""
          echo "APK size:"
          du -h "$APK_PATH"

          echo ""
          echo "AAB size:"
          du -h "$AAB_PATH"


      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ---------------------------------------------------------
      # UPLOAD AAB
      # ---------------------------------------------------------
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
