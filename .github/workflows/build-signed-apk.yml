name: Android AIDE - GitHub Signed Build APK

on:
  workflow_dispatch:
    inputs:

      build_type:
        description: "Build type"
        required: true
        default: "APK"
        type: choice
        options:
          - APK

      module:
        description: "Android module"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string


permissions:
  contents: read
  actions: read


jobs:

  build-signed:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Builder Repository
        uses: actions/checkout@v4


      # ======================================================
      # JAVA 17
      # ======================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # MASK SIGNING VALUES
      # ======================================================

      - name: Protect Signing Values
        shell: bash
        env:
          SIGN_STORE_PASSWORD: ${{ inputs.store_password }}
          SIGN_KEY_ALIAS: ${{ inputs.key_alias }}
          SIGN_KEY_PASSWORD: ${{ inputs.key_password }}
        run: |

          echo "::add-mask::$SIGN_STORE_PASSWORD"
          echo "::add-mask::$SIGN_KEY_ALIAS"
          echo "::add-mask::$SIGN_KEY_PASSWORD"

          echo "SIGN_STORE_PASSWORD=$SIGN_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$SIGN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$SIGN_KEY_PASSWORD"


      # ======================================================
      # CHECK PROJECT ZIP
      # ======================================================

      - name: Check Project ZIP
        shell: bash
        run: |
          set -e

          echo "Checking project ZIP..."

          if [ ! -f "build-input/project.zip" ]; then

            echo "ERROR: build-input/project.zip not found."

            echo ""
            echo "Repository files:"

            find . \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          ls -lh build-input/project.zip

          echo "Project ZIP found."


      # ======================================================
      # CHECK SIGNING KEY
      # ======================================================

      - name: Check Signing Keystore
        shell: bash
        run: |
          set -e

          echo "Checking signing keystore..."

          if [ ! -f "build-input/signing-key.jks" ]; then

            echo "ERROR: build-input/signing-key.jks not found."

            echo ""
            echo "build-input contents:"

            find build-input \
              -maxdepth 3 \
              -type f \
              -print \
              || true

            exit 1
          fi

          ls -lh build-input/signing-key.jks

          echo "Signing keystore found."


      # ======================================================
      # EXTRACT PROJECT
      # ======================================================

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "Extracting Android project..."

          rm -rf android-project

          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo ""
          echo "Extracted files:"

          find android-project \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -500


      # ======================================================
      # DETECT PROJECT ROOT
      # ======================================================

      - name: Detect Android Project Root
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          if [ -f "android-project/settings.gradle" ]; then

            ROOT="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            ROOT="android-project"

          else

            FILE=$(find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$FILE")"
            fi

          fi


          if [ -z "$ROOT" ]; then

            echo "ERROR: Android project root not found."

            echo ""
            echo "Project files:"

            find android-project \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1
          fi


          echo "Android project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" \
            >> "$GITHUB_OUTPUT"


      # ======================================================
      # SHOW PROJECT STRUCTURE
      # ======================================================

      - name: Inspect Android Project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          echo "Project root:"
          echo "$ROOT"

          echo ""
          echo "Project structure:"

          find "$ROOT" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            -print \
            | sort


      # ======================================================
      # CHECK MODULE
      # ======================================================

      - name: Check Android Module
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          MODULE="${{ inputs.module }}"

          echo "Selected module:"
          echo "$MODULE"

          MODULE_DIR="$ROOT/$MODULE"

          if [ ! -d "$MODULE_DIR" ]; then

            echo "ERROR: Module directory not found:"
            echo "$MODULE_DIR"

            echo ""
            echo "Available directories:"

            find "$ROOT" \
              -maxdepth 3 \
              -type d \
              | sort

            exit 1
          fi

          echo "Module directory found:"
          echo "$MODULE_DIR"


      # ======================================================
      # PREPARE GRADLE
      # ======================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"

          cd "$ROOT"

          if [ ! -f "gradlew" ]; then

            echo "ERROR: gradlew not found."

            ls -la

            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # ======================================================
      # PREPARE SIGNING KEY
      # ======================================================

      - name: Prepare Signing Key
        shell: bash
        run: |
          set -e

          SIGN_DIR="$RUNNER_TEMP/android-signing"

          rm -rf "$SIGN_DIR"

          mkdir -p "$SIGN_DIR"

          cp \
            build-input/signing-key.jks \
            "$SIGN_DIR/signing-key.jks"

          chmod 600 \
            "$SIGN_DIR/signing-key.jks"

          echo "SIGNING_KEY=$SIGN_DIR/signing-key.jks" \
            >> "$GITHUB_ENV"

          echo "Signing key prepared."


      # ======================================================
      # VERIFY SIGNING KEY
      # ======================================================

      - name: Verify Signing Keystore
        shell: bash
        run: |
          set -e

          echo "Verifying signing keystore..."

          keytool -list \
            -keystore "$SIGNING_KEY" \
            -storepass "$SIGN_STORE_PASSWORD" \
            -alias "$SIGN_KEY_ALIAS" \
            > /dev/null

          echo "Signing keystore verified successfully."


      # ======================================================
      # CONFIGURE SIGNING
      # ======================================================

      - name: Configure APK Signing
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          MODULE="${{ inputs.module }}"

          cd "$ROOT"


          # --------------------------------------------------
          # APK signing currently requires Groovy build.gradle
          # --------------------------------------------------

          BUILD_FILE="$MODULE/build.gradle"


          if [ ! -f "$BUILD_FILE" ]; then

            echo "ERROR: $BUILD_FILE not found."

            echo ""
            echo "Module files:"

            find "$MODULE" \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi


          # --------------------------------------------------
          # Backup original build.gradle
          # --------------------------------------------------

          cp \
            "$BUILD_FILE" \
            "$BUILD_FILE.github-backup"


          # --------------------------------------------------
          # Add signing configuration only once
          # --------------------------------------------------

          if grep -q "ANDROID_AIDE_GITHUB_SIGNED" "$BUILD_FILE"; then

            echo "GitHub signed configuration already exists."

          else

            cat >> "$BUILD_FILE" <<'EOF'


// ==========================================================
// ANDROID AIDE GITHUB SIGNED BUILD
// ==========================================================

android.signingConfigs.create("githubSigned") {

    storeFile file(
        System.getenv("SIGNING_KEY")
    )

    storePassword System.getenv(
        "SIGN_STORE_PASSWORD"
    )

    keyAlias System.getenv(
        "SIGN_KEY_ALIAS"
    )

    keyPassword System.getenv(
        "SIGN_KEY_PASSWORD"
    )
}


android.buildTypes.debug.signingConfig =
    android.signingConfigs.getByName(
        "githubSigned"
    )


// ANDROID_AIDE_GITHUB_SIGNED
EOF

            echo "GitHub signing configuration added."

          fi


          echo ""
          echo "Signing configuration:"
          echo ""

          tail -50 "$BUILD_FILE"


      # ======================================================
      # BUILD SIGNED APK
      # ======================================================

      - name: Build Signed APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          MODULE="${{ inputs.module }}"

          cd "$ROOT"

          echo "=========================================="
          echo "Building signed APK"
          echo "=========================================="

          echo "Module : $MODULE"
          echo "Build  : Debug"
          echo "Type   : APK"

          echo ""

          ./gradlew \
            ":${MODULE}:assembleDebug" \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ======================================================
      # LOCATE APK
      # ======================================================

      - name: Locate Signed APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.project_root }}"
          MODULE="${{ inputs.module }}"

          APK_DIR="$ROOT/$MODULE/build/outputs/apk"

          echo "Searching APK directory:"
          echo "$APK_DIR"

          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: APK output directory not found."

            echo ""
            echo "Available build outputs:"

            find "$ROOT/$MODULE/build/outputs" \
              -maxdepth 8 \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi


          APK=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

            echo "ERROR: Signed APK not found."

            echo ""
            echo "APK output files:"

            find "$APK_DIR" \
              -type f \
              -print \
              || true

            exit 1
          fi


          echo ""
          echo "Signed APK found:"
          echo "$APK"

          echo ""

          ls -lh "$APK"


          echo "apk_path=$APK" \
            >> "$GITHUB_OUTPUT"


      # ======================================================
      # VERIFY APK SIGNATURE
      # ======================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk_path }}"

          echo "=========================================="
          echo "Verifying APK signature"
          echo "=========================================="

          apksigner verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK signature verification successful."


      # ======================================================
      # SHOW APK INFORMATION
      # ======================================================

      - name: Show APK Information
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk_path }}"

          echo "APK:"
          echo "$APK"

          echo ""

          ls -lh "$APK"

          echo ""

          echo "APK information:"

          apksigner verify \
            --verbose \
            "$APK" \
            2>&1 \
            | grep -E \
              "Verified|Signer|certificate|APK Signature Scheme|SourceStamp" \
            || true


      # ======================================================
      # PREPARE ARTIFACT
      # ======================================================

      - name: Prepare Signed APK Artifact
        shell: bash
        run: |
          set -e

          rm -rf signed-output

          mkdir -p signed-output

          cp \
            "${{ steps.apk.outputs.apk_path }}" \
            signed-output/app-signed.apk

          echo "Signed artifact prepared:"

          ls -lh \
            signed-output/app-signed.apk


      # ======================================================
      # UPLOAD SIGNED APK
      # ======================================================

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: signed-output/app-signed.apk
          if-no-files-found: error
          retention-days: 7


      # ======================================================
      # CLEAN SIGNING FILE
      # ======================================================

      - name: Cleanup Signing Key
        if: always()
        shell: bash
        run: |
          echo "Cleaning temporary signing key..."

          if [ -n "$RUNNER_TEMP" ]; then
            rm -f \
              "$RUNNER_TEMP/android-signing/signing-key.jks" \
              || true
          fi

          echo "Signing key cleanup completed."
