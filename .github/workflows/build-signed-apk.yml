name: Build Signed APK / AAB

on:
  workflow_dispatch:
    inputs:

      module:
        description: "Gradle module"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string


permissions:
  contents: read


jobs:

  build:

    name: Build Signed APK and AAB

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Check Java
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        run: |
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Check Android SDK
        run: |
          echo "========================================"
          echo "CHECK ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""

          echo "Android platform:"
          sdkmanager --list_installed | \
            grep "platforms;android-35" || true

          echo ""

          echo "Build tools:"
          sdkmanager --list_installed | \
            grep "build-tools;35.0.0" || true

          echo ""

          echo "apksigner:"
          command -v apksigner || true

          echo ""

          echo "jarsigner:"
          command -v jarsigner || true


      # ==================================================
      # CHECK BUILD INPUT
      # ==================================================

      - name: Check build input
        run: |
          echo "========================================"
          echo "CHECK BUILD INPUT"
          echo "========================================"

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found"
            exit 1
          fi

          if [ ! -f "build-input/signing-key.jks" ]; then
            echo "ERROR: build-input/signing-key.jks not found"
            exit 1
          fi

          echo "Project ZIP:"
          ls -lh "build-input/project.zip"

          echo ""

          echo "Keystore:"
          ls -lh "build-input/signing-key.jks"


      # ==================================================
      # VALIDATE MODULE
      # ==================================================

      - name: Validate module
        shell: bash
        run: |

          MODULE="${{ inputs.module }}"

          echo "========================================"
          echo "VALIDATE MODULE"
          echo "========================================"

          echo "Module:"
          echo "$MODULE"

          if [ -z "$MODULE" ]; then
            echo "ERROR: module is empty"
            exit 1
          fi

          case "$MODULE" in

            *..*)
              echo "ERROR: invalid module"
              exit 1
              ;;

            */*)
              echo "ERROR: invalid module"
              exit 1
              ;;

            *\\*)
              echo "ERROR: invalid module"
              exit 1
              ;;

            *:*)
              echo "ERROR: invalid module"
              exit 1
              ;;

          esac


      # ==================================================
      # EXTRACT PROJECT
      # ==================================================

      - name: Extract project
        run: |
          echo "========================================"
          echo "EXTRACT PROJECT"
          echo "========================================"

          rm -rf android-project

          mkdir -p android-project

          unzip -q \
            "build-input/project.zip" \
            -d android-project

          echo "Project extracted successfully."

          echo ""

          echo "Project files:"

          find android-project \
            -maxdepth 4 \
            -type f \
            -print | head -300


      # ==================================================
      # DETECT PROJECT DIRECTORY
      # ==================================================

      - name: Detect project directory
        shell: bash
        run: |

          echo "========================================"
          echo "DETECT PROJECT DIRECTORY"
          echo "========================================"

          if [ -f "android-project/settings.gradle" ]; then

            PROJECT_DIR="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_DIR="android-project"

          else

            FOUND=$(find android-project \
              -maxdepth 8 \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit)

            if [ -z "$FOUND" ]; then

              echo "ERROR: settings.gradle or settings.gradle.kts not found."

              echo ""

              echo "Searching project:"

              find android-project \
                -maxdepth 8 \
                -type f \
                -print | head -500

              exit 1

            fi

            PROJECT_DIR=$(dirname "$FOUND")

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"


      # ==================================================
      # SHOW PROJECT
      # ==================================================

      - name: Show project
        run: |

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""

          ls -la "$PROJECT_DIR"

          echo ""

          echo "Gradle files:"

          find "$PROJECT_DIR" \
            -maxdepth 5 \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradlew" \
              -o \
              -name "gradlew.bat" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "gradle-wrapper.jar" \
            \) \
            -print


      # ==================================================
      # CHECK GRADLE WRAPPER
      # ==================================================

      - name: Check Gradle wrapper
        run: |

          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then

            echo "ERROR: gradlew not found"

            exit 1

          fi

          if [ ! -f \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          ]; then

            echo "ERROR: gradle-wrapper.properties not found"

            exit 1

          fi

          if [ ! -f \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          ]; then

            echo "ERROR: gradle-wrapper.jar not found"

            echo ""

            echo "Gradle wrapper directory:"

            ls -la \
              "$PROJECT_DIR/gradle/wrapper" || true

            exit 1

          fi

          echo "gradlew: OK"
          echo "gradle-wrapper.properties: OK"
          echo "gradle-wrapper.jar: OK"

          echo ""

          echo "Wrapper properties:"

          cat \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"


      # ==================================================
      # FIND MODULE GRADLE FILE
      # ==================================================

      - name: Find module Gradle file
        shell: bash
        run: |

          MODULE="${{ inputs.module }}"

          echo "========================================"
          echo "FIND MODULE GRADLE FILE"
          echo "========================================"

          BUILD_FILE="$PROJECT_DIR/$MODULE/build.gradle"

          BUILD_KTS_FILE="$PROJECT_DIR/$MODULE/build.gradle.kts"

          if [ -f "$BUILD_FILE" ]; then

            echo "Gradle file:"
            echo "$BUILD_FILE"

            echo "SIGNING_BUILD_FILE=$BUILD_FILE" \
              >> "$GITHUB_ENV"

            echo "SIGNING_BUILD_TYPE=groovy" \
              >> "$GITHUB_ENV"

          elif [ -f "$BUILD_KTS_FILE" ]; then

            echo "Gradle Kotlin file:"
            echo "$BUILD_KTS_FILE"

            echo "SIGNING_BUILD_FILE=$BUILD_KTS_FILE" \
              >> "$GITHUB_ENV"

            echo "SIGNING_BUILD_TYPE=kotlin" \
              >> "$GITHUB_ENV"

          else

            echo "ERROR: module Gradle file not found."

            echo ""

            echo "Expected:"

            echo "$BUILD_FILE"
            echo "$BUILD_KTS_FILE"

            exit 1

          fi


      # ==================================================
      # PREPARE SIGNING KEYSTORE
      # ==================================================

      - name: Prepare signing
        run: |

          echo "========================================"
          echo "PREPARE SIGNING"
          echo "========================================"

          mkdir -p \
            "$PROJECT_DIR/.androidaide/signing"

          cp \
            "build-input/signing-key.jks" \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          chmod 600 \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Signing keystore prepared."

          ls -lh \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"


      # ==================================================
      # CREATE SIGNING PROPERTIES
      # ==================================================

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}

        run: |

          echo "========================================"
          echo "CREATE SIGNING PROPERTIES"
          echo "========================================"

          printf '%s\n' \
            "storeFile=.androidaide/signing/release-key.jks" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > "$PROJECT_DIR/signing.properties"

          chmod 600 \
            "$PROJECT_DIR/signing.properties"

          echo "signing.properties created."


      # ==================================================
      # VERIFY KEYSTORE
      # ==================================================

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}

        run: |

          echo "========================================"
          echo "VERIFY KEYSTORE"
          echo "========================================"

          if [ ! -s \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"
          ]; then

            echo "ERROR: keystore missing or empty"

            exit 1

          fi

          keytool \
            -list \
            -keystore \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks" \
            -storepass "$STORE_PASSWORD" \
            > /dev/null

          echo "Keystore is valid."


      # ==================================================
      # CREATE TEMPORARY GRADLE SIGNING INIT SCRIPT
      # ==================================================

      - name: Create temporary signing init script
        run: |

          echo "========================================"
          echo "CREATE TEMPORARY GRADLE SIGNING SCRIPT"
          echo "========================================"

          cat > \
            "$PROJECT_DIR/android-aide-signing.init.gradle" <<'EOF'

          allprojects {

              afterEvaluate { project ->

                  if (project.hasProperty("android")) {

                      def signingFile =
                          project.rootProject.file(
                              "signing.properties"
                          )

                      if (signingFile.exists()) {

                          def props =
                              new java.util.Properties()

                          signingFile.withInputStream {

                              props.load(it)

                          }

                          project.android.signingConfigs {

                              androidAideRelease {

                                  storeFile =
                                      project.rootProject.file(
                                          props.getProperty(
                                              "storeFile"
                                          )
                                      )

                                  storePassword =
                                      props.getProperty(
                                          "storePassword"
                                      )

                                  keyAlias =
                                      props.getProperty(
                                          "keyAlias"
                                      )

                                  keyPassword =
                                      props.getProperty(
                                          "keyPassword"
                                      )
                              }
                          }

                          project.android.buildTypes {

                              release {

                                  signingConfig =
                                      project.android
                                          .signingConfigs
                                          .androidAideRelease

                                  minifyEnabled false
                              }
                          }
                      }
                  }
              }
          }

          EOF

          chmod 600 \
            "$PROJECT_DIR/android-aide-signing.init.gradle"

          echo "Temporary signing init script created."

          echo ""

          ls -lh \
            "$PROJECT_DIR/android-aide-signing.init.gradle"


      # ==================================================
      # VERIFY SIGNING FILES
      # ==================================================

      - name: Verify signing files
        shell: bash
        run: |

          echo "========================================"
          echo "VERIFY SIGNING FILES"
          echo "========================================"

          if [ ! -f "$PROJECT_DIR/signing.properties" ]; then

            echo "ERROR: signing.properties not found"

            exit 1

          fi

          if [ ! -s \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"
          ]; then

            echo "ERROR: keystore missing"

            exit 1

          fi

          if [ ! -s \
            "$PROJECT_DIR/android-aide-signing.init.gradle"
          ]; then

            echo "ERROR: signing init script missing"

            exit 1

          fi

          echo "Signing files exist."

          echo ""

          echo "Signing properties keys:"

          grep -E \
            '^(storeFile|storePassword|keyAlias|keyPassword)=' \
            "$PROJECT_DIR/signing.properties" \
            | sed \
              's/storePassword=.*/storePassword=********/; s/keyPassword=.*/keyPassword=********/'

          echo ""

          echo "Keystore:"

          ls -lh \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo ""

          echo "Init script:"

          ls -lh \
            "$PROJECT_DIR/android-aide-signing.init.gradle"


      # ==================================================
      # MAKE GRADLE EXECUTABLE
      # ==================================================

      - name: Make Gradle executable
        run: |

          echo "========================================"
          echo "MAKE GRADLE EXECUTABLE"
          echo "========================================"

          chmod +x \
            "$PROJECT_DIR/gradlew"

          ls -lh \
            "$PROJECT_DIR/gradlew"


      # ==================================================
      # GRADLE VERSION
      # ==================================================

      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version


      # ==================================================
      # GRADLE CLEAN
      # ==================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "GRADLE CLEAN"
          echo "========================================"

          ./gradlew clean \
            --stacktrace


      # ==================================================
      # BUILD SIGNED APK + AAB
      # ==================================================

      - name: Build Signed APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MODULE: ${{ inputs.module }}

        run: |

          echo "========================================"
          echo "BUILD SIGNED APK + AAB"
          echo "========================================"

          echo ""

          echo "Module:"
          echo "$MODULE"

          echo ""

          ./gradlew \
            ":${MODULE}:assembleRelease" \
            ":${MODULE}:bundleRelease" \
            --init-script android-aide-signing.init.gradle \
            --stacktrace \
            --info


      # ==================================================
      # SHOW BUILD OUTPUTS
      # ==================================================

      - name: Show build outputs
        working-directory: ${{ env.PROJECT_DIR }}
        if: always()
        run: |

          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""

          echo "APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -print || true

          echo ""

          echo "AAB files:"

          find . \
            -type f \
            -name "*.aab" \
            -print || true


      # ==================================================
      # FIND SIGNED APK
      # ==================================================

      - name: Find signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "FIND SIGNED APK"
          echo "========================================"

          APK_DIR="${{ inputs.module }}/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: APK release directory not found"

            echo ""

            echo "All APK files:"

            find . \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo "APK files:"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          APK_PATH=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -not -name "*-unsigned.apk" \
            -print \
            -quit)

          if [ -z "$APK_PATH" ]; then

            echo ""

            echo "ERROR: SIGNED APK NOT FOUND."

            echo ""

            echo "Files found:"

            find "$APK_DIR" \
              -type f \
              -print || true

            exit 1

          fi

          echo ""

          echo "========================================"
          echo "SIGNED APK FOUND"
          echo "========================================"

          echo "$APK_PATH"

          echo ""

          ls -lh "$APK_PATH"

          echo ""

          echo "APK_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/$APK_PATH" \
            >> "$GITHUB_ENV"


      # ==================================================
      # FIND SIGNED AAB
      # ==================================================

      - name: Find signed AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "FIND SIGNED AAB"
          echo "========================================"

          AAB_DIR="${{ inputs.module }}/build/outputs/bundle/release"

          if [ ! -d "$AAB_DIR" ]; then

            echo "ERROR: AAB release directory not found"

            echo ""

            echo "All AAB files:"

            find . \
              -type f \
              -name "*.aab" \
              -print || true

            exit 1

          fi

          echo "AAB files:"

          find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print || true

          AAB_PATH=$(find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print \
            -quit)

          if [ -z "$AAB_PATH" ]; then

            echo ""

            echo "ERROR: SIGNED AAB NOT FOUND."

            echo ""

            echo "Files found:"

            find "$AAB_DIR" \
              -type f \
              -print || true

            exit 1

          fi

          echo ""

          echo "========================================"
          echo "SIGNED AAB FOUND"
          echo "========================================"

          echo "$AAB_PATH"

          echo ""

          ls -lh "$AAB_PATH"

          echo ""

          echo "AAB_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/$AAB_PATH" \
            >> "$GITHUB_ENV"


      # ==================================================
      # VERIFY APK FILE
      # ==================================================

      - name: Verify APK file
        run: |

          echo "========================================"
          echo "VERIFY APK FILE"
          echo "========================================"

          if [ ! -f "$APK_PATH" ]; then

            echo "ERROR: APK does not exist"

            exit 1

          fi

          if [ ! -s "$APK_PATH" ]; then

            echo "ERROR: APK is empty"

            exit 1

          fi

          echo "APK exists:"
          ls -lh "$APK_PATH"


      # ==================================================
      # VERIFY APK SIGNATURE
      # ==================================================

      - name: Verify APK signature
        run: |

          echo "========================================"
          echo "VERIFY APK SIGNATURE"
          echo "========================================"

          if [ ! -f "$APK_PATH" ]; then

            echo "ERROR: APK does not exist"

            exit 1

          fi

          echo ""

          echo "APK:"
          echo "$APK_PATH"

          echo ""

          echo "Running apksigner..."

          if ! apksigner verify \
            --verbose \
            "$APK_PATH" \
            > apk-signature.txt 2>&1; then

            echo ""
            echo "========================================"
            echo "APK SIGNATURE VERIFICATION FAILED"
            echo "========================================"

            echo ""

            cat apk-signature.txt

            exit 1

          fi

          echo ""

          cat apk-signature.txt

          echo ""

          if ! grep -q \
            "Verified using v1 scheme" \
            apk-signature.txt && \
             ! grep -q \
            "Verified using v2 scheme" \
            apk-signature.txt && \
             ! grep -q \
            "Verified using v3 scheme" \
            apk-signature.txt && \
             ! grep -q \
            "Verified using v4 scheme" \
            apk-signature.txt; then

            echo ""
            echo "ERROR: APK signing scheme was not detected."

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "APK SIGNATURE VERIFIED"
          echo "========================================"


      # ==================================================
      # VERIFY AAB FILE
      # ==================================================

      - name: Verify AAB file
        run: |

          echo "========================================"
          echo "VERIFY AAB FILE"
          echo "========================================"

          if [ ! -f "$AAB_PATH" ]; then

            echo "ERROR: AAB does not exist"

            exit 1

          fi

          if [ ! -s "$AAB_PATH" ]; then

            echo "ERROR: AAB is empty"

            exit 1

          fi

          echo "AAB exists:"
          ls -lh "$AAB_PATH"


      # ==================================================
      # VERIFY AAB SIGNATURE
      # ==================================================

      - name: Verify AAB signature
        run: |

          echo "========================================"
          echo "VERIFY AAB SIGNATURE"
          echo "========================================"

          if [ ! -f "$AAB_PATH" ]; then

            echo "ERROR: AAB does not exist"

            exit 1

          fi

          echo ""

          echo "AAB:"
          echo "$AAB_PATH"

          echo ""

          echo "Running jarsigner..."

          if ! jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_PATH" \
            > aab-signature.txt 2>&1; then

            echo ""
            echo "========================================"
            echo "AAB SIGNATURE VERIFICATION FAILED"
            echo "========================================"

            echo ""

            cat aab-signature.txt

            exit 1

          fi

          echo ""

          cat aab-signature.txt

          echo ""

          if ! grep -qi \
            "jar verified" \
            aab-signature.txt; then

            echo ""
            echo "ERROR: AAB is not properly signed."

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "AAB SIGNATURE VERIFIED"
          echo "========================================"

          echo ""

          echo "Certificate information:"

          grep -E \
            "X.509|CN=|SHA256|SHA-256|jar verified" \
            aab-signature.txt || true


      # ==================================================
      # UPLOAD SIGNED APK
      # ==================================================

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ==================================================
      # UPLOAD SIGNED AAB
      # ==================================================

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error


      # ==================================================
      # FINAL OUTPUT
      # ==================================================

      - name: Final output
        run: |

          echo ""
          echo "========================================"
          echo "SIGNED BUILD COMPLETED"
          echo "========================================"

          echo ""

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""

          echo "Module:"
          echo "${{ inputs.module }}"

          echo ""

          echo "SIGNED APK:"
          echo "$APK_PATH"

          echo ""

          ls -lh "$APK_PATH"

          echo ""

          echo "SIGNED AAB:"
          echo "$AAB_PATH"

          echo ""

          ls -lh "$AAB_PATH"

          echo ""

          echo "========================================"
          echo "APK SIGNATURE: VERIFIED"
          echo "AAB SIGNATURE: VERIFIED"
          echo "========================================"

          echo ""

          echo "APK + AAB BUILD SUCCESSFUL"

          echo "========================================"
