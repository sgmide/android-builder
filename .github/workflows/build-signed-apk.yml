name: Build Signed APK / AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select build type"
        required: true
        default: "APK"
        type: choice
        options:
          - APK
          - AAB

jobs:
  build:
    name: Build ${{ inputs.build_type }}
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout project
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Java 8
      # Old Android Gradle Plugin compatibility
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'


      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # Install required SDK
      # compileSdkVersion 27
      # --------------------------------------------------
      - name: Install Android SDK 27
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-27" "build-tools;27.1.1"


      # --------------------------------------------------
      # Create signing directory
      # --------------------------------------------------
      - name: Prepare signing
        run: |
          mkdir -p .androidaide/signing


      # --------------------------------------------------
      # Decode JKS from GitHub Secret
      # --------------------------------------------------
      - name: Create keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDAIDE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > .androidaide/signing/release-key.jks


      # --------------------------------------------------
      # Create signing properties
      # --------------------------------------------------
      - name: Create signing properties
        run: |
          cat > signing.properties <<EOF
          storeFile=.androidaide/signing/release-key.jks
          storePassword=${{ secrets.ANDROIDAIDE_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROIDAIDE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROIDAIDE_KEY_PASSWORD }}
          EOF


      # --------------------------------------------------
      # Make Gradle executable
      # --------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build Signed APK
        if: ${{ inputs.build_type == 'APK' }}
        run: |
          ./gradlew assembleRelease \
            -PsigningPropertiesFile=signing.properties


      # --------------------------------------------------
      # Build AAB
      # --------------------------------------------------
      - name: Build Signed AAB
        if: ${{ inputs.build_type == 'AAB' }}
        run: |
          ./gradlew bundleRelease \
            -PsigningPropertiesFile=signing.properties


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        if: ${{ inputs.build_type == 'APK' }}
        uses: actions/upload-artifact@v4
        with:
          name: androidaide-signed-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error


      # --------------------------------------------------
      # Upload AAB
      # --------------------------------------------------
      - name: Upload AAB
        if: ${{ inputs.build_type == 'AAB' }}
        uses: actions/upload-artifact@v4
        with:
          name: androidaide-signed-aab
          path: |
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
