name: Build Signed APK / AAB

on:
  workflow_dispatch:
    inputs:

      module:
        description: "Gradle module"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string


permissions:
  contents: read


jobs:

  build:

    name: Build Signed APK and AAB

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Check Java
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        run: |
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==================================================
      # CHECK BUILD INPUT
      # ==================================================

      - name: Check build input
        shell: bash
        run: |

          echo "========================================"
          echo "CHECK BUILD INPUT"
          echo "========================================"

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found"
            exit 1
          fi

          if [ ! -s "build-input/project.zip" ]; then
            echo "ERROR: project.zip is empty"
            exit 1
          fi

          if [ ! -f "build-input/signing-key.jks" ]; then
            echo "ERROR: build-input/signing-key.jks not found"
            exit 1
          fi

          if [ ! -s "build-input/signing-key.jks" ]; then
            echo "ERROR: signing-key.jks is empty"
            exit 1
          fi

          echo "Project ZIP:"
          ls -lh build-input/project.zip

          echo ""

          echo "Keystore:"
          ls -lh build-input/signing-key.jks


      # ==================================================
      # VALIDATE MODULE
      # ==================================================

      - name: Validate module
        shell: bash
        run: |

          MODULE="${{ inputs.module }}"

          echo "========================================"
          echo "VALIDATE MODULE"
          echo "========================================"

          echo "Module:"
          echo "$MODULE"

          if [ -z "$MODULE" ]; then
            echo "ERROR: module is empty"
            exit 1
          fi

          case "$MODULE" in

            *..*)
              echo "ERROR: invalid module"
              exit 1
              ;;

            */*)
              echo "ERROR: invalid module"
              exit 1
              ;;

            *\\*)
              echo "ERROR: invalid module"
              exit 1
              ;;

            *:*)
              echo "ERROR: invalid module"
              exit 1
              ;;

          esac


      # ==================================================
      # EXTRACT PROJECT
      # ==================================================

      - name: Extract project
        shell: bash
        run: |

          echo "========================================"
          echo "EXTRACT PROJECT"
          echo "========================================"

          rm -rf android-project

          mkdir -p android-project

          unzip -q \
            build-input/project.zip \
            -d android-project

          echo "Project extracted successfully."

          echo ""

          find android-project \
            -maxdepth 5 \
            -type f \
            -print | head -500


      # ==================================================
      # DETECT PROJECT DIRECTORY
      # ==================================================

      - name: Detect project directory
        shell: bash
        run: |

          echo "========================================"
          echo "DETECT PROJECT DIRECTORY"
          echo "========================================"

          if [ -f "android-project/settings.gradle" ]; then

            PROJECT_DIR="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_DIR="android-project"

          else

            FOUND=$(find android-project \
              -maxdepth 8 \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -type f \
              -print -quit)

            if [ -z "$FOUND" ]; then

              echo "ERROR: settings.gradle not found"

              find android-project \
                -maxdepth 8 \
                -type f \
                -print | head -500

              exit 1

            fi

            PROJECT_DIR=$(dirname "$FOUND")

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"


      # ==================================================
      # CHECK GRADLE WRAPPER
      # ==================================================

      - name: Check Gradle wrapper
        shell: bash
        run: |

          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found"

            ls -la "$PROJECT_DIR/gradle/wrapper" || true

            exit 1
          fi

          echo "Gradle wrapper OK."


      # ==================================================
      # FIND MODULE GRADLE FILE
      # ==================================================

      - name: Find module Gradle file
        shell: bash
        run: |

          MODULE="${{ inputs.module }}"

          echo "========================================"
          echo "FIND MODULE GRADLE FILE"
          echo "========================================"

          BUILD_FILE="$PROJECT_DIR/$MODULE/build.gradle"

          BUILD_KTS_FILE="$PROJECT_DIR/$MODULE/build.gradle.kts"

          if [ -f "$BUILD_FILE" ]; then

            echo "Using:"
            echo "$BUILD_FILE"

            echo "SIGNING_BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"

            echo "SIGNING_BUILD_TYPE=groovy" >> "$GITHUB_ENV"

          elif [ -f "$BUILD_KTS_FILE" ]; then

            echo "Using:"
            echo "$BUILD_KTS_FILE"

            echo "SIGNING_BUILD_FILE=$BUILD_KTS_FILE" >> "$GITHUB_ENV"

            echo "SIGNING_BUILD_TYPE=kotlin" >> "$GITHUB_ENV"

          else

            echo "ERROR: module Gradle file not found."

            echo "$BUILD_FILE"
            echo "$BUILD_KTS_FILE"

            exit 1

          fi


      # ==================================================
      # PREPARE KEYSTORE
      # ==================================================

      - name: Prepare signing keystore
        shell: bash
        run: |

          echo "========================================"
          echo "PREPARE KEYSTORE"
          echo "========================================"

          mkdir -p \
            "$PROJECT_DIR/.androidaide/signing"

          cp \
            build-input/signing-key.jks \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          chmod 600 \
            "$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Keystore prepared."


      # ==================================================
      # CREATE SIGNING PROPERTIES
      # ==================================================

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}

        shell: bash
        run: |

          echo "========================================"
          echo "CREATE SIGNING PROPERTIES"
          echo "========================================"

          python3 - "$PROJECT_DIR" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" <<'PY'

          import sys
          from pathlib import Path

          project_dir = Path(sys.argv[1])

          store_password = sys.argv[2]
          key_alias = sys.argv[3]
          key_password = sys.argv[4]


          def escape(value):

              value = str(value)

              value = value.replace("\\", "\\\\")
              value = value.replace("\n", "\\n")
              value = value.replace("\r", "\\r")
              value = value.replace("=", "\\=")
              value = value.replace(":", "\\:")
              value = value.replace("#", "\\#")
              value = value.replace("!", "\\!")

              return value


          properties_file = project_dir / "signing.properties"


          content = (
              "storeFile=.androidaide/signing/release-key.jks\n"
              "storePassword=" + escape(store_password) + "\n"
              "keyAlias=" + escape(key_alias) + "\n"
              "keyPassword=" + escape(key_password) + "\n"
          )


          properties_file.write_text(
              content,
              encoding="utf-8"
          )

          print("signing.properties created.")

          PY

          chmod 600 \
            "$PROJECT_DIR/signing.properties"


      # ==================================================
      # VERIFY KEYSTORE
      # ==================================================

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}

        shell: bash
        run: |

          echo "========================================"
          echo "VERIFY KEYSTORE"
          echo "========================================"

          KEYSTORE="$PROJECT_DIR/.androidaide/signing/release-key.jks"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: keystore missing"
            exit 1
          fi

          if ! keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            > /dev/null 2>&1; then

            echo "ERROR: invalid keystore or password"
            exit 1

          fi

          echo "Keystore is valid."


      # ==================================================
      # INJECT SIGNING
      # ==================================================

      - name: Inject automatic release signing
        shell: bash
        run: |

          echo "========================================"
          echo "AUTOMATIC SIGNING"
          echo "========================================"

          python3 - "$SIGNING_BUILD_FILE" "$SIGNING_BUILD_TYPE" <<'PY'

          import sys

          path = sys.argv[1]
          gradle_type = sys.argv[2]


          with open(path, "r", encoding="utf-8") as f:
              text = f.read()


          marker = "ANDROID_AIDE_AUTO_SIGNING_BEGIN"


          if marker in text:

              print("Signing configuration already exists.")

              sys.exit(0)


          if gradle_type == "groovy":

              signing_code = r'''

          // ANDROID_AIDE_AUTO_SIGNING_BEGIN

          def androidAideSigningFile =
                  rootProject.file("signing.properties")

          if (!androidAideSigningFile.exists()) {

              throw new GradleException(
                      "Android AIDE signing.properties not found."
              )
          }

          def androidAideSigningProperties =
                  new java.util.Properties()

          androidAideSigningFile.withInputStream {

              androidAideSigningProperties.load(it)

          }

          def androidAideStoreFile =
                  androidAideSigningProperties.getProperty(
                          "storeFile"
                  )

          def androidAideStorePassword =
                  androidAideSigningProperties.getProperty(
                          "storePassword"
                  )

          def androidAideKeyAlias =
                  androidAideSigningProperties.getProperty(
                          "keyAlias"
                  )

          def androidAideKeyPassword =
                  androidAideSigningProperties.getProperty(
                          "keyPassword"
                  )


          android {

              signingConfigs {

                  androidAideRelease {

                      storeFile rootProject.file(
                              androidAideStoreFile
                      )

                      storePassword =
                              androidAideStorePassword

                      keyAlias =
                              androidAideKeyAlias

                      keyPassword =
                              androidAideKeyPassword
                  }
              }

              buildTypes {

                  release {

                      signingConfig =
                              signingConfigs.androidAideRelease
                  }
              }
          }

          // ANDROID_AIDE_AUTO_SIGNING_END

          '''


          elif gradle_type == "kotlin":

              signing_code = r'''

          // ANDROID_AIDE_AUTO_SIGNING_BEGIN

          val androidAideSigningFile =
              rootProject.file("signing.properties")

          if (!androidAideSigningFile.exists()) {

              throw GradleException(
                  "Android AIDE signing.properties not found."
              )
          }

          val androidAideSigningProperties =
              java.util.Properties()

          androidAideSigningFile.inputStream().use {

              androidAideSigningProperties.load(it)

          }

          val androidAideStoreFile =
              androidAideSigningProperties.getProperty(
                  "storeFile"
              )

          val androidAideStorePassword =
              androidAideSigningProperties.getProperty(
                  "storePassword"
              )

          val androidAideKeyAlias =
              androidAideSigningProperties.getProperty(
                  "keyAlias"
              )

          val androidAideKeyPassword =
              androidAideSigningProperties.getProperty(
                  "keyPassword"
              )


          android {

              signingConfigs {

                  create("androidAideRelease") {

                      storeFile =
                          rootProject.file(
                              androidAideStoreFile
                          )

                      storePassword =
                          androidAideStorePassword

                      keyAlias =
                          androidAideKeyAlias

                      keyPassword =
                          androidAideKeyPassword
                  }
              }

              buildTypes {

                  getByName("release") {

                      signingConfig =
                          signingConfigs.getByName(
                              "androidAideRelease"
                          )
                  }
              }
          }

          // ANDROID_AIDE_AUTO_SIGNING_END

          '''

          else:

              print("ERROR: unsupported Gradle type")
              sys.exit(1)


          with open(path, "a", encoding="utf-8") as f:

              f.write(signing_code)


          print("Automatic signing injected successfully.")

          PY


      # ==================================================
      # VERIFY INJECTION
      # ==================================================

      - name: Verify signing injection
        shell: bash
        run: |

          echo "========================================"
          echo "VERIFY SIGNING"
          echo "========================================"

          if ! grep -q \
            "ANDROID_AIDE_AUTO_SIGNING_BEGIN" \
            "$SIGNING_BUILD_FILE"; then

            echo "ERROR: signing injection failed"
            exit 1

          fi

          if ! grep -q \
            "ANDROID_AIDE_AUTO_SIGNING_END" \
            "$SIGNING_BUILD_FILE"; then

            echo "ERROR: signing injection incomplete"
            exit 1

          fi

          if ! grep -q \
            "signingConfig" \
            "$SIGNING_BUILD_FILE"; then

            echo "ERROR: signingConfig not found"
            exit 1

          fi

          echo "Signing configuration verified."


      # ==================================================
      # MAKE GRADLE EXECUTABLE
      # ==================================================

      - name: Make Gradle executable
        shell: bash
        run: |

          chmod +x "$PROJECT_DIR/gradlew"

          echo "gradlew executable."


      # ==================================================
      # GRADLE VERSION
      # ==================================================

      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version


      # ==================================================
      # GRADLE CLEAN
      # ==================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "========================================"
          echo "GRADLE CLEAN"
          echo "========================================"

          ./gradlew \
            clean \
            --stacktrace \
            --no-daemon


      # ==================================================
      # BUILD APK + AAB
      # ==================================================

      - name: Build Signed APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MODULE: ${{ inputs.module }}

        shell: bash
        run: |

          echo "========================================"
          echo "BUILD SIGNED APK + AAB"
          echo "========================================"

          echo "Module:"
          echo "$MODULE"

          ./gradlew \
            ":${MODULE}:assembleRelease" \
            ":${MODULE}:bundleRelease" \
            --stacktrace \
            --no-daemon \
            --info


      # ==================================================
      # SHOW OUTPUTS
      # ==================================================

      - name: Show build outputs
        working-directory: ${{ env.PROJECT_DIR }}
        if: always()
        shell: bash
        run: |

          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""

          echo "APK:"
          find . \
            -type f \
            -name "*.apk" \
            -print || true

          echo ""

          echo "AAB:"
          find . \
            -type f \
            -name "*.aab" \
            -print || true


      # ==================================================
      # FIND APK
      # ==================================================

      - name: Find signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "========================================"
          echo "FIND SIGNED APK"
          echo "========================================"

          APK_DIR="${{ inputs.module }}/build/outputs/apk/release"


          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: APK directory not found"

            find . \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi


          APK_PATH=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            ! -name "*-unsigned.apk" \
            -print \
            -quit)


          if [ -z "$APK_PATH" ]; then

            echo "ERROR: signed APK not found"

            find "$APK_DIR" \
              -type f \
              -print || true

            exit 1

          fi


          echo "Signed APK:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"


          echo "APK_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/$APK_PATH" \
            >> "$GITHUB_ENV"


      # ==================================================
      # FIND AAB
      # ==================================================

      - name: Find signed AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "========================================"
          echo "FIND SIGNED AAB"
          echo "========================================"

          AAB_DIR="${{ inputs.module }}/build/outputs/bundle/release"


          if [ ! -d "$AAB_DIR" ]; then

            echo "ERROR: AAB directory not found"

            find . \
              -type f \
              -name "*.aab" \
              -print || true

            exit 1

          fi


          AAB_PATH=$(find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print \
            -quit)


          if [ -z "$AAB_PATH" ]; then

            echo "ERROR: signed AAB not found"

            find "$AAB_DIR" \
              -type f \
              -print || true

            exit 1

          fi


          echo "Signed AAB:"
          echo "$AAB_PATH"

          ls -lh "$AAB_PATH"


          echo "AAB_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/$AAB_PATH" \
            >> "$GITHUB_ENV"


      # ==================================================
      # VERIFY APK SIGNATURE
      # ==================================================

      - name: Verify APK signature
        shell: bash
        run: |

          echo "========================================"
          echo "VERIFY APK SIGNATURE"
          echo "========================================"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "APK signature verified."


      # ==================================================
      # VERIFY AAB SIGNATURE
      # ==================================================

      - name: Verify AAB signature
        shell: bash
        run: |

          echo "========================================"
          echo "VERIFY AAB SIGNATURE"
          echo "========================================"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found"
            exit 1
          fi

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_PATH"

          echo ""
          echo "AAB signature verified."


      # ==================================================
      # UPLOAD APK
      # ==================================================

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7


      # ==================================================
      # UPLOAD AAB
      # ==================================================

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 7


      # ==================================================
      # FINAL OUTPUT
      # ==================================================

      - name: Final output
        shell: bash
        run: |

          echo ""
          echo "========================================"
          echo "ANDROID AIDE SIGNED BUILD SUCCESS"
          echo "========================================"

          echo ""

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""

          echo "Module:"
          echo "${{ inputs.module }}"

          echo ""

          echo "SIGNED APK:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo ""

          echo "SIGNED AAB:"
          echo "$AAB_PATH"

          ls -lh "$AAB_PATH"

          echo ""

          echo "Artifacts:"
          echo "AndroidAIDE-Signed-APK"
          echo "AndroidAIDE-Signed-AAB"

          echo ""

          echo "========================================"
          echo "APK + AAB BUILD SUCCESSFUL"
          echo "========================================"
