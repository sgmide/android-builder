name: Build Signed APK / AAB

on:
  workflow_dispatch:
    inputs:

      module:
        description: "Gradle module"
        required: true
        default: "app"
        type: string

      store_password:
        description: "Keystore password"
        required: true
        type: string

      key_alias:
        description: "Key alias"
        required: true
        type: string

      key_password:
        description: "Key password"
        required: true
        type: string


permissions:
  contents: read


jobs:

  build:

    name: Build Signed APK and AAB

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # INSTALL SDK 35
      # ==========================================================

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================================
      # CHECK BUILD INPUTS
      # ==========================================================

      - name: Check build inputs
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          echo "Checking build input files..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found."
            exit 1
          fi

          if [ ! -f "build-input/signing-key.jks" ]; then
            echo "ERROR: build-input/signing-key.jks not found."
            exit 1
          fi

          if [ -z "$MODULE" ]; then
            echo "ERROR: module is empty."
            exit 1
          fi

          echo "Project ZIP:"
          ls -lh "build-input/project.zip"

          echo "Keystore:"
          ls -lh "build-input/signing-key.jks"

          echo "Module: $MODULE"


      # ==========================================================
      # PREPARE PROJECT
      # ==========================================================

      - name: Extract project
        shell: bash
        run: |

          set -e

          rm -rf android-project

          mkdir -p android-project

          unzip -q "build-input/project.zip" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 3 -type f | head -100


      # ==========================================================
      # DETECT PROJECT ROOT
      # ==========================================================

      - name: Detect Gradle project root
        shell: bash
        run: |

          set -e

          if [ -f "android-project/settings.gradle" ]; then

            PROJECT_DIR="android-project"

          elif [ -f "android-project/settings.gradle.kts" ]; then

            PROJECT_DIR="android-project"

          elif [ -f "android-project/project/settings.gradle" ]; then

            PROJECT_DIR="android-project/project"

          elif [ -f "android-project/project/settings.gradle.kts" ]; then

            PROJECT_DIR="android-project/project"

          else

            SETTINGS_FILE=$(find android-project \
              -maxdepth 4 \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -type f \
              | head -1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle or settings.gradle.kts not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project root:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"


      # ==========================================================
      # VALIDATE MODULE
      # ==========================================================

      - name: Validate Gradle module
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          MODULE_DIR="$PROJECT_DIR/$MODULE"

          echo "Checking module:"
          echo "$MODULE_DIR"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "ERROR: module directory does not exist:"
            echo "$MODULE_DIR"
            exit 1
          fi

          if [ -f "$MODULE_DIR/build.gradle" ]; then
            echo "Found:"
            echo "$MODULE_DIR/build.gradle"

          elif [ -f "$MODULE_DIR/build.gradle.kts" ]; then
            echo "Found:"
            echo "$MODULE_DIR/build.gradle.kts"

          else
            echo "ERROR: Gradle build file not found in:"
            echo "$MODULE_DIR"
            exit 1
          fi


      # ==========================================================
      # CHECK GRADLE WRAPPER
      # ==========================================================

      - name: Check Gradle wrapper
        shell: bash
        run: |

          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper found."

          grep -n "distributionUrl" \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
            || true


      # ==========================================================
      # DETECT MODULE GRADLE FILE
      # ==========================================================

      - name: Detect Gradle build file type
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          MODULE_DIR="$PROJECT_DIR/$MODULE"

          if [ -f "$MODULE_DIR/build.gradle" ]; then

            SIGNING_BUILD_FILE="$MODULE_DIR/build.gradle"
            SIGNING_BUILD_TYPE="groovy"

          elif [ -f "$MODULE_DIR/build.gradle.kts" ]; then

            SIGNING_BUILD_FILE="$MODULE_DIR/build.gradle.kts"
            SIGNING_BUILD_TYPE="kotlin"

          else

            echo "ERROR: Could not find module Gradle file."
            exit 1

          fi

          echo "SIGNING_BUILD_FILE=$SIGNING_BUILD_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_BUILD_TYPE=$SIGNING_BUILD_TYPE" >> "$GITHUB_ENV"

          echo "Gradle file:"
          echo "$SIGNING_BUILD_FILE"

          echo "Gradle type:"
          echo "$SIGNING_BUILD_TYPE"


      # ==========================================================
      # PREPARE TEMPORARY KEYSTORE
      # ==========================================================

      - name: Prepare temporary signing files
        shell: bash
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |

          set -e

          SIGNING_DIR="$PROJECT_DIR/.androidaide/signing"

          mkdir -p "$SIGNING_DIR"

          cp \
            "build-input/signing-key.jks" \
            "$SIGNING_DIR/release-key.jks"

          chmod 600 \
            "$SIGNING_DIR/release-key.jks"


          # ------------------------------------------------------
          # Create signing.properties safely
          # ------------------------------------------------------

          python3 - "$PROJECT_DIR" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" <<'PY'

          import sys
          from pathlib import Path

          project_dir = Path(sys.argv[1])

          store_password = sys.argv[2]
          key_alias = sys.argv[3]
          key_password = sys.argv[4]


          def escape_properties(value):
              value = str(value)

              value = value.replace("\\", "\\\\")
              value = value.replace("\n", "\\n")
              value = value.replace("\r", "\\r")

              return value


          properties_file = project_dir / "signing.properties"

          content = (
              "storeFile=.androidaide/signing/release-key.jks\n"
              "storePassword=" + escape_properties(store_password) + "\n"
              "keyAlias=" + escape_properties(key_alias) + "\n"
              "keyPassword=" + escape_properties(key_password) + "\n"
          )

          properties_file.write_text(
              content,
              encoding="utf-8"
          )

          print("signing.properties created.")

          PY

          chmod 600 "$PROJECT_DIR/signing.properties"


      # ==========================================================
      # VERIFY KEYSTORE
      # ==========================================================

      - name: Verify signing keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
        run: |

          set -e

          KEYSTORE="$PROJECT_DIR/.androidaide/signing/release-key.jks"

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            >/dev/null

          echo "Keystore is valid."


      # ==========================================================
      # BACKUP ORIGINAL GRADLE FILE
      # ==========================================================

      - name: Backup module Gradle file
        shell: bash
        run: |

          set -e

          cp \
            "$SIGNING_BUILD_FILE" \
            "$SIGNING_BUILD_FILE.androidaide-original"

          echo "Original Gradle file backed up."


      # ==========================================================
      # TEMPORARY SIGNING CONFIGURATION
      # ==========================================================

      - name: Inject temporary signing configuration
        shell: bash
        run: |

          set -e

          python3 \
            "$SIGNING_BUILD_FILE" \
            "$SIGNING_BUILD_TYPE" \
            "$PROJECT_DIR" <<'PY'

          import sys
          from pathlib import Path


          gradle_path = Path(sys.argv[1])
          gradle_type = sys.argv[2]
          project_dir = Path(sys.argv[3])


          text = gradle_path.read_text(
              encoding="utf-8"
          )


          marker_begin = "ANDROID_AIDE_AUTO_SIGNING_BEGIN"
          marker_end = "ANDROID_AIDE_AUTO_SIGNING_END"


          if marker_begin in text:

              print(
                  "Automatic signing configuration already exists."
              )

              sys.exit(0)


          # ======================================================
          # GROOVY
          # ======================================================

          if gradle_type == "groovy":

              signing_code = r'''

// ==========================================================
// ANDROID AIDE TEMPORARY AUTOMATIC SIGNING
// ==========================================================

// ANDROID_AIDE_AUTO_SIGNING_BEGIN

def androidAideSigningFile =
        rootProject.file("signing.properties")

def androidAideSigningProperties =
        new java.util.Properties()

if (androidAideSigningFile.exists()) {

    androidAideSigningFile.withInputStream {
        androidAideSigningProperties.load(it)
    }
}

android {
    signingConfigs {

        androidAideRelease {

            if (androidAideSigningFile.exists()) {

                storeFile =
                        rootProject.file(
                                androidAideSigningProperties.getProperty(
                                        "storeFile"
                                )
                        )

                storePassword =
                        androidAideSigningProperties.getProperty(
                                "storePassword"
                        )

                keyAlias =
                        androidAideSigningProperties.getProperty(
                                "keyAlias"
                        )

                keyPassword =
                        androidAideSigningProperties.getProperty(
                                "keyPassword"
                        )
            }
        }
    }

    buildTypes {

        release {

            signingConfig =
                    signingConfigs.androidAideRelease
        }
    }
}

// ANDROID_AIDE_AUTO_SIGNING_END

'''


          # ======================================================
          # KOTLIN DSL
          # ======================================================

          elif gradle_type == "kotlin":

              signing_code = r'''

// ==========================================================
// ANDROID AIDE TEMPORARY AUTOMATIC SIGNING
// ==========================================================

// ANDROID_AIDE_AUTO_SIGNING_BEGIN

val androidAideSigningFile =
    rootProject.file("signing.properties")

val androidAideSigningProperties =
    java.util.Properties()

if (androidAideSigningFile.exists()) {

    androidAideSigningFile.inputStream().use {
        androidAideSigningProperties.load(it)
    }
}

android {

    signingConfigs {

        create("androidAideRelease") {

            if (androidAideSigningFile.exists()) {

                storeFile =
                    rootProject.file(
                        androidAideSigningProperties.getProperty(
                            "storeFile"
                        )
                    )

                storePassword =
                    androidAideSigningProperties.getProperty(
                        "storePassword"
                    )

                keyAlias =
                    androidAideSigningProperties.getProperty(
                        "keyAlias"
                    )

                keyPassword =
                    androidAideSigningProperties.getProperty(
                        "keyPassword"
                    )
            }
        }
    }

    buildTypes {

        getByName("release") {

            signingConfig =
                signingConfigs.getByName(
                    "androidAideRelease"
                )
        }
    }
}

// ANDROID_AIDE_AUTO_SIGNING_END

'''


          else:

              print(
                  "ERROR: Unsupported Gradle type:"
                  + gradle_type
              )

              sys.exit(1)


          # ======================================================
          # APPEND TEMPORARY CONFIGURATION
          # ======================================================

          with gradle_path.open(
              "a",
              encoding="utf-8"
          ) as f:

              f.write(signing_code)


          print(
              "Temporary signing configuration injected successfully."
          )

          PY


      # ==========================================================
      # VERIFY SIGNING CONFIGURATION
      # ==========================================================

      - name: Verify signing configuration
        shell: bash
        run: |

          set -e

          echo "Checking signing injection..."

          if ! grep -q \
            "ANDROID_AIDE_AUTO_SIGNING_BEGIN" \
            "$SIGNING_BUILD_FILE"; then

            echo "ERROR: Signing configuration marker not found."
            exit 1

          fi


          if ! grep -q \
            "signingConfig" \
            "$SIGNING_BUILD_FILE"; then

            echo "ERROR: signingConfig not found."
            exit 1

          fi


          if ! grep -q \
            "androidAideRelease" \
            "$SIGNING_BUILD_FILE"; then

            echo "ERROR: androidAideRelease not found."
            exit 1

          fi


          echo ""
          echo "Temporary signing configuration:"
          echo "--------------------------------"

          sed -n \
            '/ANDROID_AIDE_AUTO_SIGNING_BEGIN/,/ANDROID_AIDE_AUTO_SIGNING_END/p' \
            "$SIGNING_BUILD_FILE"

          echo ""
          echo "Signing configuration verified."


      # ==========================================================
      # GRADLE VERSION
      # ==========================================================

      - name: Check Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          chmod +x ./gradlew

          ./gradlew --version


      # ==========================================================
      # GRADLE CLEAN
      # ==========================================================

      - name: Gradle clean
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          ./gradlew \
            clean \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # BUILD SIGNED APK + AAB
      # ==========================================================

      - name: Build signed APK and AAB
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "BUILD SIGNED APK"
          echo "=========================================="

          ./gradlew \
            ":${MODULE}:assembleRelease" \
            --stacktrace \
            --no-daemon \
            --info


          echo ""
          echo "=========================================="
          echo "BUILD SIGNED AAB"
          echo "=========================================="

          ./gradlew \
            ":${MODULE}:bundleRelease" \
            --stacktrace \
            --no-daemon \
            --info


      # ==========================================================
      # FIND SIGNED APK
      # ==========================================================

      - name: Find signed APK
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          APK_DIR="$PROJECT_DIR/$MODULE/build/outputs/apk/release"

          echo "APK directory:"
          echo "$APK_DIR"

          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: APK directory not found."

            find "$PROJECT_DIR/$MODULE/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "APK files:"
          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print


          APK_FILE=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            ! -name "*-unsigned.apk" \
            | head -1)


          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: Signed APK not found."

            echo ""
            echo "Available APK files:"

            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1

          fi


          echo ""
          echo "Signed APK:"
          echo "$APK_FILE"


          # ------------------------------------------------------
          # Verify APK is signed
          # ------------------------------------------------------

          if command -v apksigner >/dev/null 2>&1; then

            echo ""
            echo "Verifying APK signature..."

            apksigner verify \
              --verbose \
              "$APK_FILE"

          fi


          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # ==========================================================
      # FIND SIGNED AAB
      # ==========================================================

      - name: Find signed AAB
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          AAB_DIR="$PROJECT_DIR/$MODULE/build/outputs/bundle/release"

          echo "AAB directory:"
          echo "$AAB_DIR"


          if [ ! -d "$AAB_DIR" ]; then

            echo "ERROR: AAB directory not found."

            find "$PROJECT_DIR/$MODULE/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "AAB files:"

          find "$AAB_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            -print


          AAB_FILE=$(find "$AAB_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | head -1)


          if [ -z "$AAB_FILE" ]; then

            echo ""
            echo "ERROR: AAB not found."

            find "$AAB_DIR" \
              -type f \
              -print \
              || true

            exit 1

          fi


          echo ""
          echo "Signed AAB:"
          echo "$AAB_FILE"


          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"


      # ==========================================================
      # COPY TO STANDARD OUTPUT NAMES
      # ==========================================================

      - name: Prepare final signed outputs
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |

          set -e

          APK_OUTPUT_DIR="$PROJECT_DIR/$MODULE/build/outputs/apk/release"
          AAB_OUTPUT_DIR="$PROJECT_DIR/$MODULE/build/outputs/bundle/release"


          FINAL_APK="$APK_OUTPUT_DIR/app-release.apk"
          FINAL_AAB="$AAB_OUTPUT_DIR/app-release.aab"


          # ------------------------------------------------------
          # APK
          # ------------------------------------------------------

          if [ "$APK_FILE" != "$FINAL_APK" ]; then

            cp \
              "$APK_FILE" \
              "$FINAL_APK"

          fi


          # ------------------------------------------------------
          # AAB
          # ------------------------------------------------------

          if [ "$AAB_FILE" != "$FINAL_AAB" ]; then

            cp \
              "$AAB_FILE" \
              "$FINAL_AAB"

          fi


          # ------------------------------------------------------
          # Verify files
          # ------------------------------------------------------

          if [ ! -s "$FINAL_APK" ]; then

            echo "ERROR: Final APK is missing or empty."
            exit 1

          fi


          if [ ! -s "$FINAL_AAB" ]; then

            echo "ERROR: Final AAB is missing or empty."
            exit 1

          fi


          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_AAB=$FINAL_AAB" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "FINAL OUTPUTS"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh "$FINAL_APK"

          echo ""
          echo "AAB:"
          ls -lh "$FINAL_AAB"


      # ==========================================================
      # UPLOAD SIGNED APK ARTIFACT
      # ==========================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-APK
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # UPLOAD SIGNED AAB ARTIFACT
      # ==========================================================

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAIDE-Signed-AAB
          path: ${{ env.FINAL_AAB }}
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # FINAL SUMMARY
      # ==========================================================

      - name: Build summary
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "ANDROID AIDE BUILD SUCCESS"
          echo "=========================================="

          echo ""
          echo "Signed APK:"
          echo "$FINAL_APK"

          echo ""
          echo "Signed AAB:"
          echo "$FINAL_AAB"

          echo ""
          echo "Artifacts:"
          echo "  AndroidAIDE-Signed-APK"
          echo "  AndroidAIDE-Signed-AAB"

          echo ""
          echo "The local project Gradle file was only"
          echo "temporarily modified inside GitHub Actions."
          echo "The user's original local build.gradle"
          echo "remains unchanged."
