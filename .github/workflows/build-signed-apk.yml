name: Build Signed Android APK and AAB

on:
  workflow_dispatch:
    inputs:

      module:
        description: "Android module"
        required: true
        default: "app"

      store_password:
        description: "Keystore store password"
        required: true

      key_alias:
        description: "Keystore key alias"
        required: true

      key_password:
        description: "Keystore key password"
        required: true


jobs:

  build:

    runs-on: ubuntu-latest

    env:

      PROJECT_DIR: android-project

      MODULE: ${{ github.event.inputs.module }}

      STORE_PASSWORD: ${{ github.event.inputs.store_password }}

      KEY_ALIAS: ${{ github.event.inputs.key_alias }}

      KEY_PASSWORD: ${{ github.event.inputs.key_password }}


    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # JAVA 17
      # ---------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # ANDROID SDK
      # ---------------------------------------------------------

      - name: Setup Android SDK
        shell: bash
        run: |

          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK not found"
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/cmdline-tools/15.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/15.0/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/cmdline-tools/14.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/14.0/bin/sdkmanager"

          else

            SDKMANAGER=$(find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1 || true)

          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/35.0.0"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          echo "Installing Android SDK packages..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK setup completed"


      # ---------------------------------------------------------
      # CHECK SDK
      # ---------------------------------------------------------

      - name: Verify Android SDK tools
        shell: bash
        run: |

          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "SDK_ROOT=$SDK_ROOT"

          echo ""
          echo "adb:"
          "$SDK_ROOT/platform-tools/adb" version || true

          echo ""
          echo "aapt2:"
          "$SDK_ROOT/build-tools/35.0.0/aapt2" version || true

          echo ""
          echo "apksigner:"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" version


      # ---------------------------------------------------------
      # CHECK INPUT FILES
      # ---------------------------------------------------------

      - name: Check build input files
        shell: bash
        run: |

          set -e

          echo "Checking build-input..."

          if [ ! -f "build-input/project.zip" ]; then
            echo "ERROR: build-input/project.zip not found"
            exit 1
          fi

          if [ ! -f "build-input/signing-key.jks" ]; then
            echo "ERROR: build-input/signing-key.jks not found"
            exit 1
          fi

          echo ""
          echo "Project ZIP:"
          ls -lh build-input/project.zip

          echo ""
          echo "Signing key:"
          ls -lh build-input/signing-key.jks


      # ---------------------------------------------------------
      # EXTRACT PROJECT
      # ---------------------------------------------------------

      - name: Extract Android project
        shell: bash
        run: |

          set -e

          rm -rf "$PROJECT_DIR"

          mkdir -p "$PROJECT_DIR"

          unzip -q \
            "build-input/project.zip" \
            -d "$PROJECT_DIR"

          echo ""
          echo "Extracted project:"
          find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ---------------------------------------------------------
      # CHECK PROJECT STRUCTURE
      # ---------------------------------------------------------

      - name: Check Android project
        shell: bash
        run: |

          set -e

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""
          echo "MODULE:"
          echo "$MODULE"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1

          fi

          if [ ! -d "$PROJECT_DIR/$MODULE" ]; then
            echo "ERROR: module directory not found:"
            echo "$PROJECT_DIR/$MODULE"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo ""
          echo "Project structure OK"


      # ---------------------------------------------------------
      # COPY SIGNING KEY
      # ---------------------------------------------------------

      - name: Prepare signing key
        shell: bash
        run: |

          set -e

          cp \
            "build-input/signing-key.jks" \
            "$PROJECT_DIR/signing-key.jks"

          echo ""
          echo "Signing key prepared"

          ls -lh "$PROJECT_DIR/signing-key.jks"


      # ---------------------------------------------------------
      # CREATE SIGNING PROPERTIES
      # ---------------------------------------------------------

      - name: Create signing properties
        shell: bash
        run: |

          set -e

          cat > "$PROJECT_DIR/signing.properties" <<EOF
          storeFile=signing-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo ""
          echo "signing.properties created"

          if [ ! -f "$PROJECT_DIR/signing.properties" ]; then
            echo "ERROR: signing.properties was not created"
            exit 1
          fi


      # ---------------------------------------------------------
      # CREATE SIGNING INIT SCRIPT
      # ---------------------------------------------------------

      - name: Create signing init script
        shell: bash
        run: |

          set -e

          cat > "$PROJECT_DIR/android-aide-signing.init.gradle" <<'EOF'

          allprojects { project ->

              project.plugins.withId("com.android.application") {

                  def propsFile = new File(
                      project.rootProject.projectDir,
                      "signing.properties"
                  )

                  if (!propsFile.exists()) {
                      throw new GradleException(
                          "signing.properties not found: " +
                          propsFile.absolutePath
                      )
                  }

                  def props = new Properties()

                  propsFile.withInputStream { stream ->
                      props.load(stream)
                  }

                  def storeFileName =
                      props.getProperty("storeFile")

                  def storePassword =
                      props.getProperty("storePassword")

                  def keyAlias =
                      props.getProperty("keyAlias")

                  def keyPassword =
                      props.getProperty("keyPassword")

                  if (!storeFileName ||
                      !storePassword ||
                      !keyAlias ||
                      !keyPassword) {

                      throw new GradleException(
                          "Signing properties are incomplete"
                      )
                  }

                  def keystoreFile = new File(
                      project.rootProject.projectDir,
                      storeFileName
                  )

                  if (!keystoreFile.exists()) {
                      throw new GradleException(
                          "Keystore not found: " +
                          keystoreFile.absolutePath
                      )
                  }

                  def android =
                      project.extensions.getByName("android")

                  def signingConfig =
                      android.signingConfigs.findByName(
                          "androidAideRelease"
                      )

                  if (signingConfig == null) {

                      signingConfig =
                          android.signingConfigs.create(
                              "androidAideRelease"
                          )
                  }

                  signingConfig.storeFile =
                      keystoreFile

                  signingConfig.storePassword =
                      storePassword

                  signingConfig.keyAlias =
                      keyAlias

                  signingConfig.keyPassword =
                      keyPassword

                  android.buildTypes.release.signingConfig =
                      signingConfig

                  println ""
                  println "========================================"
                  println "Android Aide signing enabled"
                  println "Module       : " + project.name
                  println "Keystore     : " +
                      keystoreFile.absolutePath
                  println "Signing type : androidAideRelease"
                  println "========================================"
                  println ""
              }
          }

          EOF

          echo ""
          echo "Signing init script created"

          echo ""
          echo "Checking init script:"
          sed -n '1,220p' \
            "$PROJECT_DIR/android-aide-signing.init.gradle"


      # ---------------------------------------------------------
      # VALIDATE KEYSTORE
      # ---------------------------------------------------------

      - name: Validate signing key
        shell: bash
        run: |

          set -e

          KEYSTORE="$PROJECT_DIR/signing-key.jks"

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            >/dev/null

          echo ""
          echo "Keystore is valid"


      # ---------------------------------------------------------
      # SHOW GRADLE VERSION
      # ---------------------------------------------------------

      - name: Check Gradle
        shell: bash
        run: |

          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version


      # ---------------------------------------------------------
      # BUILD APK + AAB
      # ---------------------------------------------------------

      - name: Build signed APK and AAB
        shell: bash
        run: |

          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "MODULE:"
          echo "$MODULE"

          echo ""

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --init-script android-aide-signing.init.gradle \
            clean \
            ":$MODULE:assembleRelease" \
            ":$MODULE:bundleRelease"


      # ---------------------------------------------------------
      # FIND APK
      # ---------------------------------------------------------

      - name: Find APK
        shell: bash
        run: |

          set -e

          APK_PATH=""

          APK_PATH=$(find "$PROJECT_DIR/$MODULE/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"


      # ---------------------------------------------------------
      # FIND AAB
      # ---------------------------------------------------------

      - name: Find AAB
        shell: bash
        run: |

          set -e

          AAB_PATH=""

          AAB_PATH=$(find "$PROJECT_DIR/$MODULE/build/outputs/bundle" \
            -type f \
            -name "*.aab" \
            | head -n 1 || true)

          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB not found"
            exit 1
          fi

          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "AAB:"
          echo "$AAB_PATH"

          ls -lh "$AAB_PATH"


      # ---------------------------------------------------------
      # VERIFY APK SIGNATURE
      # ---------------------------------------------------------

      - name: Verify APK signature
        shell: bash
        run: |

          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            echo "$APKSIGNER"
            exit 1
          fi

          echo ""
          echo "Verifying APK:"
          echo "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "APK signature verification successful"


      # ---------------------------------------------------------
      # VERIFY AAB SIGNATURE
      # ---------------------------------------------------------

      - name: Verify AAB
        shell: bash
        run: |

          set -e

          echo ""
          echo "Verifying AAB:"
          echo "$AAB_PATH"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_PATH"

          echo ""
          echo "AAB verification successful"


      # ---------------------------------------------------------
      # SHOW OUTPUTS
      # ---------------------------------------------------------

      - name: Show build outputs
        shell: bash
        run: |

          set -e

          echo ""
          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""
          echo "APK:"
          ls -lh "$APK_PATH"

          echo ""
          echo "AAB:"
          ls -lh "$AAB_PATH"

          echo ""
          echo "All APK files:"
          find "$PROJECT_DIR/$MODULE/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo ""
          echo "All AAB files:"
          find "$PROJECT_DIR/$MODULE/build/outputs/bundle" \
            -type f \
            -name "*.aab" \
            -exec ls -lh {} \;


      # ---------------------------------------------------------
      # UPLOAD APK ARTIFACT
      # ---------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ---------------------------------------------------------
      # UPLOAD AAB ARTIFACT
      # ---------------------------------------------------------

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
